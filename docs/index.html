<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Meal Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3b82f6;--primary-lt:#1e3a5f;
  --ok:#22c55e;--ok-lt:#14532d;
  --warn:#f59e0b;--warn-lt:#451a03;
  --bad:#ef4444;--bad-lt:#450a0a;
  --bg:#0f172a;--surface:#1e293b;--border:#334155;
  --text:#f1f5f9;--muted:#94a3b8;
  --r:10px;--sh:0 1px 3px rgba(0,0,0,.4);--sh2:0 4px 12px rgba(0,0,0,.5)
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,.card,.preset-chip,.cmp-card{touch-action:manipulation}
#hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 20px 12px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.hdr-top h1{font-size:1.1rem;font-weight:800;white-space:nowrap}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat-lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat-val{font-size:13px;font-weight:700}
.pbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;position:relative}
.pbar-fill{height:100%;border-radius:3px;transition:width .3s,background .3s;max-width:100%}
.g{background:var(--ok)}.w{background:var(--warn)}.b{background:var(--bad)}
.meals-badge{display:inline-flex;align-items:center;gap:4px;background:var(--ok-lt);color:var(--ok);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.meals-badge.unmet{background:var(--bad-lt);color:var(--bad)}
.ex-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap}
.ex-row label{font-size:12px;font-weight:700;white-space:nowrap}
.goals-badge{display:none;align-items:center;gap:4px;background:var(--ok-lt);color:var(--ok);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700}
.relax-score{display:inline-flex;align-items:center;gap:4px;background:var(--ok-lt);color:var(--ok);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;margin-left:auto;cursor:default}
.relax-score.bad{background:var(--warn-lt);color:var(--warn)}
.week-strip{display:flex;align-items:center;gap:10px;padding:6px 20px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.week-strip b{color:var(--text)}
.week-strip .over{color:var(--bad)}
.week-strip .over b{color:var(--bad)}
.week-dots{display:inline-flex;gap:4px;align-items:center}
.week-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.week-dot.q{background:var(--ok)}
.week-dot.t{background:var(--primary)}
.week-strip .ok{color:var(--ok)} .week-strip .ok b{color:var(--ok)}
.wk-var{cursor:pointer}
.rpt{font-size:10px;opacity:.65;margin-left:3px;cursor:default}
.preset-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:32px}
.preset-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--primary);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;transition:background .15s,color .15s;color:var(--text)}
.preset-chip:hover{background:var(--primary);color:#fff}
.preset-chip .pc-cal{font-size:11px;color:var(--primary)}
.preset-chip:hover .pc-cal{color:rgba(255,255,255,.8)}
.preset-edit-row{display:grid;grid-template-columns:1fr 80px 30px;gap:6px;align-items:center;margin-bottom:6px}
.goals-badge.show{display:inline-flex}
#recompute-banner{display:flex;align-items:center;gap:8px;padding:8px 20px calc(8px + env(safe-area-inset-bottom));font-size:12px;font-weight:600;border-top:2px solid var(--warn);background:var(--warn-lt);color:var(--warn);position:fixed;bottom:0;left:0;right:0;z-index:200}
#recompute-banner.computing{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
#recompute-banner.hidden{display:none}
.btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.pri:hover{background:#1d4ed8}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.ok:hover{background:#15803d}
.btn.dng{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.dng:hover{background:#b91c1c}
.btn-sm{padding:3px 8px;font-size:11px}
input[type=number],input[type=text]{border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--text);background:var(--surface);width:80px}
input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.ex-row input[type=number]{width:90px}
select{border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--text);background:var(--surface);width:100%;cursor:pointer}
select:focus{outline:2px solid var(--primary);outline-offset:-1px}
select:disabled{opacity:.6;cursor:not-allowed}
#main{max-width:1400px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){
  #main{grid-template-columns:1fr;padding:10px;gap:12px}
  #hdr{padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
  .hdr-top{margin-bottom:8px}
  .hdr-top h1{font-size:.95rem}
  .hdr-actions{flex:1 1 220px;min-width:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .hdr-actions::-webkit-scrollbar{display:none}
  .stats-row{grid-template-columns:1fr 1fr;gap:6px 10px}
  .stat-val{font-size:12px}
  .ex-row{margin-top:6px;padding-top:6px;gap:6px}
  #sort-row{padding:0 10px}
  .food-grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:5px}
  #eaten-sec{padding:0 10px 24px}
  .plus-btn{padding:3px 10px;font-size:14px}
  .minus-btn{padding:3px 8px}
  .edit-btn{padding:3px 6px;font-size:11px}
  input[type=number],input[type=text],select{font-size:16px}
  #overlay{padding:8px}
  .mbox{padding:16px;max-height:calc(100dvh - 16px)}
}
.sec-hdr{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:6px}
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);cursor:pointer;text-align:left;transition:transform .12s,border-color .12s,box-shadow .12s,opacity .2s,filter .2s;position:relative;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:88px;user-select:none}
.card:hover:not(.grey){border-color:var(--primary);box-shadow:var(--sh2);transform:translateY(-2px)}
.card.grey{opacity:.32;filter:grayscale(.7);cursor:pointer}
.card.grey.dof1{opacity:.5;filter:grayscale(.35);border-color:rgba(239,68,68,.35)}
.card.grey.dof2{opacity:.56;filter:grayscale(.22);border-color:rgba(239,68,68,.62)}
.card.grey.dof3{opacity:.62;filter:grayscale(.1);border-color:var(--bad)}
.card.eaten{border-color:var(--primary);background:var(--primary-lt)}
.card.grey.eaten{opacity:.65;filter:grayscale(.35);border-color:var(--primary);background:var(--primary-lt)}
.card.xed{opacity:.35;filter:grayscale(.8);cursor:not-allowed;border-style:dashed;border-color:var(--bad)}
.card.xed.eaten{opacity:.55;filter:grayscale(.4);border-color:var(--bad);background:var(--bad-lt)}
.card.xed .cname{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.hbar{height:3px;width:100%;flex-shrink:0}
.cbody{padding:6px 7px 4px;flex:1;display:flex;flex-direction:column;gap:2px}
.cname{font-weight:700;font-size:12px;line-height:1.25}
.cstats{font-size:10px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap}
.cstats b{color:var(--text)}
.cfoot{display:flex;align-items:center;justify-content:space-between;padding:0 6px 5px;min-height:22px;gap:4px}
.sbadge{background:var(--primary);color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:800}
.sbadge.two{background:var(--muted)}
.plus-btn{background:var(--ok);color:#fff;border:none;border-radius:6px;padding:1px 7px;font-size:13px;font-weight:800;cursor:pointer;line-height:1.3;flex-shrink:0}
.plus-btn:hover{background:#15803d}
.minus-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:12px;font-weight:700;cursor:pointer;color:var(--bad);flex-shrink:0;line-height:1.2}
.minus-btn:hover{background:var(--bad-lt)}
.edit-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:1px 4px;font-size:10px;cursor:pointer;color:var(--muted);flex-shrink:0}
.edit-btn:hover{background:var(--bg);color:var(--text)}
.rbar{height:3px;width:100%;flex-shrink:0;background:var(--border)}
.rbar-fill{height:100%;transition:width .3s,background .3s}
.tracking-mode-banner{display:none;align-items:center;gap:8px;padding:8px 20px;font-size:12px;font-weight:600;border-bottom:2px solid var(--primary);background:var(--primary-lt);color:var(--primary);flex-wrap:wrap}
.tracking-mode-banner.show{display:flex}
.relax-banner{display:none;align-items:center;gap:8px;padding:8px 20px;font-size:12px;font-weight:600;border-bottom:2px solid var(--warn);background:var(--warn-lt);color:var(--warn);flex-wrap:wrap}
.relax-banner.show{display:flex}
#eaten-sec{max-width:1400px;margin:0 auto;padding:0 16px 28px}
#eaten-sec h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.eaten-list{display:flex;flex-wrap:wrap;gap:6px}
.eaten-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:7px;font-size:12px;box-shadow:var(--sh)}
.eaten-chip strong{font-weight:700}
.eaten-chip span{color:var(--muted)}
.rm-btn{background:none;border:none;color:var(--bad);cursor:pointer;font-size:14px;padding:0 2px;border-radius:4px;line-height:1}
.rm-btn:hover{background:var(--bad-lt)}
.empty{color:var(--muted);font-style:italic;font-size:13px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
#overlay.h{display:none}
.mbox{background:var(--surface);border-radius:var(--r);padding:22px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h2{font-size:1rem;font-weight:800;margin-bottom:18px}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}
.fg input[type=number],.fg input[type=text],.fg select{width:100%}
.fg input[type=range]{width:100%;cursor:pointer}
.rv{font-weight:800;color:var(--primary)}
.tog-row{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600}
.tog{width:34px;height:18px;background:var(--border);border-radius:9px;position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--primary)}
.tog::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.tog.on::after{left:18px}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.sep{height:1px;background:var(--border);margin:14px 0}
.note{font-size:11px;color:var(--muted);margin-top:4px}
.sec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.goal-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:8px}
.goal-row:last-child{border-bottom:none}
.goal-info{display:flex;align-items:center;gap:7px;flex:1;min-width:0;flex-wrap:wrap}
.goal-name{font-weight:700;font-size:13px}
.goal-badge{font-size:10px;color:var(--muted);background:var(--bg);border-radius:4px;padding:1px 5px;white-space:nowrap}
.goal-params{font-size:11px;color:var(--muted)}
.goal-actions{display:flex;gap:4px;flex-shrink:0}
.lib-banner{display:flex;align-items:center;gap:8px;padding:8px 20px;font-size:12px;font-weight:600;border-bottom:2px solid var(--primary);background:var(--primary-lt);color:var(--primary);flex-wrap:wrap}
.lib-banner.warn{border-color:var(--warn);background:var(--warn-lt);color:var(--warn)}
.cmp-card{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .15s,transform .12s;overflow:hidden;min-width:0}
.cmp-card:hover{border-color:var(--primary);transform:scale(1.03)}
.cmp-hbar{height:4px;width:100%}
.cmp-body{padding:14px}
.cmp-name{font-weight:800;font-size:13px;margin-bottom:6px;line-height:1.35}
.cmp-stats{font-size:11px;color:var(--muted);line-height:1.5}
.cmp-winner{text-align:center;padding:20px 0 8px}
#sort-row{max-width:1400px;margin:8px auto 0;padding:0 16px;display:flex;align-items:center;gap:8px}
#sort-row label{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
#sort-row select{width:auto}
.cat-sec{display:flex;flex-direction:column}
.cat-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;-webkit-user-select:none}
.cat-toggle{font-size:13px;transition:transform .2s;display:inline-block;color:var(--muted);padding-left:6px}
.cat-toggle.collapsed{transform:rotate(-90deg)}
.hidden{display:none}
.chat-log{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;margin-bottom:12px;padding-right:2px}
.chat-msg{border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.45;max-width:88%;white-space:pre-wrap;overflow-wrap:break-word}
.chat-msg.user{align-self:flex-end;background:var(--primary);color:#fff}
.chat-msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--border)}
.chat-msg.sys{align-self:center;background:none;color:var(--muted);font-size:11px;font-style:italic;padding:0;max-width:100%}
.chat-msg.tool{align-self:flex-start;background:var(--ok-lt);color:var(--ok);font-size:12px;font-weight:600;padding:5px 10px}
.chat-input-row{display:flex;gap:6px}
.chat-input-row input{flex:1;width:auto}
</style>
</head>
<body>

<div id="hdr">
  <div class="hdr-top">
    <h1>🍽 Meal Planner</h1>
    <div class="hdr-actions">
      <button class="btn" id="btn-add">＋ Add Food</button>
      <button class="btn" id="btn-ai">✨ AI</button>
      <button class="btn" id="btn-library">📚 Library</button>
      <button class="btn" id="btn-settings">⚙ Goals</button>
      <button class="btn" id="btn-tabs">⊞ Tabs</button>
      <button class="btn" id="btn-compare">⚔ Compare</button>
      <button class="btn" id="btn-reset">↺ Reset Day</button>
    </div>
  </div>
  <div class="stats-row" id="stats-row"></div>
  <div class="ex-row">
    <label>⚡ Exercise burned:</label>
    <input type="number" id="ex-input" min="0" max="5000" step="10" placeholder="0">
    <span style="font-size:11px;color:var(--muted)">cal</span>
    <button class="btn btn-sm" id="btn-ex-presets">Presets ▾</button>
    <div class="relax-score" id="relax-score" title="Goal relaxations today">🔓 0</div>
    <div class="goals-badge" id="goals-badge">✓ All Goals Met!</div>
  </div>
</div>

<div id="lib-banner" class="hidden"></div>
<div id="tracking-banner" class="tracking-mode-banner"></div>
<div id="relax-banner" class="relax-banner"></div>
<div id="week-strip" class="week-strip"></div>
<div id="recompute-banner" class="hidden"></div>

<div id="sort-row">
  <label>Sort:</label>
  <select id="sort-sel">
    <option value="name">Name (A–Z)</option>
    <option value="cal_asc">Calories ↑</option>
    <option value="cal_desc">Calories ↓</option>
    <option value="health_desc">Health ↓</option>
    <option value="pro_desc">Protein ↓</option>
    <option value="pro_cal_desc">Protein/Cal ↓</option>
  </select>
</div>

<div id="main"></div>

<div id="eaten-sec">
  <h2>Eaten Today</h2>
  <div class="eaten-list" id="eaten-list"></div>
</div>

<div id="overlay" class="h">
  <div class="mbox" id="mbox"></div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════
//  BASE FOODS  (extras: all non-cal goal metrics)
// ═══════════════════════════════════════════════
const BASE_FOODS = [
  {id:'bagel',         name:'Bagel',                            cal:330,  meal:true,  extras:{pro:10, health:.35}},
  {id:'burger',        name:'Burger',                           cal:325,  meal:true,  extras:{pro:22, health:.45}},
  {id:'chipotle',      name:'Chipotle Chicken Burrito',         cal:1050, meal:true,  extras:{pro:61, health:.55}},
  {id:'huel',          name:'Huel',                             cal:505,  meal:true,  extras:{pro:42, health:.85}},
  {id:'mac-cheese',    name:'Mac and Cheese',                   cal:669,  meal:true,  extras:{pro:33, health:.55}},
  {id:'noodles',       name:'Noodles with Sunflower Seed Sauce',cal:352,  meal:true,  extras:{pro:14, health:.55}},
  {id:'oatmeal',       name:'Oatmeal',                          cal:159,  meal:true,  extras:{pro:6,  health:.75}},
  {id:'pancakes',      name:'Pancakes and Sausage',             cal:360,  meal:true,  extras:{pro:31, health:.55}},
  {id:'ramen',         name:'Ramen',                            cal:451,  meal:true,  extras:{pro:14, health:.30}},
  {id:'spaghetti',     name:'Spaghetti',                        cal:460,  meal:true,  extras:{pro:24, health:.55}},
  {id:'turkey-bec',    name:'Turkey Bacon Egg and Cheese',      cal:690,  meal:true,  extras:{pro:30, health:.65}},
  {id:'taco-bell',     name:'Taco Bell Bean Burrito',           cal:360,  meal:true,  extras:{pro:13, health:.40}},
  {id:'twice-potato',  name:'Twice Baked Potato',               cal:283,  meal:true,  extras:{pro:8,  health:.45}},
  {id:'cereal',        name:'Cereal',                           cal:150,  meal:false, extras:{pro:8,  health:.45}},
  {id:'chips',         name:'Chips',                            cal:150,  meal:false, extras:{pro:2,  health:.15}},
  {id:'granola',       name:'Honey and Oat Granola',            cal:232,  meal:false, extras:{pro:2,  health:.65}},
  {id:'egg',           name:'Hard Boiled Egg',                  cal:78,   meal:false, extras:{pro:6,  health:.85}},
  {id:'bread',         name:'Homemade Bread',                   cal:223,  meal:false, extras:{pro:4,  health:.55}},
  {id:'popcorn',       name:'Popcorn',                          cal:230,  meal:false, extras:{pro:5,  health:.55}},
  {id:'protein-bar',   name:'Protein Bar',                      cal:190,  meal:false, extras:{pro:21, health:.40}},
  {id:'protein-fluff', name:'Protein Fluff',                    cal:395,  meal:false, extras:{pro:41, health:.70}},
  {id:'chickpeas',     name:'Roasted Chickpeas',                cal:244,  meal:false, extras:{pro:10, health:.85}},
  {id:'cheese-salami', name:'Snack Cheese and Salami',          cal:230,  meal:false, extras:{pro:13, health:.35}},
  {id:'apple',         name:'Apple',                            cal:95,   meal:false, extras:{pro:0,  health:.95}},
  {id:'feastable',     name:'Feastable',                        cal:180,  meal:false, extras:{pro:3,  health:.15}},
  {id:'ice-cream',     name:'Ice Cream Sandwich',               cal:175,  meal:false, extras:{pro:3,  health:.10}},
  {id:'fronen',        name:'Fronen',                           cal:350,  meal:false, extras:{pro:3,  health:.15}},
];

// ═══════════════════════════════════════════════
//  DEFAULT GOALS
// ═══════════════════════════════════════════════
const DEF_GOALS = [
  {id:'cal',    name:'Calories',     unit:'cal', type:'range',     goal:1900, range:50,    default:0,   builtin:true},
  {id:'pro',    name:'Protein',      unit:'g',   type:'min',       threshold:80,            default:0,   builtin:true},
  {id:'health', name:'Health Score', unit:'',    type:'avg_min',   threshold:0.6,           default:0.5, builtin:true},
  {id:'meals',  name:'Meals',        unit:'',    type:'count_min', threshold:2,             default:0,   builtin:true, targetCategory:'meals'},
  // weekly:true → threshold is a WEEKLY budget; today's effective cap is what
  // remains after the trailing qualifying days' spend (see baseThr). Ships
  // disabled so the plan solver ignores it until per-food costs are entered.
  {id:'cost',   name:'Cost',         unit:'$',   type:'max',       threshold:70,            default:0,   builtin:true, weekly:true, enabled:false},
];
const DEF_EXERCISE_PRESETS = [
  {id:'ep-walk30',     name:'Walk (30 min)',     cal:150},
  {id:'ep-walk60',     name:'Walk (1 hr)',        cal:300},
  {id:'ep-run30',      name:'Run (30 min)',       cal:350},
  {id:'ep-tennis',     name:'Tennis',             cal:400},
  {id:'ep-gymnastics', name:'Gymnastics',         cal:500},
  {id:'ep-biking60',   name:'Biking (1 hr)',      cal:450},
  {id:'ep-swimming30', name:'Swimming (30 min)',  cal:300},
];
const DEF_CATEGORIES = [
  {id:'meals',  name:'Meals',          collapsed:false},
  {id:'snacks', name:'Snacks & Other', collapsed:false},
];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let S = {
  goals:            [],  // [{id,name,unit,type,goal?,range?,threshold?,default,builtin,enabled?}] — enabled===false means off; undefined = on
  exercisePresets:  [],  // [{id,name,cal}] — editable activity presets
  categories:       [],  // [{id,name,collapsed}] — display tabs
  sort:             'name', // active sort key
  servings: {},          // id→count (fractional allowed)
  exCals:   0,
  overrides:{},          // id→{name?,cal?,extras?,category?}  (base food edits)
  custom:   [],          // permanent custom foods [{id,name,cal,extras,category?}]
  temp:     [],          // day-scoped custom foods (persist in day state; gone next day)
  precomp:  null,
  incFeas:  null,
  excluded: {},
  trackingMode: false,
  tempGoals: {},        // goalId→relaxed goal/threshold for today (degrees-of-failure)
  relaxScore: 0,        // # of goal relaxations today (cumulative; restore doesn't undo)
};

let _computing    = false;
let _worker       = null;
let _incComputing = false;
let _incWorker    = null;

// ═══════════════════════════════════════════════
//  WEB WORKER  (generalized branch-and-bound)
// ═══════════════════════════════════════════════
const WORKER_CODE = `
'use strict';
self.onmessage = function(e) {
  const {foods, goals, exCals = 0, currentServings = {}, excludedIds = []} = e.data;

  // Locate goals by type
  const calGoal     = goals.find(g => g.id === 'cal');
  const calMin      = calGoal.goal - calGoal.range + exCals;
  const calMax      = calGoal.goal + calGoal.range + exCals;
  const calGoalIdx  = goals.indexOf(calGoal);

  const minGoals    = goals.filter(g => g.type === 'min');
  const maxGoals    = goals.filter(g => g.type === 'max');
  const avgMinGoals = goals.filter(g => g.type === 'avg_min');
  const avgMaxGoals = goals.filter(g => g.type === 'avg_max');
  const cntGoal     = goals.find(g => g.type === 'count_min');
  const numGoals    = goals.length;

  // Pre-compute goal indices (avoid indexOf in hot loop)
  const minIdx    = minGoals.map(g => goals.indexOf(g));
  const maxIdx    = maxGoals.map(g => goals.indexOf(g));
  const avgMinIdx = avgMinGoals.map(g => goals.indexOf(g));
  const avgMaxIdx = avgMaxGoals.map(g => goals.indexOf(g));
  const cntIdx    = cntGoal ? goals.indexOf(cntGoal) : -1;

  // Sort by cal desc: ceiling prune fires earlier
  foods.sort((a, b) => b.cal - a.cal);
  const n = foods.length;

  // Map food ID → sorted index (needed to look up currentServings by ID)
  const foodIdxMap = {};
  for (let i = 0; i < n; i++) foodIdxMap[foods[i].id] = i;

  // Per-food remaining capacity: 2 minus already eaten, 0 for excluded
  const excludedSet = new Set(excludedIds);
  const maxAdd = new Uint8Array(n);
  let numAddable = 0;
  for (let i = 0; i < n; i++) {
    if (excludedSet.has(foods[i].id)) { maxAdd[i] = 0; continue; }
    const eaten = currentServings[foods[i].id] || 0;
    maxAdd[i] = Math.max(0, (foods[i].maxServings || 2) - eaten);
    if (maxAdd[i] > 0) numAddable++;
  }

  // Extract metrics[goalIdx][foodIdx] as typed arrays
  function getM(f, g) {
    if (g.type === 'count_min') {
      if (g.targetCategory) return f._cat === g.targetCategory ? 1 : 0;
      return f.meal ? 1 : 0;
    }
    const v = f.extras && f.extras[g.id] !== undefined ? f.extras[g.id] : (g.default || 0);
    return +v;
  }
  const metrics = goals.map(g => {
    const a = new Float64Array(n);
    for (let i = 0; i < n; i++) a[i] = g.id === 'cal' ? foods[i].cal : getM(foods[i], g);
    return a;
  });

  // Suffix bounds — use maxAdd so pruning reflects actual remaining capacity
  const sufCal = new Float64Array(n + 1);
  for (let i = n-1; i >= 0; i--) sufCal[i] = sufCal[i+1] + foods[i].cal * maxAdd[i];

  // sufMax[gi][i] = max additional sum of metric gi from foods[i..n-1]
  const sufMax = goals.map((g, gi) => {
    if (g.type !== 'min' && g.type !== 'count_min') return null;
    const a = new Float64Array(n + 1);
    for (let i = n-1; i >= 0; i--) a[i] = a[i+1] + metrics[gi][i] * maxAdd[i];
    return a;
  });

  // sufMaxHS[k][i] for avg_min goals: max health surplus from remaining
  const sufMaxHS = avgMinGoals.map((g, k) => {
    const gi = avgMinIdx[k];
    const a = new Float64Array(n + 1);
    for (let i = n-1; i >= 0; i--) {
      const best = (metrics[gi][i] - g.threshold) * foods[i].cal * maxAdd[i];
      a[i] = a[i+1] + (best > 0 ? best : 0);
    }
    return a;
  });

  // sufMaxHD[k][i] for avg_max goals: max budget recovery from remaining
  const sufMaxHD = avgMaxGoals.map((g, k) => {
    const gi = avgMaxIdx[k];
    const a = new Float64Array(n + 1);
    for (let i = n-1; i >= 0; i--) {
      const best = (g.threshold - metrics[gi][i]) * foods[i].cal * maxAdd[i];
      a[i] = a[i+1] + (best > 0 ? best : 0);
    }
    return a;
  });

  // Initialize running state from already-eaten foods (the fixed part of the plan)
  let calNow = 0;
  const gSums = new Float64Array(numGoals);
  const avgHW = new Float64Array(numGoals);
  for (const [foodId, servings] of Object.entries(currentServings)) {
    if (!servings) continue;
    const fi = foodIdxMap[foodId];
    if (fi === undefined) continue;
    const f = foods[fi];
    calNow += f.cal * servings;
    for (let gi = 0; gi < numGoals; gi++) {
      if (goals[gi].id === 'cal') continue;
      gSums[gi] += metrics[gi][fi] * servings;
    }
    for (let k = 0; k < avgMinGoals.length; k++) {
      const gi = avgMinIdx[k];
      avgHW[gi] += metrics[gi][fi] * f.cal * servings;
    }
    for (let k = 0; k < avgMaxGoals.length; k++) {
      const gi = avgMaxIdx[k];
      avgHW[gi] += metrics[gi][fi] * f.cal * servings;
    }
  }

  // Mutable search state — saved/restored via pre-allocated stack
  const srv      = new Uint8Array(n);
  const stSums   = new Float64Array(n * numGoals);
  const stAvgHW  = new Float64Array(n * numGoals);

  // feasBits[i] = 1 once food i appears in any valid completion with >0 additional servings
  const feasBits = new Uint8Array(n);
  let feasCount  = 0;
  let planCount  = 0;
  let done       = false;
  const COUNT_CAP = 1_000_000;

  function search(i) {
    if (done) return;
    if (i === n) {
      if (calNow < calMin || calNow > calMax) return;
      for (let k = 0; k < minGoals.length; k++)
        if (gSums[minIdx[k]] < minGoals[k].threshold) return;
      for (let k = 0; k < maxGoals.length; k++)
        if (gSums[maxIdx[k]] > maxGoals[k].threshold) return;
      for (let k = 0; k < avgMinGoals.length; k++) {
        const gi = avgMinIdx[k];
        if (calNow > 0 && avgHW[gi] / calNow < avgMinGoals[k].threshold) return;
      }
      for (let k = 0; k < avgMaxGoals.length; k++) {
        const gi = avgMaxIdx[k];
        if (calNow > 0 && avgHW[gi] / calNow > avgMaxGoals[k].threshold) return;
      }
      if (cntGoal && gSums[cntIdx] < cntGoal.threshold) return;
      for (let j = 0; j < n; j++) {
        if (srv[j] > 0 && !feasBits[j]) { feasBits[j] = 1; feasCount++; }
      }
      planCount++;
      if (feasCount >= numAddable || planCount >= COUNT_CAP) done = true;
      return;
    }

    const fCal    = foods[i].cal;
    const remCal  = sufCal[i + 1];
    const base    = i * numGoals;
    const prevCal = calNow;

    stSums.set(gSums, base);
    stAvgHW.set(avgHW, base);

    for (let s = 0; s <= maxAdd[i]; s++) {
      const newCal = prevCal + fCal * s;
      if (newCal > calMax) break;
      if (newCal + remCal < calMin) continue;

      let prune = false;

      // min goals: floor prune
      for (let k = 0; k < minGoals.length && !prune; k++) {
        const gi = minIdx[k];
        if (stSums[base+gi] + metrics[gi][i]*s + sufMax[gi][i+1] < minGoals[k].threshold) prune = true;
      }
      if (prune) continue;

      // max goals: ceiling prune (monotone — break if violated)
      if (s > 0) {
        for (let k = 0; k < maxGoals.length && !prune; k++) {
          const gi = maxIdx[k];
          if (stSums[base+gi] + metrics[gi][i]*s > maxGoals[k].threshold) prune = true;
        }
        if (prune) break;
      }

      // avg_min: health-surplus prune
      for (let k = 0; k < avgMinGoals.length && !prune; k++) {
        const gi = avgMinIdx[k];
        const newHW = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
        if (newHW - avgMinGoals[k].threshold*newCal + sufMaxHS[k][i+1] < -1e-6) prune = true;
      }
      if (prune) continue;

      // avg_max: budget-surplus prune
      for (let k = 0; k < avgMaxGoals.length && !prune; k++) {
        const gi = avgMaxIdx[k];
        const newHW = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
        if (avgMaxGoals[k].threshold*newCal - newHW + sufMaxHD[k][i+1] < -1e-6) prune = true;
      }
      if (prune) continue;

      // count_min: floor prune
      if (cntGoal) {
        const newM = stSums[base+cntIdx] + metrics[cntIdx][i]*s;
        if (newM + sufMax[cntIdx][i+1] < cntGoal.threshold) continue;
      }

      for (let gi = 0; gi < numGoals; gi++) {
        if (gi === calGoalIdx) continue;
        gSums[gi] = stSums[base+gi] + metrics[gi][i]*s;
      }
      for (let k = 0; k < avgMinGoals.length; k++) {
        const gi = avgMinIdx[k];
        avgHW[gi] = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
      }
      for (let k = 0; k < avgMaxGoals.length; k++) {
        const gi = avgMaxIdx[k];
        avgHW[gi] = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
      }
      calNow = newCal;
      srv[i] = s;

      search(i + 1);
    }

    calNow = prevCal;
    gSums.set(stSums.subarray(base, base+numGoals));
    avgHW.set(stAvgHW.subarray(base, base+numGoals));
    srv[i] = 0;
  }

  search(0);

  const feasMap = {};
  for (let i = 0; i < n; i++) feasMap[foods[i].id] = maxAdd[i] > 0 && feasBits[i] > 0;

  self.postMessage({feasMap, count: planCount, truncated: done, foodIds: foods.map(f => f.id), n});
};
`;

// ═══════════════════════════════════════════════
//  PERSISTENCE HELPERS
// ═══════════════════════════════════════════════
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
};
const PFX = 'mpv7_';
function lk(k){return PFX+k;}
function todayStr(){return new Date().toISOString().slice(0,10);}
function dateStrDaysAgo(n){return new Date(Date.now()-n*864e5).toISOString().slice(0,10);}
function todayKey(){return lk('day_'+todayStr());}

// ═══════════════════════════════════════════════
//  INDEXEDDB  (stores file handle across sessions)
// ═══════════════════════════════════════════════
const IDB = {
  _db:null,
  async open(){
    if(this._db) return this._db;
    return new Promise((res,rej)=>{
      const r=indexedDB.open('mpv7-lib',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
      r.onsuccess=e=>{this._db=e.target.result;res(this._db);};
      r.onerror=rej;
    });
  },
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const r=tx.objectStore('kv').get(k);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=rej;});},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=rej;});}
};

// ═══════════════════════════════════════════════
//  FILE SYSTEM  (food-library.json persistence)
// ═══════════════════════════════════════════════
let _libFileHandle = null;
const HAS_FSA = typeof window !== 'undefined' && !!window.showOpenFilePicker;

function showLibBanner(mode, handle, action){
  const el=document.getElementById('lib-banner');
  if(mode==='unlinked'){
    el.className='lib-banner';
    el.innerHTML='📂 Link a library file to persist your food data across browser clears. &nbsp;'+
      '<button class="btn btn-sm pri" id="lbtn-open">Open Existing</button> '+
      '<button class="btn btn-sm" id="lbtn-new">Create New</button> '+
      '<button class="btn btn-sm" style="margin-left:auto" id="lbtn-dismiss">Dismiss</button>';
    document.getElementById('lbtn-open').addEventListener('click',pickLibFile);
    document.getElementById('lbtn-new').addEventListener('click',newLibFile);
    document.getElementById('lbtn-dismiss').addEventListener('click',()=>{LS.set(lk('lib_dismissed'),true);el.className='hidden';});
  } else if(mode==='reauth'){
    // action:'load' = startup (file is source of truth); 'save' = mid-session
    // (in-memory state is newer than the file — write, don't load)
    action=action||'load';
    el.className='lib-banner warn';
    el.innerHTML='🔒 Re-authorize library file to '+(action==='save'?'keep your backup up to date':'load your saved food data')+'. &nbsp;'+
      '<button class="btn btn-sm pri" id="lbtn-reauth">Re-authorize</button> '+
      '<button class="btn btn-sm" id="lbtn-unlink-b">Unlink File</button>'+
      '<small style="flex-basis:100%;font-weight:400;opacity:.8">Tip: pick &ldquo;Allow on every visit&rdquo; in the browser prompt and this will never ask again.</small>';
    document.getElementById('lbtn-reauth').addEventListener('click',async()=>{
      try{
        const perm=await handle.requestPermission({mode:'readwrite'});
        if(perm==='granted'){
          _libFileHandle=handle;el.className='hidden';
          if(action==='save'){await writeLibraryFile();}
          else{await loadLibraryFromFile();render();if(!precompIsValid()&&!_computing)startPrecompute();}
        }
      }catch(e){}
    });
    document.getElementById('lbtn-unlink-b').addEventListener('click',()=>unlinkLibFile());
  } else {
    el.className='hidden';
  }
}

async function initLibFile(){
  if(!HAS_FSA){
    // No File System Access API (mobile browsers): offer a one-time import when the library looks empty
    if(!LS.get(lk('lib_dismissed'),false) && !S.custom.length && !Object.keys(S.overrides).length){
      const el=document.getElementById('lib-banner');
      el.className='lib-banner';
      el.innerHTML='📂 Have a food-library.json backup? Import it to bring your foods over. &nbsp;'+
        '<button class="btn btn-sm pri" id="lbtn-imp-b">Import JSON</button> '+
        '<button class="btn btn-sm" style="margin-left:auto" id="lbtn-dismiss-b">Dismiss</button>';
      document.getElementById('lbtn-imp-b').addEventListener('click',()=>{el.className='hidden';importLibraryJSON();});
      document.getElementById('lbtn-dismiss-b').addEventListener('click',()=>{LS.set(lk('lib_dismissed'),true);el.className='hidden';});
    }
    return;
  }
  try{
    const handle=await IDB.get('libFileHandle');
    if(handle){
      const perm=await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted'){_libFileHandle=handle;await loadLibraryFromFile();return;}
      // Permission lapsed. Never auto-prompt (the old first-click reauth fired a
      // surprise browser dialog every session) — show the passive banner and let
      // the user grant deliberately. Chrome's prompt offers "Allow on every
      // visit"; once chosen, queryPermission returns 'granted' on future visits
      // and this banner never appears again. localStorage remains the source of
      // truth meanwhile, so nothing is lost while unauthorized.
      showLibBanner('reauth',handle,'load');
      return;
    }
  }catch(e){}
  if(!LS.get(lk('lib_dismissed'),false)) showLibBanner('unlinked');
}

async function pickLibFile(){
  if(!HAS_FSA) return;
  try{
    const [handle]=await window.showOpenFilePicker({types:[{description:'Food Library',accept:{'application/json':['.json']}}]});
    _libFileHandle=handle;
    await IDB.set('libFileHandle',handle);
    const data=await readLibFile(handle);
    if(data) applyLibrary(data);
    await writeLibraryFile();
    document.getElementById('lib-banner').className='hidden';
    LS.set(lk('lib_dismissed'),false);
    saveState(); render();
  }catch(e){if(e.name!=='AbortError')console.error(e);}
}

async function newLibFile(){
  if(!window.showSaveFilePicker) return;
  try{
    const handle=await window.showSaveFilePicker({types:[{description:'Food Library',accept:{'application/json':['.json']}}],suggestedName:'food-library.json'});
    _libFileHandle=handle;
    await IDB.set('libFileHandle',handle);
    await writeLibraryFile();
    document.getElementById('lib-banner').className='hidden';
    LS.set(lk('lib_dismissed'),false);
  }catch(e){if(e.name!=='AbortError')console.error(e);}
}

async function unlinkLibFile(){
  _libFileHandle=null;
  try{await IDB.del('libFileHandle');}catch(e){}
  LS.set(lk('lib_dismissed'),false);
  showLibBanner('unlinked');
}

async function readLibFile(handle){
  try{const file=await handle.getFile();return JSON.parse(await file.text());}catch{return null;}
}

async function loadLibraryFromFile(){
  if(!_libFileHandle) return;
  const data=await readLibFile(_libFileHandle);
  if(data) applyLibrary(data);
}

function mergeGoals(saved){
  const merged=DEF_GOALS.map(def=>{const sv=saved.find(g=>g.id===def.id);return sv?{...def,...sv,id:def.id,builtin:true}:{...def};});
  return [...merged,...saved.filter(g=>!g.builtin)];
}

function applyLibrary(data){
  if(!data||typeof data!=='object') return;
  if(Array.isArray(data.goals)) S.goals=mergeGoals(data.goals);
  if(data.overrides&&typeof data.overrides==='object') S.overrides=data.overrides;
  if(Array.isArray(data.custom)) S.custom=data.custom;
  if(Array.isArray(data.exercisePresets)) S.exercisePresets=data.exercisePresets;
  if(Array.isArray(data.categories)) S.categories=data.categories;
}

let _libSaveTimer=null;
function saveLibraryToFile(){
  if(!_libFileHandle) return;
  clearTimeout(_libSaveTimer);
  _libSaveTimer=setTimeout(()=>{_libSaveTimer=null;writeLibraryFile();},1000);
}
// Flush a pending debounced save when the app is backgrounded/closed, so the
// file never lags behind localStorage across sessions.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&_libSaveTimer){
    clearTimeout(_libSaveTimer);_libSaveTimer=null;writeLibraryFile();
  }
});
async function writeLibraryFile(){
  if(!_libFileHandle) return;
  try{
    // Background saves must never trigger a permission prompt (mobile Chrome
    // doesn't persist the grant and would re-prompt on every write) — if not
    // granted, show the reauth banner and let the user grant via a gesture.
    const perm=await _libFileHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){showLibBanner('reauth',_libFileHandle,'save');return;}
    const lib={version:1,goals:S.goals,overrides:S.overrides,custom:S.custom,exercisePresets:S.exercisePresets,categories:S.categories};
    const w=await _libFileHandle.createWritable();
    await w.write(JSON.stringify(lib,null,2));
    await w.close();
  }catch(e){console.error('Library save failed:',e);}
}

function exportLibraryJSON(){
  const lib={version:1,goals:S.goals,overrides:S.overrides,custom:S.custom,exercisePresets:S.exercisePresets,categories:S.categories};
  const blob=new Blob([JSON.stringify(lib,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='food-library.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function importLibraryJSON(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.addEventListener('change',async()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    try{
      const data=JSON.parse(await file.text());
      if(!data||typeof data!=='object'||(!data.goals&&!data.custom&&!data.overrides)) throw new Error('bad format');
      applyLibrary(data);
      saveState(); render();
      if(!precompIsValid()&&!_computing) startPrecompute();
      closeModal(); openLibraryModal();
    }catch(e){ alert('Could not read that file — is it a food-library.json export?'); }
  });
  inp.click();
}

function loadState(){
  // Library: goals + overrides + custom from localStorage (fast sync load; may be overridden by file)
  const saved = LS.get(lk('goals'), null);
  S.goals = Array.isArray(saved) ? mergeGoals(saved) : DEF_GOALS.map(g=>({...g}));
  S.overrides        = LS.get(lk('overrides'), {});
  S.custom           = LS.get(lk('custom'), []);
  S.exercisePresets  = LS.get(lk('exPresets'), null) || DEF_EXERCISE_PRESETS.map(p=>({...p}));
  const savedCats    = LS.get(lk('categories'), null);
  S.categories       = Array.isArray(savedCats) ? savedCats : DEF_CATEGORIES.map(c=>({...c}));
  S.sort             = LS.get(lk('sort'), 'name');
  // Daily state stays in localStorage (ephemeral)
  const day   = LS.get(todayKey(), {servings:{}, exCals:0, excluded:{}, trackingMode:false});
  S.servings     = day.servings     || {};
  S.exCals       = day.exCals       || 0;
  S.excluded     = day.excluded     || {};
  S.trackingMode = day.trackingMode || false;
  S.tempGoals    = day.tempGoals    || {};
  S.relaxScore   = day.relaxScore   || 0;
  S.temp         = Array.isArray(day.temp) ? day.temp : [];
  HIST = LS.get(lk('hist'), {}) || {};
  _histDay = null; _trailCache = null;
  ensureHistory();   // finalize any past day keys into HIST
  loadPrecomp();
}

function saveState(){
  _trailCache = null; // library/goal edits can re-price past days
  // Always keep localStorage in sync as a fast backup
  LS.set(lk('goals'),      S.goals);
  LS.set(lk('overrides'),  S.overrides);
  LS.set(lk('custom'),     S.custom);
  LS.set(lk('exPresets'),  S.exercisePresets);
  LS.set(lk('categories'), S.categories);
  LS.set(lk('sort'),       S.sort);
  saveDayState();
  // Also persist library to file (async, fire-and-forget)
  saveLibraryToFile();
}
function saveDayState(){
  LS.set(todayKey(), {servings:S.servings, exCals:S.exCals, excluded:S.excluded, trackingMode:S.trackingMode, tempGoals:S.tempGoals||{}, relaxScore:S.relaxScore||0, temp:S.temp||[]});
}

// ═══════════════════════════════════════════════
//  FOOD UTILITIES
// ═══════════════════════════════════════════════
function allFoods({includeArchived=false}={}){
  const base = BASE_FOODS.map(f => {
    const ov = S.overrides[f.id];
    if(!ov) return {...f, isBase:true};
    return {...f, ...ov, id:f.id, isBase:true, extras:{...f.extras, ...(ov.extras||{})}};
  }).filter(f => includeArchived || !f.archived);
  const cust = S.custom
    .filter(f => includeArchived || !f.archived)
    .map(f=>({...f, isBase:false, isPerm:true}));
  const tmp  = S.temp.map(f=>({...f, isBase:false, isPerm:false}));
  return [...base, ...cust, ...tmp];
}

function getMetric(f, g){
  if(g.id === 'cal') return f.cal;
  if(g.type === 'count_min') return foodCountsForGoal(f, g);
  const v = f.extras && f.extras[g.id] !== undefined ? f.extras[g.id] : (g.default ?? 0);
  return +v;
}

// Returns 1 if food f counts toward count_min goal g, else 0
function foodCountsForGoal(f, g){
  if(g.targetCategory) return getFoodCategory(f) === g.targetCategory ? 1 : 0;
  return f.meal ? 1 : 0;
}

// Returns the display category ID for a food (never undefined)
function getFoodCategory(f){
  if(f.category && S.categories.some(c=>c.id===f.category)) return f.category;
  return f.meal ? 'meals' : 'snacks';
}

function sortFoods(arr){
  const s = S.sort || 'name';
  return [...arr].sort((a, b)=>{
    if(s === 'cal_asc')    return a.cal - b.cal;
    if(s === 'cal_desc')   return b.cal - a.cal;
    if(s === 'health_desc') return getHealthMetric(b) - getHealthMetric(a);
    if(s === 'pro_desc'){
      const pg = S.goals.find(g=>g.type==='min');
      if(pg) return getMetric(b,pg) - getMetric(a,pg);
    }
    if(s === 'pro_cal_desc') return proteinPerCal(b) - proteinPerCal(a);
    return a.name.localeCompare(b.name);
  });
}

function toggleCategory(catId){
  const cat = S.categories.find(c=>c.id===catId);
  if(!cat) return;
  cat.collapsed = !cat.collapsed;
  const grid   = document.getElementById('grid-'+catId);
  const toggle = document.querySelector('.cat-toggle[data-cat="'+catId+'"]');
  if(grid)   grid.style.display = cat.collapsed ? 'none' : '';
  if(toggle) toggle.classList.toggle('collapsed', cat.collapsed);
  saveState();
}

function hasEaten(){return Object.values(S.servings).some(s=>s>0);}
function cancelPrecomp(){if(_worker){_worker.terminate();_worker=null;_computing=false;}}
function cancelIncFeas(){if(_incWorker){_incWorker.terminate();_incWorker=null;_incComputing=false;}}
function isExcluded(id){return !!S.excluded[id];}
function getFoodById(id){return allFoods({includeArchived:true}).find(f=>f.id===id);}
function servingsOf(id){return S.servings[id]||0;}
function maxServingsOf(id){const f=getFoodById(id);return(f&&f.maxServings>=1)?f.maxServings:2;}
function healthColor(h){
  if(h>=.85)return'#16a34a';
  if(h>=.65)return'#84cc16';
  if(h>=.50)return'#eab308';
  if(h>=.35)return'#f97316';
  return'#dc2626';
}
function getHealthMetric(f){
  const g = S.goals.find(g=>g.id==='health'&&(g.type==='avg_min'||g.type==='avg_max'))
         || S.goals.find(g=>g.type==='avg_min'||g.type==='avg_max');
  return g ? Math.max(0, Math.min(1, getMetric(f, g))) : 0.5;
}

function getProGoal(){
  return S.goals.find(g=>g.id==='pro'&&g.type==='min') || S.goals.find(g=>g.type==='min');
}
function proteinPerCal(f){
  const pg=getProGoal();
  if(!pg||f.cal<=0) return 0;
  return getMetric(f,pg)/f.cal;
}
// Call once per render; returns {min, max} across all foods
function computePPCRange(foods){
  let mn=Infinity, mx=-Infinity;
  for(const f of foods){
    const v=proteinPerCal(f);
    if(v<mn) mn=v;
    if(v>mx) mx=v;
  }
  if(mn===Infinity) return {min:0,max:0};
  return {min:mn, max:mx};
}
function proCalColor(f, ppcRange){
  const {min,max}=ppcRange;
  const v=proteinPerCal(f);
  if(max<=min) return healthColor(0.5);
  return healthColor((v-min)/(max-min));
}

// ═══════════════════════════════════════════════
//  STATS COMPUTATION
// ═══════════════════════════════════════════════
function computeStats(){
  // sums['cal'] = eaten_cal - exCals (net toward goal)
  // sums[g.id]  = running sum of metric*s for min/max/count_min goals
  // avgs[g.id]  = calorie-weighted average for avg_min/avg_max goals
  let rawCal = 0;
  const sums = {}, hw = {};
  for(const g of S.goals){ sums[g.id]=0; hw[g.id]=0; }

  for(const f of allFoods()){
    const s = servingsOf(f.id);
    if(!s) continue;
    rawCal += f.cal * s;
    for(const g of S.goals){
      if(g.id==='cal') continue;
      if(g.type==='count_min'){ sums[g.id]+= foodCountsForGoal(f,g)*s; continue; }
      const m = getMetric(f, g);
      sums[g.id] += m * s;
      if(g.type==='avg_min'||g.type==='avg_max') hw[g.id] += m * f.cal * s;
    }
  }
  sums['cal'] = rawCal - S.exCals;

  const avgs = {};
  for(const g of S.goals){
    if(g.type==='avg_min'||g.type==='avg_max')
      avgs[g.id] = rawCal>0 ? hw[g.id]/rawCal : 0;
  }
  return {sums, avgs, rawCal};
}

function allGoalsMet(sums, avgs){
  for(const g of S.goals){
    if(g.enabled===false) continue;
    if(g.type==='range'){
      const netCal = sums['cal'];
      const eg = effGoalCal(g);
      if(netCal < eg-g.range || netCal > eg+g.range) return false;
    } else {
      const isAvg = g.type==='avg_min'||g.type==='avg_max';
      const v = isAvg ? (avgs[g.id]||0) : (sums[g.id]||0);
      const thr = effThr(g);
      if(g.type==='max'||g.type==='avg_max' ? v>thr : v<thr) return false;
    }
  }
  return true;
}

// ═══════════════════════════════════════════════
//  WEEKLY HISTORY  (7-day qualifying window)
// ═══════════════════════════════════════════════
// HIST: date('YYYY-MM-DD') → {servings, temp, exCals, relaxScore, completionPct}.
// Device-local (like day states). Spend is recomputed live from the current
// library so cost edits apply retroactively; foods deleted later are skipped.
let HIST = {};
const QUALIFY_PCT = 0.9;    // a day "counts" when tracked to ≥90% of its goals
const HIST_LOOKBACK = 30;   // max days the window searches back
const HIST_KEEP = 60;       // records older than this are pruned

let _histDay = null;
function ensureHistory(){
  const d = todayStr();
  if(_histDay === d) return;
  _histDay = d;
  finalizeHistory();
}

// Turn every past mpv7_day_* key not yet in HIST into a finalized record.
// completionPct is frozen at finalization; raw servings/temp are kept so
// weekly budgets can re-price the day against the current library.
function finalizeHistory(){
  const today = todayStr();
  const re = new RegExp('^'+PFX+'day_(\\d{4}-\\d{2}-\\d{2})$');
  let changed = false;
  const keys = [];
  try{ for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i)); }catch{}
  for(const k of keys){
    const m = k && k.match(re);
    if(!m) continue;
    const date = m[1];
    if(date >= today || HIST[date]) continue;
    const day = LS.get(k, null);
    if(!day || typeof day !== 'object') continue;
    HIST[date] = {
      servings: day.servings || {},
      temp: Array.isArray(day.temp) ? day.temp : [],
      exCals: day.exCals || 0,
      relaxScore: day.relaxScore || 0,
      completionPct: completionPctFor(day),
    };
    changed = true;
  }
  const cutoff = dateStrDaysAgo(HIST_KEEP);
  for(const d of Object.keys(HIST)) if(d < cutoff){ delete HIST[d]; changed = true; }
  if(changed){ _trailCache = null; LS.set(lk('hist'), HIST); }
}

// id→food map for pricing a historical day: current library (archived foods
// still count — they were real when eaten) plus that day's temp foods.
function histFoodMap(temp){
  const map = {};
  for(const f of allFoods({includeArchived:true})) map[f.id] = f;
  for(const f of (temp||[])) if(f && f.id) map[f.id] = f;
  return map;
}

// How completely a day was tracked: mean per-goal completion (0..1) across the
// currently-enabled daily goals, judged against the goals as the app showed
// them that day (tempGoals relaxations included — a fully tracked day with
// relaxed goals still qualifies; the relaxScore chip keeps that honest).
// weekly-budget goals are excluded: an expensive day is still a tracked day,
// and dropping it from the window would erase its spend from the budget.
function completionPctFor(day){
  const tempGoals = day.tempGoals || {};
  const goals = S.goals.filter(g=>g.enabled!==false && !g.weekly);
  if(!goals.length) return 0;
  const foods = histFoodMap(day.temp);
  let rawCal = 0;
  const sums = {}, hw = {};
  for(const g of goals){ sums[g.id]=0; hw[g.id]=0; }
  for(const [id,s] of Object.entries(day.servings||{})){
    if(!s) continue;
    const f = foods[id]; if(!f) continue;
    rawCal += f.cal*s;
    for(const g of goals){
      if(g.id==='cal') continue;
      if(g.type==='count_min'){ sums[g.id] += foodCountsForGoal(f,g)*s; continue; }
      const m = getMetric(f,g);
      sums[g.id] += m*s;
      if(g.type==='avg_min'||g.type==='avg_max') hw[g.id] += m*f.cal*s;
    }
  }
  const netCal = rawCal - (day.exCals||0);
  let tot = 0;
  for(const g of goals){
    const tv = tempGoals[g.id];
    let c;
    if(g.type==='range'){
      const goal = (tv!==undefined?tv:g.goal) || 1;
      c = netCal<=0 ? 0 : Math.min(netCal,goal)/Math.max(netCal,goal);
    } else {
      const thr = tv!==undefined?tv:g.threshold;
      const isAvg = g.type==='avg_min'||g.type==='avg_max';
      const v = isAvg ? (rawCal>0?hw[g.id]/rawCal:0) : (sums[g.id]||0);
      if(g.type==='max'||g.type==='avg_max') c = v<=thr ? 1 : (v>0?thr/v:1);
      else c = thr<=0 ? 1 : Math.min(1, v/thr);
    }
    tot += c;
  }
  return Math.round(tot/goals.length*1000)/1000;
}

// Dates in the current window, newest first: today plus the most recent
// qualifying past days (non-qualifying days are skipped, so the window
// reaches back farther), up to 7 total. Lookback capped at HIST_LOOKBACK
// days and never crosses the last "Reset week" marker.
function weekWindowDates(){
  const reset = LS.get(lk('week_reset'), '');
  const dates = [todayStr()];
  for(let i=1; i<=HIST_LOOKBACK && dates.length<7; i++){
    const d = dateStrDaysAgo(i);
    if(reset && d < reset) break;
    const rec = HIST[d];
    if(rec && rec.completionPct >= QUALIFY_PCT) dates.push(d);
  }
  return dates;
}

function histSpend(rec, g){
  const foods = histFoodMap(rec.temp);
  let sum = 0;
  for(const [id,s] of Object.entries(rec.servings||{})){
    if(!s) continue;
    const f = foods[id]; if(!f) continue;
    sum += getMetric(f,g)*s;
  }
  return sum;
}

// Metric spend over the window's PAST days (today's own sum counts against the
// remaining budget through the normal daily goal machinery). Memoized because
// effThr/effGoals sit on hot paths (precompHash runs every render); cleared in
// saveState() and whenever history changes.
let _trailCache = null; // {day, byGoal:{goalId:spend}}
function trailingSpend(g){
  ensureHistory();
  const day = todayStr();
  if(!_trailCache || _trailCache.day !== day) _trailCache = {day, byGoal:{}};
  if(_trailCache.byGoal[g.id] === undefined){
    let sum = 0;
    for(const d of weekWindowDates()){
      if(d === day) continue;
      if(HIST[d]) sum += histSpend(HIST[d], g);
    }
    _trailCache.byGoal[g.id] = Math.round(sum*100)/100;
  }
  return _trailCache.byGoal[g.id];
}

// ── Variety: food-family tags over the weekly window ──
// Each food carries 1–3 `vtags` (identity family + broader nutritional family,
// e.g. pizza L/M both ["pizza"]; Huel ["shake","protein-supp","grains"]).
// Untagged foods default to their name slug — every food its own family.
// Guidance only: never fed to the solver.
function slugTag(s){
  return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);
}
function parseVtags(raw){
  return [...new Set(String(raw||'').split(',').map(slugTag).filter(Boolean))].slice(0,3);
}
function vtagsOf(f){
  return (f.vtags&&f.vtags.length)?f.vtags:[slugTag(f.name)||'food'];
}

const DEF_VARIETY={minTags:8,topPct:25}; // ≥8 distinct families/week; no family >25% of servings
function varietyCfg(){
  const v=LS.get(lk('variety'),null);
  return v&&typeof v==='object'?{...DEF_VARIETY,...v}:{...DEF_VARIETY};
}

// Servings per tag across the window (past qualifying days re-read from HIST,
// today live). A multi-tag food counts toward each of its tags, but only once
// toward the total — so no single tag can exceed 100% of servings.
function varietyStats(){
  const tagServings={}; let total=0;
  const addDay=(servings,foods)=>{
    for(const [id,s] of Object.entries(servings||{})){
      if(!s) continue;
      const f=foods[id]; if(!f) continue; // deleted since → skip, like histSpend
      total+=s;
      for(const t of vtagsOf(f)) tagServings[t]=(tagServings[t]||0)+s;
    }
  };
  const today=todayStr();
  for(const d of weekWindowDates()){
    if(d===today) continue;
    if(HIST[d]) addDay(HIST[d].servings,histFoodMap(HIST[d].temp));
  }
  addDay(S.servings,histFoodMap(S.temp));
  let topTag='',topN=0;
  for(const [t,n] of Object.entries(tagServings)) if(n>topN){topN=n;topTag=t;}
  return {tagServings,total,distinct:Object.keys(tagServings).length,topTag,topShare:total>0?topN/total:0};
}

// Tags already at/over the repetition cap this week (min 3 servings so a
// 2-of-6 early-week tag doesn't flag everything). Drives the 🔁 card badge.
function repeatTagSet(vs,vc){
  const set=new Set();
  if(vs.total>0) for(const [t,n] of Object.entries(vs.tagServings))
    if(n>=3&&n/vs.total>=vc.topPct/100) set.add(t);
  return set;
}

// ═══════════════════════════════════════════════
//  PRECOMPUTATION
// ═══════════════════════════════════════════════
function precompHash(){
  const goalSig = effGoals().map(g=>
    `${g.id}:${g.type}:${g.threshold??g.goal}:${g.range??''}:${g.default??0}:${g.targetCategory??''}`
  ).join('|');
  const nonCalGoals = S.goals.filter(g=>g.type!=='count_min'&&g.id!=='cal');
  const foodSig = allFoods().map(f=>{
    const extras = nonCalGoals.map(g=>getMetric(f,g)).join(':');
    return `${f.id}:${f.cal}:${f.meal?1:0}:${f.maxServings||2}:${extras}:${getFoodCategory(f)}`;
  }).join('|');
  return goalSig+'|'+S.exCals+'|'+foodSig;
}

function precompIsValid(){
  return S.precomp && S.precomp.hash === precompHash();
}

function savePrecomp(){
  if(!S.precomp) return;
  const {feasMap,foodIds,n,hash,count,truncated} = S.precomp;
  const toStore = {v:2,hash,n,count,truncated,ids:foodIds.join(','),fm:feasMap};
  try{ LS.set(lk('precomp'), toStore); }catch{}
}

function loadPrecomp(){
  const raw = LS.get(lk('precomp'), null);
  if(!raw||typeof raw!=='object') return;
  if(raw.v !== 2) return; // discard old format; triggers clean recompute
  try{
    const {hash,n,count,truncated,ids,fm} = raw;
    if(!hash||!n||count===undefined||!ids) return;
    S.precomp = {feasMap:fm||{},count,truncated:!!truncated,foodIds:ids.split(','),n,hash};
  }catch{ S.precomp=null; }
}

function spawnWorker(onMessage, onError){
  const blob = new Blob([WORKER_CODE],{type:'application/javascript'});
  const url  = URL.createObjectURL(blob);
  const w    = new Worker(url);
  w.onmessage = ev  => { URL.revokeObjectURL(url); onMessage(ev); };
  w.onerror   = err => { URL.revokeObjectURL(url); onError(err); };
  return w;
}

function startPrecompute(){
  if(_computing) return;
  _computing = true;
  render();
  _worker = spawnWorker(
    ev  => { _worker=null; _computing=false; storePrecomp(ev.data); },
    err => { console.error('Worker error:',err); _worker=null; _computing=false; render(); }
  );
  _worker.postMessage({foods:allFoods().map(f=>({...f,_cat:getFoodCategory(f)})), goals:effGoals(), exCals:S.exCals});
}

function storePrecomp(data){
  const {feasMap,count,truncated,foodIds,n} = data;
  S.precomp = {feasMap,count,truncated,foodIds,n,hash:precompHash()};
  savePrecomp(); saveState(); render();
}

// ═══════════════════════════════════════════════
//  INCREMENTAL FEASIBILITY (exact B&B from current state)
// ═══════════════════════════════════════════════
function incFeasHash(){
  const srvSig = Object.entries(S.servings).filter(([,v])=>v>0).sort().map(([k,v])=>`${k}:${v}`).join(',');
  const exclSig = Object.keys(S.excluded).sort().join(',');
  return precompHash() + '|' + srvSig + '|' + exclSig;
}

function startIncFeasCompute(){
  cancelIncFeas();
  S.incFeas = null;

  if(!hasEaten()) return; // empty state: precomp (or DP) handles it

  _incComputing = true;
  const hash = incFeasHash();
  _incWorker = spawnWorker(
    ev  => {
      _incWorker=null; _incComputing=false;
      if(incFeasHash() !== hash){ startIncFeasCompute(); return; } // state changed: restart
      S.incFeas = {feasMap:ev.data.feasMap, count:ev.data.count, truncated:ev.data.truncated, hash};
      render();
    },
    err => { console.error('IncFeas worker error:',err); _incWorker=null; _incComputing=false; render(); }
  );
  _incWorker.postMessage({
    foods: allFoods().map(f=>({...f,_cat:getFoodCategory(f)})),
    goals: effGoals(),
    exCals: S.exCals,
    currentServings: S.servings,
    excludedIds: Object.keys(S.excluded)
  });
}

// ═══════════════════════════════════════════════
//  FEASIBILITY
// ═══════════════════════════════════════════════
function computeFeasibility(){
  const foods = allFoods();
  const feasMap = {};

  // Pre-mark excluded foods — keeps the exact and DP paths consistent
  for(const f of foods) if(isExcluded(f.id)) feasMap[f.id]=false;

  const anyEaten = hasEaten();

  // Empty state: use precomp exact result when available and complete
  if(!anyEaten && precompIsValid() && S.precomp.feasMap && !S.precomp.truncated){
    for(const f of foods){
      if(feasMap[f.id]===false) continue;
      if(servingsOf(f.id)>=maxServingsOf(f.id)){ feasMap[f.id]=true; continue; }
      feasMap[f.id] = S.precomp.feasMap[f.id] !== false;
    }
    return feasMap;
  }

  // Non-empty state: use incremental exact result when it matches current state and is complete
  if(anyEaten && S.incFeas && S.incFeas.hash === incFeasHash() && !S.incFeas.truncated){
    for(const f of foods){
      if(feasMap[f.id]===false) continue;
      if(servingsOf(f.id)>=maxServingsOf(f.id)){ feasMap[f.id]=true; continue; }
      feasMap[f.id] = S.incFeas.feasMap[f.id] !== false;
    }
    return feasMap;
  }

  // Fall back to approximate DP while exact result is computing
  return computeFeasibilityDP(foods.filter(f=>!isExcluded(f.id)), feasMap);
}

function computeFeasibilityDP(foods, feasMap){
  feasMap = feasMap||{};
  const goals = effGoals();
  const calGoal = goals.find(g=>g.id==='cal');
  if(!calGoal) return feasMap;
  const calMinRaw = calGoal.goal - calGoal.range + S.exCals;
  const calMaxRaw = calGoal.goal + calGoal.range + S.exCals;

  // Accumulate current state from eaten foods
  let rawCalNow=0;
  const sumsNow={}, hwNow={};
  for(const g of goals){ sumsNow[g.id]=0; hwNow[g.id]=0; }
  for(const f of foods){
    const s=servingsOf(f.id); if(!s) continue;
    rawCalNow+=f.cal*s;
    for(const g of goals){
      if(g.id==='cal') continue;
      if(g.type==='count_min'){ sumsNow[g.id]+=foodCountsForGoal(f,g)*s; continue; }
      const m=getMetric(f,g);
      sumsNow[g.id]+=m*s;
      if(g.type==='avg_min'||g.type==='avg_max') hwNow[g.id]+=m*f.cal*s;
    }
  }

  // Max possible remaining (all available servings) — used for calorie and count_min checks only.
  // min/avg goals use calorie-aware inline computation to avoid false positives near the calorie ceiling.
  let totRemCal=0;
  const totRemCount={};
  for(const g of goals) if(g.type==='count_min') totRemCount[g.id]=0;
  for(const f of foods){
    const avail=maxServingsOf(f.id)-servingsOf(f.id); if(avail<=0) continue;
    totRemCal+=f.cal*avail;
    for(const g of goals){
      if(g.type==='count_min') totRemCount[g.id]=(totRemCount[g.id]||0)+(foodCountsForGoal(f,g)*avail);
    }
  }

  for(const f of foods){
    if(servingsOf(f.id)>=maxServingsOf(f.id)){ feasMap[f.id]=true; continue; }
    const avail=maxServingsOf(f.id)-servingsOf(f.id);
    const fRemCal=f.cal*avail;

    let ok=false;
    for(let sx=1;sx<=avail&&!ok;sx++){
      const newRawCal=rawCalNow+f.cal*sx;
      const remCal=totRemCal-fRemCal+f.cal*(avail-sx);
      if(newRawCal>calMaxRaw) continue;
      if(newRawCal+remCal<calMinRaw) continue;

      // Remaining calorie headroom after committing to sx servings of f.
      // Used by min/avg checks to bound how much other food can still be added.
      const remCalHeadroom=calMaxRaw-newRawCal;

      let goalOk=true;
      for(const g of goals){
        if(!goalOk) break;
        if(g.id==='cal') continue;

        if(g.type==='count_min'){
          const fc=foodCountsForGoal(f,g);
          const fCount=fc*avail;
          const newM=sumsNow[g.id]+fc*sx;
          const remM=(totRemCount[g.id]||0)-fCount+fc*(avail-sx);
          if(newM+remM<g.threshold) goalOk=false;

        } else if(g.type==='min'){
          const m=getMetric(f,g);
          const newSum=sumsNow[g.id]+m*sx;
          // Calorie-aware upper bound: count each food only if it individually fits in headroom.
          // This is optimistic (foods share the budget) but catches the common case where
          // the calorie ceiling is nearly full and no protein-rich food can actually be added.
          const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
          let calAwareRem=m*fOwnAfford;
          for(const j of foods){
            if(j.id===f.id) continue;
            const availJ=maxServingsOf(j.id)-servingsOf(j.id); if(availJ<=0) continue;
            const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
            calAwareRem+=getMetric(j,g)*afford;
          }
          if(newSum+calAwareRem<g.threshold) goalOk=false;

        } else if(g.type==='max'){
          const m=getMetric(f,g);
          if(sumsNow[g.id]+m*sx>g.threshold) goalOk=false;

        } else if(g.type==='avg_min'){
          const m=getMetric(f,g);
          const newHW=hwNow[g.id]+m*f.cal*sx;
          // Calorie-aware health surplus: only count high-health foods that fit in headroom.
          const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
          let calAwareRemHS=Math.max(0,(m-g.threshold)*f.cal*fOwnAfford);
          for(const j of foods){
            if(j.id===f.id) continue;
            const availJ=maxServingsOf(j.id)-servingsOf(j.id); if(availJ<=0) continue;
            const mj=getMetric(j,g);
            const surJ=(mj-g.threshold)*j.cal;
            if(surJ>0){
              const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
              calAwareRemHS+=surJ*afford;
            }
          }
          if(newHW-g.threshold*newRawCal+calAwareRemHS<-1e-6) goalOk=false;

        } else if(g.type==='avg_max'){
          const m=getMetric(f,g);
          const newHW=hwNow[g.id]+m*f.cal*sx;
          // Calorie-aware recovery: only count below-threshold foods that fit in headroom.
          const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
          let calAwareRemHD=Math.max(0,(g.threshold-m)*f.cal*fOwnAfford);
          for(const j of foods){
            if(j.id===f.id) continue;
            const availJ=maxServingsOf(j.id)-servingsOf(j.id); if(availJ<=0) continue;
            const mj=getMetric(j,g);
            const recJ=(g.threshold-mj)*j.cal;
            if(recJ>0){
              const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
              calAwareRemHD+=recJ*afford;
            }
          }
          if(g.threshold*newRawCal-newHW+calAwareRemHD<-1e-6) goalOk=false;
        }
      }
      if(goalOk) ok=true;
    }
    feasMap[f.id]=ok;
  }
  return feasMap;
}

// ═══════════════════════════════════════════════
//  DEGREES OF FAILURE (goal relaxation estimate)
// ═══════════════════════════════════════════════
// Estimates the smallest per-goal relaxation that would let ONE serving of f
// into a plan, using the same optimistic bounds as computeFeasibilityDP.
// Returns {changes:{goalId:newValue}, deg} — `changes` is empty when only joint
// constraints bind (each goal passes its own bound but no combination works);
// `deg` = worst relative violation across goals, used to tint the card red.
// Optimistic bounds mean the estimate can under-relax; the exact worker re-runs
// afterward and the existing "no valid plan" banner catches the rare miss.
function relaxNeededFor(f){
  const goals=effGoals();
  const foods=allFoods().filter(x=>!isExcluded(x.id));
  const calGoal=goals.find(g=>g.id==='cal');
  if(!calGoal) return {changes:{},deg:0};
  const calMinRaw=calGoal.goal-calGoal.range+S.exCals;
  const calMaxRaw=calGoal.goal+calGoal.range+S.exCals;

  let rawCalNow=0;
  const sumsNow={}, hwNow={};
  for(const g of goals){ sumsNow[g.id]=0; hwNow[g.id]=0; }
  for(const x of foods){
    const s=servingsOf(x.id); if(!s) continue;
    rawCalNow+=x.cal*s;
    for(const g of goals){
      if(g.id==='cal') continue;
      if(g.type==='count_min'){ sumsNow[g.id]+=foodCountsForGoal(x,g)*s; continue; }
      const m=getMetric(x,g);
      sumsNow[g.id]+=m*s;
      if(g.type==='avg_min'||g.type==='avg_max') hwNow[g.id]+=m*x.cal*s;
    }
  }
  let totRemCal=0;
  const totRemCount={};
  for(const g of goals) if(g.type==='count_min') totRemCount[g.id]=0;
  for(const x of foods){
    const availX=maxServingsOf(x.id)-servingsOf(x.id); if(availX<=0) continue;
    totRemCal+=x.cal*availX;
    for(const g of goals){
      if(g.type==='count_min') totRemCount[g.id]=(totRemCount[g.id]||0)+(foodCountsForGoal(x,g)*availX);
    }
  }

  const avail=maxServingsOf(f.id)-servingsOf(f.id);
  const sx=1;
  const newRawCal=rawCalNow+f.cal*sx;
  const remCal=totRemCal-f.cal*avail+f.cal*(avail-sx);
  // Headroom under the (possibly already blown) calorie ceiling — floor at 0 so
  // afford counts below stay sane when f itself overshoots calories.
  const remCalHeadroom=Math.max(0,calMaxRaw-newRawCal);

  const changes={};
  let deg=0;
  const bump=(gid,val,rel)=>{ changes[gid]=val; if(rel>deg) deg=rel; };

  if(newRawCal>calMaxRaw){
    const delta=newRawCal-calMaxRaw;
    bump('cal', Math.ceil(calGoal.goal+delta), delta/Math.max(1,calGoal.goal));
  } else if(newRawCal+remCal<calMinRaw){
    const delta=calMinRaw-(newRawCal+remCal);
    bump('cal', Math.floor(calGoal.goal-delta), delta/Math.max(1,calGoal.goal));
  }

  for(const g of goals){
    if(g.id==='cal') continue;

    if(g.type==='count_min'){
      const fc=foodCountsForGoal(f,g);
      const newM=sumsNow[g.id]+fc*sx;
      const remM=(totRemCount[g.id]||0)-fc*avail+fc*(avail-sx);
      const attain=newM+remM;
      if(attain<g.threshold) bump(g.id, Math.max(0,Math.floor(attain)), (g.threshold-attain)/Math.max(1,g.threshold));

    } else if(g.type==='min'){
      const m=getMetric(f,g);
      const newSum=sumsNow[g.id]+m*sx;
      const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
      let calAwareRem=m*fOwnAfford;
      for(const j of foods){
        if(j.id===f.id) continue;
        const availJ=maxServingsOf(j.id)-servingsOf(j.id); if(availJ<=0) continue;
        const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
        calAwareRem+=getMetric(j,g)*afford;
      }
      const attain=newSum+calAwareRem;
      if(attain<g.threshold) bump(g.id, Math.max(0,Math.floor(attain)), (g.threshold-attain)/Math.max(1,g.threshold));

    } else if(g.type==='max'){
      const m=getMetric(f,g);
      const newSum=sumsNow[g.id]+m*sx;
      if(newSum>g.threshold) bump(g.id, Math.ceil(newSum), (newSum-g.threshold)/Math.max(1,g.threshold));

    } else if(g.type==='avg_min'&&newRawCal>0){
      const m=getMetric(f,g);
      const newHW=hwNow[g.id]+m*f.cal*sx;
      const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
      let calAwareRemHS=Math.max(0,(m-g.threshold)*f.cal*fOwnAfford);
      for(const j of foods){
        if(j.id===f.id) continue;
        const availJ=maxServingsOf(j.id)-servingsOf(j.id); if(availJ<=0) continue;
        const surJ=(getMetric(j,g)-g.threshold)*j.cal;
        if(surJ>0){
          const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
          calAwareRemHS+=surJ*afford;
        }
      }
      if(newHW-g.threshold*newRawCal+calAwareRemHS<-1e-6){
        const thr2=Math.max(0,Math.floor((newHW+calAwareRemHS)/newRawCal*100)/100);
        bump(g.id, thr2, (g.threshold-thr2)/Math.max(.01,g.threshold));
      }

    } else if(g.type==='avg_max'&&newRawCal>0){
      const m=getMetric(f,g);
      const newHW=hwNow[g.id]+m*f.cal*sx;
      const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
      let calAwareRemHD=Math.max(0,(g.threshold-m)*f.cal*fOwnAfford);
      for(const j of foods){
        if(j.id===f.id) continue;
        const availJ=maxServingsOf(j.id)-servingsOf(j.id); if(availJ<=0) continue;
        const recJ=(g.threshold-getMetric(j,g))*j.cal;
        if(recJ>0){
          const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
          calAwareRemHD+=recJ*afford;
        }
      }
      if(g.threshold*newRawCal-newHW+calAwareRemHD<-1e-6){
        const thr2=Math.ceil((newHW-calAwareRemHD)/newRawCal*100)/100;
        bump(g.id, thr2, (thr2-g.threshold)/Math.max(.01,g.threshold));
      }
    }
  }

  // Exact solver says infeasible but every per-goal bound passes: goals conflict
  // jointly. Treat as barely-failing for display; no single number to bump.
  if(!Object.keys(changes).length) deg=.03;
  return {changes, deg};
}
function dofTier(deg){ return deg<=.06?1:deg<=.18?2:3; }

function getDispGoals(){
  return S.goals.filter(g=>g.enabled!==false&&g.id!=='cal'&&g.type!=='count_min').slice(0,2);
}
function getCategoryName(catId){
  return S.categories.find(c=>c.id===catId)?.name || catId;
}
function progressColor(val, thr, isMax){
  if(isMax) return val>thr?'b':val>=thr*.8?'w':'g';
  return val>=thr?'g':val>=thr*.75?'w':'b';
}
// Builds the inline stats string shown on food cards and compare modals.
// {names:true} appends the goal name after each value (used in Compare).
// ppcRange: {min,max} from computePPCRange — colors the protein value when provided.
function foodStatsHtml(f, {names=false, ppcRange=null}={}){
  let html=`<b>${f.cal}</b> cal`;
  const proGoalId=getProGoal()?.id;
  for(const g of getDispGoals()){
    const v=getMetric(f,g);
    if(g.type==='avg_min'||g.type==='avg_max'){
      html+=` &nbsp; <span style="color:${healthColor(Math.max(0,Math.min(1,v)))};font-weight:700">♥${v.toFixed(2)}</span>`;
    } else {
      const unit=g.unit?` ${g.unit}`:'';
      if(ppcRange && g.id===proGoalId){
        const col=proCalColor(f,ppcRange);
        html+=` &nbsp; <span style="color:${col};font-weight:700">${fmtVal(v,g)}${unit}</span>${names?` ${g.name.toLowerCase()}`:''}`;
      } else {
        html+=` &nbsp; <b>${fmtVal(v,g)}${unit}</b>${names?` ${g.name.toLowerCase()}`:''}`;
      }
    }
  }
  return html;
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function render(){
  ensureHistory(); // catches midnight rollover while the app stays open
  const st = computeStats();
  const feas = computeFeasibility();
  renderTrackingBanner();
  renderRelaxBanner();
  renderBanner(st);
  renderStats(st);
  renderWeekStrip(st);
  renderGrids(feas);
  renderEaten();
}

// ── Week strip: qualifying-day dots + weekly budgets ──
function renderWeekStrip(st){
  const el=document.getElementById('week-strip');
  const today=todayStr();
  const dates=weekWindowDates(); // newest first, includes today
  const past=dates.length-1;
  let dots='';
  for(let i=dates.length;i<7;i++) dots+='<span class="week-dot" title="No qualifying day yet"></span>';
  for(let i=dates.length-1;i>=0;i--){
    const d=dates[i];
    dots+=d===today
      ?'<span class="week-dot t" title="Today (in progress)"></span>'
      :`<span class="week-dot q" title="${d} — tracked to ${Math.round((HIST[d]?.completionPct||0)*100)}%"></span>`;
  }
  let budgets='';
  for(const g of S.goals){
    if(!g.weekly||g.enabled===false) continue;
    const spent=trailingSpend(g)+(st.sums[g.id]||0);
    const over=spent>g.threshold;
    budgets+=`<span${over?' class="over"':''} title="Spend across the window's tracked days plus today">💰 <b>${fmtVal(spent,g)}</b> / ${fmtVal(g.threshold,g)}${g.unit?' '+g.unit:''} this week</span>`;
  }
  const vs=varietyStats(), vc=varietyCfg();
  const divOk=vs.distinct>=vc.minTags;
  const topPct=Math.round(vs.topShare*100);
  const topOver=vs.total>0&&topPct>vc.topPct;
  const variety=`<span class="wk-var${divOk?' ok':''}" id="wk-var-div" title="Distinct food families eaten this week — aim for at least ${vc.minTags}. Click to edit variety targets.">🎨 <b>${vs.distinct}</b>/${vc.minTags} families</span>
    <span class="wk-var${topOver?' over':(vs.total?' ok':'')}" id="wk-var-top" title="Biggest food family's share of the week's servings — keep it at or under ${vc.topPct}%. Click to edit variety targets.">🔁 ${vs.topTag?`${esc(vs.topTag)} <b>${topPct}%</b>`:'—'} (≤${vc.topPct}%)</span>`;
  el.innerHTML=`<span title="Days tracked to ≥${Math.round(QUALIFY_PCT*100)}% of goals count toward the week; untracked days are skipped">📅 Week</span>
    <span class="week-dots">${dots}</span>
    <span>${past} tracked day${past===1?'':'s'} + today</span>
    ${budgets}
    ${variety}
    <button class="btn btn-sm" id="btn-reset-week" style="margin-left:auto" title="Start the weekly window fresh from today">⟳ Reset week</button>`;
  document.getElementById('btn-reset-week').addEventListener('click',resetWeek);
  document.getElementById('wk-var-div')?.addEventListener('click',openVarietyModal);
  document.getElementById('wk-var-top')?.addEventListener('click',openVarietyModal);
}

function openVarietyModal(){
  const vc=varietyCfg();
  openModal(`<h2>🎨 Variety Targets</h2>
    <form>
      <div class="fg"><label>Distinct food families per week <small style="color:var(--muted)">(at least)</small></label>
        <input type="number" name="minTags" value="${vc.minTags}" min="1" max="50" step="1"></div>
      <div class="fg"><label>Max share of one family <small style="color:var(--muted)">(% of the week's servings)</small></label>
        <input type="number" name="topPct" value="${vc.topPct}" min="5" max="100" step="1"></div>
      <div class="note">Guidance only — variety never constrains the plan. Untagged foods count as their own family; set tags in ✎ Edit Food → Variety tags, or ask the AI to "tag my library".</div>
      <div class="mactions">
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn pri">Save</button>
      </div>
    </form>`,
    form=>{
      const d=new FormData(form);
      LS.set(lk('variety'),{
        minTags:Math.max(1,parseInt(d.get('minTags'))||DEF_VARIETY.minTags),
        topPct:Math.min(100,Math.max(5,parseInt(d.get('topPct'))||DEF_VARIETY.topPct)),
      });
      closeModal(); render();
    });
}

function resetWeek(){
  if(!confirm('Reset the weekly window? Days before today will no longer count toward weekly budgets.')) return;
  LS.set(lk('week_reset'),todayStr());
  _trailCache=null;
  cancelPrecomp();      // weekly thresholds may have changed → stale plans
  startIncFeasCompute();
  saveState(); render();
}

function renderTrackingBanner(){
  const el=document.getElementById('tracking-banner');
  if(!S.trackingMode){el.className='tracking-mode-banner';return;}
  el.className='tracking-mode-banner show';
  el.innerHTML='📊 Tracking mode — meal planning paused. Foods are added freely. &nbsp;<button class="btn btn-sm" id="btn-exit-tracking">↺ Back to Planning</button>';
  document.getElementById('btn-exit-tracking').addEventListener('click',()=>{
    S.trackingMode=false;
    saveState(); render();
  });
}

function renderRelaxBanner(){
  const el=document.getElementById('relax-banner');
  const ids=Object.keys(S.tempGoals||{});
