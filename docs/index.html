function renderBanner(st){
  const banner=document.getElementById('recompute-banner');
  if(S.trackingMode){banner.className='hidden';banner.textContent='';return;}
  if(_computing){
    banner.className='computing';
    banner.textContent='⏳ Computing meal plans...';
    return;
  }
  if(!precompIsValid()){
    startPrecompute();
    return;
  }
  if(_incComputing){
    banner.className='computing';
    banner.textContent='⏳ Checking plan feasibility...';
    return;
  }
  // No valid completion exists from here → relax the goals automatically
  if(hasEaten() && S.incFeas && S.incFeas.hash===incFeasHash() && S.incFeas.count===0 && !S.incFeas.truncated){
    if(!allGoalsMet(st.sums,st.avgs)){
      autoRelax(banner);
      return;
    }
  }
  banner.className='hidden';
  banner.textContent='';
}

function fmtVal(v, g){
  if(g.unit==='$') return (Math.round(v*100)/100).toFixed(2);
  if(g.type==='avg_min'||g.type==='avg_max') return v.toFixed(2);
  const r=Math.round(v*10)/10;
  return r%1===0 ? String(r|0) : r.toFixed(1);
}

// Base (pre-relaxation) threshold. Weekly goals: today's cap is whatever is
// left of the weekly budget after the trailing qualifying days' spend.
// variety_min: the weekly family target ramps with the window — a 1-day
// window asks for 1/7 of it (rounded up), a full 7-day window asks for all.
function baseThr(g){
  if(g.type==='variety_min') return Math.max(1, Math.ceil(g.threshold*Math.min(7,weekWindowDates().length)/7));
  if(!g.weekly) return g.threshold;
  return Math.max(0, Math.round((g.threshold - trailingSpend(g))*100)/100);
}

// ── Fixed relaxation steps ────────────────────
// Relaxations are never bespoke numbers. Every goal loosens in predetermined
// increments, so a day's score is a plain count of steps taken: 0 = every goal
// met exactly as configured, N = N rungs of slack borrowed. Step size is
// derived from the goal itself (a 1/2/5 rounding of ~10% of its target) unless
// the goal carries an explicit relaxStep.
function niceStep(x){
  if(!(x>0)) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(x))), m=x/p;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p;
}
function relaxStep(g){
  if(g.relaxStep>0) return g.relaxStep;
  if(g.type==='range') return niceStep(g.range||50);                          // widens the window
  if(g.type==='count_min'||g.type==='variety_min') return 1;                  // whole foods / families
  if(g.type==='avg_min'||g.type==='avg_max') return Math.max(.01, niceStep(g.threshold*.1));
  if(g.type==='variety_max') return Math.max(1, Math.round(niceStep(g.threshold*.2)));
  return Math.max(g.unit==='$'?.5:1, niceStep(Math.abs(g.threshold)*.1));
}
function stepsOf(g){ return (S.relaxSteps&&S.relaxSteps[g.id])||0; }
// Total steps that would buy `slack` more room on g beyond the `from` it already has.
function stepsForSlack(g, from, slack){
  return from + Math.max(1, Math.ceil((slack-1e-9)/relaxStep(g)));
}
// g with n relaxation steps applied. Range goals widen symmetrically (the
// target never moves); every other type slides its threshold slack-ward.
// Step size always comes from the RAW goal, so rungs stay the same size no
// matter how far the day has already been relaxed.
function applySteps(g, n){
  if(!n) return (g.weekly||g.type==='variety_min') ? {...g, threshold:baseThr(g)} : g;
  const d=n*relaxStep(g);
  if(g.type==='range') return {...g, range:g.range+d};
  if(g.type==='max'||g.type==='avg_max'||g.type==='variety_max'){
    const v=baseThr(g)+d;
    return {...g, threshold:g.type==='variety_max'?Math.min(100,v):v};
  }
  return {...g, threshold:Math.max(0, baseThr(g)-d)};
}
function effThr(g){ return applySteps(g,stepsOf(g)).threshold; }
function effRange(g){ return g.range+stepsOf(g)*relaxStep(g); }
function effGoalCal(g){ return g.goal; } // calorie relaxation widens the window; the target never moves
// Goals with a given relaxation applied — feed these to the solver so
// feasibility honors relaxed values (raw S.goals stay untouched in settings).
// Disabled goals (enabled===false; undefined = enabled for back-compat) are
// dropped here, which removes them from the workers, DP fallback, relax
// estimator, and precompHash in one place. 'cal' can never be disabled: the
// solver enumerates plans inside the calorie window.
function goalsWithSteps(steps){
  return S.goals.filter(g=>g.enabled!==false).map(g=>applySteps(g, steps[g.id]||0));
}
function effGoals(){ return goalsWithSteps(S.relaxSteps||{}); }

// Applies a {goalId: totalSteps} relaxation and charges the day's score for
// whatever it added. Steps never decrease here — "Restore goals" clears them,
// but the score it already cost stays on the books.
function applyRelaxSteps(steps){
  const next={...(S.relaxSteps||{})};
  let added=0;
  for(const [gid,n] of Object.entries(steps)){
    const cur=next[gid]||0;
    if(n>cur){ added+=n-cur; next[gid]=n; }
  }
  S.relaxSteps=next;
  S.relaxScore=(S.relaxScore||0)+added;
}

function goalLabel(g){
  const n=stepsOf(g);
  return n ? `<span style="color:var(--warn)" title="Relaxed ${n} step${n===1?'':'s'} today">🔓 ${g.name}</span>` : g.name;
}

function renderStats(st){
  const {sums, avgs} = st;
  const anyEaten = hasEaten();
  const incValid = anyEaten && S.incFeas && S.incFeas.hash===incFeasHash();
  const planNote = incValid
    ?` <small style="color:var(--muted);font-weight:400">(${S.incFeas.count.toLocaleString()}${S.incFeas.truncated?'+':''} plans)</small>`
    : precompIsValid()
      ?` <small style="color:var(--muted);font-weight:400">(${S.precomp.count.toLocaleString()}${S.precomp.truncated?'+':''} plans)</small>`:'';

  let html='';
  for(const g of S.goals){
    if(g.enabled===false) continue;
    if(isVarietyGoal(g)) continue; // shown in the week strip, not the daily stats row
    if(g.type==='range'){
      const netCal=sums['cal']||0;
      const rawCal=netCal+S.exCals;
      const baseGoal=effGoalCal(g), rg=effRange(g);
      const effGoal=baseGoal+S.exCals, effMin=baseGoal-rg+S.exCals, effMax=baseGoal+rg+S.exCals;
      const pctFill=Math.min(100,effMax>0?rawCal/effMax*100:0).toFixed(1)+'%';
      const inWin=rawCal>=effMin&&rawCal<=effMax;
      const color=inWin?'g':rawCal>effMax?'b':rawCal>=effMin*.9?'w':'b';
      const exNote=S.exCals>0?` <small style="color:var(--ok)">+${S.exCals} burn</small>`:'';
      html+=`<div class="stat">
        <div class="stat-lbl"><span>${goalLabel(g)}${exNote}</span><span>${rawCal} / ${effGoal} <small style="color:var(--muted)">(${effMin}–${effMax})</small></span></div>
        <div class="pbar"><div class="pbar-fill ${color}" style="width:${pctFill}"></div></div>
      </div>`;
    } else if(g.type==='count_min'){
      const thr=effThr(g);
      const val=sums[g.id]||0; const ok=val>=thr;
      html+=`<div class="stat" style="justify-content:flex-end">
        <div class="stat-lbl"><span>${goalLabel(g)}${planNote}</span></div>
        <div class="meals-badge ${ok?'':'unmet'}">${ok?'✓':'✗'} ${val} / ${thr} ${g.name.toLowerCase()}</div>
      </div>`;
    } else {
      const isAvg=(g.type==='avg_min'||g.type==='avg_max');
      const val=isAvg?(avgs[g.id]||0):(sums[g.id]||0);
      const thr=effThr(g);
      const unit=g.unit?` ${g.unit}`:'';
      const pctFill=Math.min(100,thr>0?val/thr*100:0).toFixed(1)+'%';
      const color=progressColor(val,thr,g.type==='max'||g.type==='avg_max');
      const dirLabel=(g.type==='max'||g.type==='avg_max')?'≤':'≥';
      const wkNote=g.weekly?` <small style="color:var(--muted);text-transform:none" title="Today's cap: what's left of the ${fmtVal(g.threshold,g)}${unit}/week budget">(of ${fmtVal(g.threshold,g)}${unit}/wk)</small>`:'';
      html+=`<div class="stat">
        <div class="stat-lbl"><span>${goalLabel(g)}${wkNote}</span><span>${fmtVal(val,g)}${unit} / ${dirLabel}${fmtVal(thr,g)}${unit}</span></div>
        <div class="pbar"><div class="pbar-fill ${color}" style="width:${pctFill}"></div></div>
      </div>`;
    }
  }
  document.getElementById('stats-row').innerHTML=html;
  document.getElementById('goals-badge').classList.toggle('show', allGoalsMet(sums,avgs));
  const rs=document.getElementById('relax-score');
  rs.textContent='🔓 '+(S.relaxScore||0);
  rs.title=(S.relaxScore||0)+' goal-relaxation step'+(S.relaxScore===1?'':'s')+' today — 0 is a perfect day';
  rs.classList.toggle('bad',(S.relaxScore||0)>0);
}

function makeCard(f, feas, ppcRange, relaxCache, repeatTags){
  const s=servingsOf(f.id);
  const isFeas=feas[f.id]!==false;
  const ms=maxServingsOf(f.id);
  const eaten=s>0, xed=isExcluded(f.id);
  // In tracking mode: all non-excluded foods are treated as clickable (no greying)
  const showGrey=!S.trackingMode&&!isFeas;
  const canInteract=S.trackingMode?!xed:(isFeas&&!xed);
  // Infeasible in plan mode: clickable to relax goals (degrees of failure)
  const canForceAdd=!S.trackingMode&&!isFeas&&!xed;
  let dof=null;
  if(canForceAdd&&relaxCache) dof=relaxCache[f.id]||(relaxCache[f.id]=relaxNeededFor(f));

  const div=document.createElement('div');
  let cls='card';
  if(showGrey) cls+=' grey';
  if(dof) cls+=' dof'+dofTier(dof.deg);
  if(eaten) cls+=' eaten';
  if(xed) cls+=' xed';
  div.className=cls;

  const statsHtml=foodStatsHtml(f,{ppcRange});

  const xTitle=xed?'Un-skip (allow again)':eaten?`No more of this today`:'Skip today';
  const xLabel=xed?'↺':'✕';

  const rptTag=repeatTags&&vtagsOf(f).find(t=>repeatTags.has(t));
  const rptHtml=rptTag?`<span class="rpt" title="'${esc(rptTag)}' is already ${Math.round(varietyCfg().topPct)}%+ of this week's servings — consider some variety">🔁</span>`:'';

  div.innerHTML=`
    ${cardBarHtml(f)}
    <div class="cbody">
      <div class="cname">${f.name}${rptHtml}</div>
      <div class="cstats">${statsHtml}</div>
    </div>
    <div class="cfoot">
      ${eaten?`<span class="sbadge${s>=ms?' two':''}">${s}×</span>`:'<span></span>'}
      <div style="display:flex;gap:4px;align-items:center">
        ${eaten?`<button class="minus-btn" data-rm="${f.id}" title="Remove serving">−</button>`:''}
        ${canInteract?`<button class="plus-btn" data-id="${f.id}" title="Add serving">＋</button>`:''}
        <button class="edit-btn" data-edit="${f.id}">✎</button>
        <button class="edit-btn" data-excl="${f.id}" title="${xTitle}">${xLabel}</button>
      </div>
    </div>`;

  if(canInteract){
    div.addEventListener('click',ev=>{
      if(ev.target.closest('[data-edit],[data-rm],[data-excl],.plus-btn')) return;
      addServing(f.id);
    });
  } else if(canForceAdd){
    // Clicking an infeasible food in plan mode → offer to relax goals (or track freely)
    div.addEventListener('click',ev=>{
      if(ev.target.closest('[data-edit],[data-excl]')) return;
      openRelaxDialog(f, dof||relaxNeededFor(f));
    });
  }
  div.addEventListener('contextmenu',ev=>{
    ev.preventDefault(); toggleExclude(f.id);
  });
  let _lp=null;
  div.addEventListener('touchstart',()=>{
    _lp=setTimeout(()=>{_lp=null;toggleExclude(f.id);},550);
  },{passive:true});
  const clp=()=>{if(_lp){clearTimeout(_lp);_lp=null;}};
  div.addEventListener('touchend',clp);
  div.addEventListener('touchmove',clp);
  div.addEventListener('touchcancel',clp);
  div.querySelector('[data-rm]')?.addEventListener('click',ev=>{ev.stopPropagation();removeServing(f.id);});
  div.querySelector('.plus-btn')?.addEventListener('click',ev=>{ev.stopPropagation();addServing(f.id);});
  div.querySelector('[data-edit]').addEventListener('click',ev=>{ev.stopPropagation();openEditModal(f.id);});
  div.querySelector('[data-excl]')?.addEventListener('click',ev=>{ev.stopPropagation();toggleExclude(f.id);});
  return div;
}

function renderGrids(feas){
  const foods=allFoods();
  const ppcRange=computePPCRange(foods);
  const relaxCache={}; // per-render memo of relaxNeededFor results
  const repeatTags=repeatTagSet(varietyStats(),varietyCfg()); // 🔁 badge for over-repeated families
  const container=document.getElementById('main');
  container.innerHTML='';
  const sorted=sortFoods(foods);

  // Group foods by category
  const byCategory={};
  const orphans=[];
  for(const f of sorted){
    const cid=getFoodCategory(f);
    if(S.categories.some(c=>c.id===cid)){
      (byCategory[cid]=byCategory[cid]||[]).push(f);
    } else {
      orphans.push(f);
    }
  }

  for(const cat of S.categories){
    const catFoods=byCategory[cat.id]||[];
    const sec=document.createElement('div');
    sec.className='cat-sec';
    const hdrDiv=document.createElement('div');
    hdrDiv.className='cat-hdr sec-hdr';
    hdrDiv.innerHTML=`<span>${esc(cat.name)}</span><span class="cat-toggle${cat.collapsed?' collapsed':''}" data-cat="${esc(cat.id)}">▾</span>`;
    hdrDiv.addEventListener('click',()=>toggleCategory(cat.id));
    sec.appendChild(hdrDiv);
    const grid=document.createElement('div');
    grid.className='food-grid';
    grid.id='grid-'+cat.id;
    if(cat.collapsed) grid.style.display='none';
    for(const f of catFoods) grid.appendChild(makeCard(f,feas,ppcRange,relaxCache,repeatTags));
    sec.appendChild(grid);
    container.appendChild(sec);
  }

  if(orphans.length){
    const sec=document.createElement('div');
    sec.className='cat-sec';
    const hdrDiv=document.createElement('div');
    hdrDiv.className='sec-hdr';
    hdrDiv.textContent='Other';
    sec.appendChild(hdrDiv);
    const grid=document.createElement('div');
    grid.className='food-grid';
    for(const f of orphans) grid.appendChild(makeCard(f,feas,ppcRange,relaxCache,repeatTags));
    sec.appendChild(grid);
    container.appendChild(sec);
  }
}

function renderEaten(){
  const el=document.getElementById('eaten-list');
  const eaten=allFoods().filter(f=>servingsOf(f.id)>0);
  if(!eaten.length){el.innerHTML='<span class="empty">Nothing eaten yet today.</span>';return;}
  el.innerHTML='';
  for(const f of eaten){
    const s=servingsOf(f.id);
    const dispGoals=getDispGoals();
    let extra=`${f.cal*s} cal`;
    for(const g of dispGoals){
      const v=getMetric(f,g)*s;
      const unit=g.unit?`${g.unit}`:'';
      if(g.type==='avg_min'||g.type==='avg_max') extra+=` · ♥${(getMetric(f,g)).toFixed(2)}`;
      else extra+=` · ${fmtVal(v,g)}${unit} ${g.name.toLowerCase()}`;
    }
    const chip=document.createElement('div');
    chip.className='eaten-chip';
    chip.innerHTML=`<strong>${f.name}</strong> <span>×${s} · ${extra}</span>
      <button class="rm-btn" title="Remove 1 serving">−</button>`;
    chip.querySelector('.rm-btn').addEventListener('click',()=>removeServing(f.id));
    el.appendChild(chip);
  }
}

// ═══════════════════════════════════════════════
//  STATE MUTATIONS
// ═══════════════════════════════════════════════
function enterTrackingMode(){
  S.trackingMode=true;
  saveState();
}

// ── Joint-conflict relax search ───────────────
// When no single per-goal bound fails (relaxNeededFor returns empty changes)
// the exact solver still says the food doesn't fit: the goals conflict in
// combination. Rather than punting to free tracking, probe the exact solver
// with progressively larger uniform relaxations of every non-cal goal until
// the food becomes feasible, then shrink the winning set: restore goals that
// weren't needed, and step the survivors back one rung. Each probe costs one
// worker run (same work as the recompute after any tap), so the whole search
// finishes while the dialog is open.
// Rungs are step COUNTS, so whatever the search lands on is a value the user
// could have dialed in by hand — no bespoke thresholds.
const RELAX_LADDER=[1,2,3,5,8,13];
let _relaxWorker=null, _relaxResolve=null, _relaxSearchTok=null;
let _autoRelaxHash=null, _autoRelaxFailed=false; // see autoRelax()

function cancelRelaxSearch(){
  _relaxSearchTok=null;
  _autoRelaxHash=null; // a cancelled auto-relax should retry on the next render
  if(_relaxWorker){_relaxWorker.terminate();_relaxWorker=null;}
  if(_relaxResolve){const r=_relaxResolve;_relaxResolve=null;r(null);}
}

// Exact feasibility under a candidate goal set, via a dedicated worker
// (doesn't disturb the precomp/incremental ones). With a foodId: can one
// more serving of it be added? With null: does the current state have any
// valid completion at all (the stuck-banner case)?
function exactFeasWithGoals(goals, foodId){
  return new Promise(resolve=>{
    _relaxResolve=resolve;
    _relaxWorker=spawnWorker(
      ev=>{ _relaxWorker=null; if(_relaxResolve===resolve){_relaxResolve=null; resolve(foodId ? ev.data.feasMap[foodId]!==false : ev.data.count>0);} },
      err=>{ console.error('Relax search worker error:',err); _relaxWorker=null; if(_relaxResolve===resolve){_relaxResolve=null; resolve(null);} }
    );
    _relaxWorker.postMessage({
      foods: allFoods().map(f=>({...f,_cat:getFoodCategory(f),_vt:vtagsOf(f)})),
      goals,
      exCals: S.exCals,
      currentServings: S.servings,
      excludedIds: Object.keys(S.excluded),
      variety: varietyWorkerCtx(goals)
    });
  });
}

// Returns {changes,deg} like relaxNeededFor, or null if even relaxing every
// non-cal goal to nothing doesn't make the food fit (or the search was
// cancelled). tok must stay === _relaxSearchTok for the search to continue.
// f=null searches for the relaxation that unsticks the CURRENT state instead
// of one that admits an extra serving of f.
async function searchJointRelax(f, tok, onTick){
  const cur=S.relaxSteps||{};
  const cands=S.goals.filter(g=>g.enabled!==false&&g.id!=='cal'&&g.type!=='range');
  if(!cands.length) return null;
  let runs=0;
  const feas=async ch=>{
    runs++; if(onTick) onTick(runs);
    const ok=await exactFeasWithGoals(goalsWithSteps({...cur,...ch}), f&&f.id);
    return _relaxSearchTok===tok ? ok : null;
  };

  // Phase 1: smallest uniform rung (added to whatever each goal already has)
  // that makes f feasible
  let rungIdx=-1, changes=null;
  for(let i=0;i<RELAX_LADDER.length;i++){
    const ch={};
    for(const g of cands) ch[g.id]=(cur[g.id]||0)+RELAX_LADDER[i];
    const ok=await feas(ch);
    if(ok===null) return null;
    if(ok){ rungIdx=i; changes=ch; break; }
  }
  if(!changes) return null;

  // Phase 2: restore goals that weren't actually needed
  for(const gid of Object.keys(changes)){
    if(Object.keys(changes).length<=1) break;
    const trial={...changes}; delete trial[gid];
    const ok=await feas(trial);
    if(ok===null) return null;
    if(ok) changes=trial;
  }

  // Phase 3: step each surviving goal back one rung if it stays feasible
  if(rungIdx>0){
    for(const gid of Object.keys(changes)){
      const n=(cur[gid]||0)+RELAX_LADDER[rungIdx-1];
      if(n>=changes[gid]) continue;
      const trial={...changes,[gid]:n};
      const ok=await feas(trial);
      if(ok===null) return null;
      if(ok) changes=trial;
    }
  }

  // deg tints the card; a step count is already a "how bad" measure.
  let deg=0;
  for(const gid of Object.keys(changes)) deg=Math.max(deg,(changes[gid]-(cur[gid]||0))/8);
  return {changes, deg:Math.min(1,deg)};
}

// ── Degrees-of-failure dialog ─────────────────
// n is a TOTAL step count for g; the row shows where the goal stands now, where
// it would land, and how many rungs that costs on the day's score.
function describeRelaxChange(g, n){
  const unit=g.unit?` ${g.unit}`:'', k=n-stepsOf(g);
  const cost=` <small style="opacity:.7">(+${k} step${k===1?'':'s'})</small>`;
  if(g.type==='range'){
    return `${esc(g.name)}: ${g.goal} ± ${fmtVal(effRange(g),g)} → <b>${g.goal} ± ${fmtVal(applySteps(g,n).range,g)}</b>${unit}${cost}`;
  }
  const dir=(g.type==='max'||g.type==='avg_max'||g.type==='variety_max')?'≤':'≥';
  return `${esc(g.name)}: ${dir}${fmtVal(effThr(g),g)} → <b>${dir}${fmtVal(applySteps(g,n).threshold,g)}</b>${unit}${cost}`;
}
// Total added rungs a change set would cost — the number the score goes up by.
function relaxCost(changes){
  let n=0;
  for(const [gid,v] of Object.entries(changes)){
    const g=S.goals.find(x=>x.id===gid); if(!g) continue;
    n+=Math.max(0, v-stepsOf(g));
  }
  return n;
}

function openRelaxDialog(f, info){
  const entries=Object.entries(info.changes)
    .map(([gid,nv])=>[S.goals.find(g=>g.id===gid),nv])
    .filter(([g])=>g);
  const rowsFor=ch=>Object.entries(ch)
    .map(([gid,nv])=>[S.goals.find(g=>g.id===gid),nv])
    .filter(([g])=>g)
    .map(([g,nv])=>`<li>${describeRelaxChange(g,nv)}</li>`).join('');
  const body=entries.length
    ? `<p style="margin-bottom:8px"><b>${esc(f.name)}</b> doesn't fit today's plan. Relax these goals for today only?</p>
       <ul style="margin:0 0 14px 18px;font-size:13px;line-height:1.8">${rowsFor(info.changes)}</ul>`
    : `<p style="margin-bottom:8px"><b>${esc(f.name)}</b> doesn't fit today's plan — the goals conflict in combination rather than one number being off.</p>
       <p id="relax-joint" style="margin-bottom:14px;font-size:13px;opacity:.75">⏳ Searching for the smallest combination of goals to relax…</p>`;
  openModal(`<h2>🔓 Doesn't fit the plan</h2>${body}
    <div class="mactions" id="relax-actions">
      ${entries.length?`<button type="button" class="btn pri" id="btn-relax-add">Relax goals & add (+${relaxCost(info.changes)})</button>`:''}
      <button type="button" class="btn" id="btn-track-add">Track freely</button>
      <button type="button" class="btn btn-cancel">Cancel</button>
    </div>`);
  const applyRelax=changes=>{
    closeModal();
    applyRelaxSteps(changes);
    forceAddServing(f.id);
  };
  document.getElementById('btn-relax-add')?.addEventListener('click',()=>applyRelax(info.changes));
  document.getElementById('btn-track-add').addEventListener('click',()=>{
    closeModal();
    enterTrackingMode();
    forceAddServing(f.id);
  });
  if(!entries.length){
    cancelRelaxSearch();
    const tok={}; _relaxSearchTok=tok;
    searchJointRelax(f, tok, n=>{
      const p=document.getElementById('relax-joint');
      if(p&&_relaxSearchTok===tok) p.textContent=`⏳ Searching for the smallest combination of goals to relax… (${n} checked)`;
    }).then(res=>{
      if(_relaxSearchTok!==tok) return;
      _relaxSearchTok=null;
      const p=document.getElementById('relax-joint');
      if(!p) return; // dialog replaced/closed meanwhile
      if(!res||!Object.keys(res.changes).length){
        p.textContent='Even relaxing every other goal doesn\'t make it fit — the calorie window itself can\'t be completed with it. You can still add it with free tracking.';
        return;
      }
      const many=Object.keys(res.changes).length>1;
      p.outerHTML=`<p style="margin-bottom:8px">${many?'Relaxing these goals together':'Relaxing this goal'} for today only would make it fit:</p>
        <ul style="margin:0 0 14px 18px;font-size:13px;line-height:1.8">${rowsFor(res.changes)}</ul>`;
      const btn=document.createElement('button');
      btn.type='button'; btn.className='btn pri'; btn.id='btn-relax-add';
      btn.textContent=`${many?'Relax goals & add':'Relax goal & add'} (+${relaxCost(res.changes)})`;
      btn.addEventListener('click',()=>applyRelax(res.changes));
      const acts=document.getElementById('relax-actions');
      acts.insertBefore(btn,acts.firstChild);
    });
  }
}

// The day is stuck: the exact solver found zero valid completions from the
// current state (usually after several servings of one food squeezed the
// remaining calorie room). A dead-end warning is never the right answer — the
// planner just takes the smallest ladder relaxation that unsticks the day and
// charges the score for it. The relax banner and score chip keep that visible;
// "Restore goals" undoes it. Only the genuinely unfixable case shows a message.
function autoRelax(banner){
  const h=incFeasHash();
  const overlayOpen=!document.getElementById('overlay').classList.contains('h');
  // One search at a time, and never while a relax dialog is driving its own.
  if(_autoRelaxHash!==h && !overlayOpen && _relaxSearchTok===null){
    _autoRelaxHash=h; _autoRelaxFailed=false;
    const tok={}; _relaxSearchTok=tok;
    searchJointRelax(null, tok).then(res=>{
      if(_relaxSearchTok!==tok) return;
      _relaxSearchTok=null;
      if(!res||!Object.keys(res.changes).length){ _autoRelaxFailed=true; render(); return; }
      applyRelaxSteps(res.changes);
      startIncFeasCompute();
      saveState(); render();
    });
  }
  if(_autoRelaxFailed && _autoRelaxHash===h){
    banner.className=''; // warning style (yellow)
    banner.innerHTML='⚠️ Even relaxing every goal can\'t finish today from here — remove a food, reset the day, or <button type="button" class="btn btn-sm" id="btn-state-free">track freely</button>.';
    document.getElementById('btn-state-free').addEventListener('click',()=>{enterTrackingMode();render();});
  } else {
    banner.className='computing';
    banner.textContent='🔓 Loosening goals so today can still finish…';
  }
}

// Bypasses addServing's _incComputing guard: the user explicitly confirmed this
// add via the relax dialog, and goals/state just changed anyway.
function forceAddServing(id){
  S.servings[id]=(servingsOf(id)||0)+1;
  startIncFeasCompute();
  saveState(); render();
}

function addServing(id){
  if(!S.trackingMode&&_incComputing) return; // block until exact feasibility is confirmed (not needed in tracking mode)
  const nc=(servingsOf(id)||0)+1; S.servings[id]=nc;
  startIncFeasCompute();
  saveState(); render();
}
function removeServing(id){
  const cur=servingsOf(id); if(!cur) return;
  if(cur<=1) delete S.servings[id]; else S.servings[id]=cur-1;
  startIncFeasCompute();
  saveState(); render();
}
function toggleExclude(id){
  if(S.excluded[id]){
    delete S.excluded[id];
  } else {
    S.excluded[id]=true;
  }
  startIncFeasCompute();
  saveState(); render();
}

function archiveFood(id){
  // Temp foods just get removed; they're day-scoped anyway
  const ti=S.temp.findIndex(x=>x.id===id);
  if(ti>=0){ S.temp.splice(ti,1); delete S.servings[id]; saveState(); return; }
  if(BASE_FOODS.find(f=>f.id===id)){
    S.overrides[id]={...(S.overrides[id]||{}),archived:true};
  } else {
    const ci=S.custom.findIndex(x=>x.id===id);
    if(ci>=0) S.custom[ci]={...S.custom[ci],archived:true};
  }
  delete S.servings[id];
  delete S.excluded[id];
  saveState();
}

function restoreFood(id){
  if(S.overrides[id]?.archived){
    delete S.overrides[id].archived;
    if(!Object.keys(S.overrides[id]).length) delete S.overrides[id];
  } else {
    const ci=S.custom.findIndex(x=>x.id===id);
    if(ci>=0) delete S.custom[ci].archived;
  }
  saveState();
}

function openModal(html, onSubmit){

document.getElementById('overlay').addEventListener('click',ev=>{

});

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// ── Goal type labels ──────────────────────────
const TYPE_LABELS = {range:'Range',min:'Minimum',max:'Maximum',avg_min:'Avg Min',avg_max:'Avg Max',count_min:'Count Min',variety_min:'Weekly Variety',variety_max:'Weekly Cap'};

// ── Settings / Goal Manager ───────────────────
function openSettings(){
  const goalRows = S.goals.map((g,idx)=>{
    let params;
    if(g.type==='range') params=`${g.goal} ± ${g.range}${g.unit?' '+g.unit:''}`;
    else if(g.type==='count_min'){
      const catName=g.targetCategory?getCategoryName(g.targetCategory):'Meals (flag)';
      params=`≥ ${g.threshold} · tab: ${catName}`;
    } else if(g.type==='variety_min') params=`≥ ${g.threshold} families/week`;
    else if(g.type==='variety_max') params=`≤ ${g.threshold}% of weekly servings`;
    else if(g.type==='min'||g.type==='avg_min') params=`≥ ${g.threshold}${g.unit?' '+g.unit:''}`;
    else params=`≤ ${g.threshold}${g.unit?' '+g.unit:''}${g.weekly?' per week':''}`;
    const off=g.enabled===false;
    // 'cal' has no toggle: the solver can't run without a calorie window
    const toggle=g.id==='cal'
      ? `<span class="goal-params" title="Calories anchor the plan solver and can't be disabled">always on</span>`
      : `<button class="btn btn-sm${off?'':' pri'}" data-tog-g="${idx}" title="${off?'Enable':'Disable'} this goal">${off?'Off':'On'}</button>`;
    return `<div class="goal-row"${off?' style="opacity:.55"':''}>
      <div class="goal-info">
        <span class="goal-name">${esc(g.name)}</span>
        <span class="goal-badge">${TYPE_LABELS[g.type]||g.type}</span>
        <span class="goal-params">${params}</span>
      </div>
      <div class="goal-actions">
        ${toggle}
        <button class="btn btn-sm" data-edit-g="${idx}">Edit</button>
        ${!g.builtin?`<button class="btn btn-sm dng" data-del-g="${idx}">✕</button>`:''}
      </div>
    </div>`;
  }).join('');

  const bm=barMode();
  openModal(`<h2>⚙ Goals</h2>
    <div class="sec-lbl">CARD COLOUR BAR</div>
    <div class="goal-row">
      <div class="goal-info">
        <span class="goal-name">${bm==='restrict'?'How much it closes off':'Health score'}</span>
        <span class="goal-params">${bm==='restrict'
          ? 'Green = picking it rules out nothing; red = it rules out most of what you could still eat'
          : 'Green = high health score, red = low'}</span>
      </div>
      <div class="goal-actions">
        <button class="btn btn-sm" id="btn-bar-mode">Show ${bm==='restrict'?'health':'restrictiveness'}</button>
      </div>
    </div>
    <div class="sec-lbl" style="margin-top:14px">ACTIVE GOALS</div>
    <div id="goals-list" style="margin-bottom:14px">${goalRows}</div>
    <button class="btn pri" id="btn-add-goal">＋ Add Goal</button>
    <div class="mactions"><button type="button" class="btn btn-cancel">Close</button></div>`);

  document.getElementById('btn-bar-mode').addEventListener('click',()=>{
    LS.set(lk('barMode'), bm==='restrict' ? 'health' : 'restrict');
    startIncFeasCompute(); // starts (or cancels) the restrictiveness sweep
    render(); closeModal(); openSettings();
  });
  document.getElementById('btn-add-goal').addEventListener('click',()=>{
    closeModal();
    openGoalEditModal(null, g=>{
      S.goals.push(g);
      saveState(); render(); openSettings();
    });
  });
  document.querySelectorAll('[data-tog-g]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=+btn.dataset.togG;
      const g=S.goals[idx];
      if(g.id==='cal') return;
      S.goals[idx]={...g, enabled:g.enabled===false};
      startIncFeasCompute();
      saveState(); render(); openSettings();
    });
  });
  document.querySelectorAll('[data-edit-g]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=+btn.dataset.editG;
      const original=S.goals[idx];
      closeModal();
      openGoalEditModal(original, updated=>{
        S.goals[idx]=updated;
        saveState(); render(); openSettings();
      });
    });
  });
  document.querySelectorAll('[data-del-g]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=+btn.dataset.delG;
      if(!confirm(`Delete goal "${S.goals[idx].name}"?`)) return;
      S.goals.splice(idx,1);
      saveState(); render(); openSettings();
    });
  });
}

// ── Add / Edit Goal modal ─────────────────────
function openGoalEditModal(existing, onSave){
  const isNew=!existing;
  const g=existing||{id:'',name:'',unit:'',type:'min',threshold:0,goal:1900,range:50,default:0,builtin:false};

  // variety types aren't user-creatable, but a builtin variety goal's disabled
  // select must still show its own type
  const typeList=['range','min','max','avg_min','avg_max','count_min'];
  if(g.type&&!typeList.includes(g.type)) typeList.push(g.type);
  const typeOpts=typeList.map(t=>
    `<option value="${t}"${g.type===t?' selected':''}>${TYPE_LABELS[t]||t}</option>`
  ).join('');

  openModal(`<h2>${isNew?'＋ Add Goal':'✎ Edit Goal: '+esc(g.name)}</h2>
    <form>
      <div class="fg"><label>Name</label><input type="text" name="name" required value="${esc(g.name)}" placeholder="e.g. Sodium"></div>
      <div class="fg"><label>Unit <small style="color:var(--muted)">(optional, e.g. g, mg)</small></label>
        <input type="text" name="unit" value="${esc(g.unit||'')}" placeholder="optional"></div>
      <div class="fg"><label>Type</label>
        <select name="type" id="gtype-sel"${g.builtin?' disabled':''}>${typeOpts}</select>
      </div>
      <div id="gparams"></div>
      <div class="fg"><label>Default value for new foods</label>
        <input type="number" name="gdefault" value="${g.default??0}" step="any"></div>
      <div class="mactions">
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn pri">${isNew?'Add Goal':'Save'}</button>
      </div>
    </form>`,
    form=>{
      const d=new FormData(form);
      const type=g.builtin?g.type:d.get('type');
      const name=d.get('name').trim();
      if(!name) return;
      const unit=d.get('unit').trim();
      const def=parseFloat(d.get('gdefault'))||0;
      const updated={...g, name, unit, type, default:def};
      if(type==='range'){
        updated.goal=parseFloat(d.get('gparam1'))||0;
        updated.range=parseFloat(d.get('gparam2'))||0;
        delete updated.threshold; delete updated.targetCategory;
      } else if(type==='count_min'){
        updated.threshold=parseFloat(d.get('gparam1'))||0;
        updated.targetCategory=d.get('targetCategory')||'';
        delete updated.goal; delete updated.range;
      } else {
        updated.threshold=parseFloat(d.get('gparam1'))||0;
        delete updated.goal; delete updated.range; delete updated.targetCategory;
      }
      if(isNew){ updated.id='cg_'+Date.now(); updated.builtin=false; }
      closeModal();
      onSave(updated);
    });

  function renderParams(type){
    const el=document.getElementById('gparams'); if(!el) return;
    if(type==='range'){
      el.innerHTML=`
        <div class="fg"><label>Target value</label><input type="number" name="gparam1" value="${g.goal??1900}" step="any" required></div>
        <div class="fg"><label>Range (±)</label><input type="number" name="gparam2" value="${g.range??50}" min="0" step="any" required></div>`;
    } else if(type==='count_min'){
      const catOpts=S.categories.map(c=>`<option value="${esc(c.id)}"${g.targetCategory===c.id?' selected':''}>${esc(c.name)}</option>`).join('');
      el.innerHTML=`
        <div class="fg"><label>Minimum count</label><input type="number" name="gparam1" value="${g.threshold??2}" step="1" min="0" required></div>
        <div class="fg"><label>Count foods in tab</label>
          <select name="targetCategory">
            <option value=""${!g.targetCategory?' selected':''}>— Any (use meal flag fallback) —</option>
            ${catOpts}
          </select>
        </div>`;
    } else {
      const lbl=g.weekly
        ?`Weekly budget${g.unit?' ('+g.unit+')':''} <small style="color:var(--muted)">— spread over the rolling 7-day window</small>`
        :({min:'Minimum',max:'Maximum',avg_min:'Minimum average',avg_max:'Maximum average',
           variety_min:'Distinct food families per week (minimum)',
           variety_max:'Max share of one family (% of weekly servings)'}[type]||'Threshold');
      el.innerHTML=`<div class="fg"><label>${lbl}</label><input type="number" name="gparam1" value="${g.threshold??0}" step="any" required></div>`;
    }
  }

  const sel=document.getElementById('gtype-sel');
  if(sel){
    renderParams(sel.value);
    if(!g.builtin) sel.addEventListener('change',()=>renderParams(sel.value));
  }
}

// ── Extras fields helper ──────────────────────
// Only enabled goals get a field — a parked goal's stored value is preserved
// untouched by extrasFromForm rather than shown and re-entered.
function renderExtrasFields(vals){
  const goals=S.goals.filter(g=>g.enabled!==false&&g.id!=='cal'&&g.type!=='count_min'&&!isVarietyGoal(g));
  if(!goals.length) return '';
  let html='<div class="sep"></div><div class="sec-lbl">GOAL METRICS</div>';
  for(const g of goals){
    const v=vals&&vals[g.id]!==undefined?vals[g.id]:(g.default??0);
    const unit=g.unit?` (${g.unit})`:'';
    const eid='ev_'+g.id;
    if((g.type==='avg_min'||g.type==='avg_max')&&g.threshold<=1&&g.threshold>=0){
      html+=`<div class="fg"><label>${esc(g.name)}: <span class="rv" id="${eid}">${(+v).toFixed(2)}</span></label>
        <input type="range" name="ex_${g.id}" value="${+v}" min="0" max="1" step="0.05"
          oninput="document.getElementById('${eid}').textContent=parseFloat(this.value).toFixed(2)"></div>`;
    } else {
      html+=`<div class="fg"><label>${esc(g.name)}${unit}</label>
        <input type="number" name="ex_${g.id}" value="${+v}" min="0" step="any"></div>`;
    }
  }
  return html;
}

function extrasFromForm(form, prev){
  const d=new FormData(form);
  const extras={...(prev||{})}; // keep metrics with no field (parked goals)
  for(const g of S.goals){
    if(g.id==='cal'||g.type==='count_min'||isVarietyGoal(g)) continue;
    const raw=d.get('ex_'+g.id);
    if(raw!==null) extras[g.id]=parseFloat(raw)||0;
  }
  return extras;
}

function openEditModal(id){
  const f=getFoodById(id); if(!f) return;
  const isBase=f.isBase;
  const curCat=getFoodCategory(f);
  openModal(`<h2>✎ Edit: ${esc(f.name)}</h2>
    <form>
      <div class="fg"><label>Name</label><input type="text" name="name" value="${esc(f.name)}" required></div>
      <div class="fg"><label>Calories</label><input type="number" name="cal" value="${f.cal}" required min="0" max="5000"></div>
      <div class="fg"><label>Max servings <small style="color:var(--muted)">(solver limit)</small></label>
        <input type="number" name="maxServings" value="${f.maxServings||2}" min="1" max="10" step="1"></div>
      ${categoryPickerHtml(curCat)}
      ${renderExtrasFields(f.extras||{})}
      ${aiVarietyOn()?`<div class="fg"><label>Variety tags <small style="color:var(--muted)">(1–3 food families, comma-separated)</small></label>
        <input type="text" name="vtags" value="${esc((f.vtags||[]).join(', '))}" placeholder="blank = own family ('${esc(slugTag(f.name))}')"></div>`:''}
      <div class="mactions">
        ${isBase?`<button type="button" class="btn" id="btn-rfood">Reset</button>`
                :`<button type="button" class="btn dng" id="btn-dfood">Delete</button>`}
        <button type="button" class="btn" id="btn-archfood">Archive</button>
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn pri">Save</button>
      </div>
    </form>`,
    form=>{
      const d=new FormData(form);
      const ms=Math.max(1,parseInt(d.get('maxServings'))||2);
      const catVal=d.get('category')||'';
      const upd={name:d.get('name').trim(),cal:+d.get('cal'),maxServings:ms,category:catVal,extras:extrasFromForm(form,f.extras)};
      if(d.get('vtags')!==null){
        const vt=parseVtags(d.get('vtags'));
        // vtags:undefined (not delete) so the merge spreads CLEAR previously set
        // tags; skipped entirely when the field is hidden (variety goals parked)
        upd.vtags=vt.length?vt:undefined;
      }
      if(isBase){
        // merge, so fields with no form field (parked goals) survive an edit
        S.overrides[id]={...(S.overrides[id]||{}),...upd};
      } else {
        const ci=S.custom.findIndex(x=>x.id===id);
        if(ci>=0) S.custom[ci]={...S.custom[ci],...upd};
        const ti=S.temp.findIndex(x=>x.id===id);
        if(ti>=0) S.temp[ti]={...S.temp[ti],...upd};
      }
      saveState(); closeModal(); render();
    });
  document.getElementById('btn-rfood')?.addEventListener('click',()=>{
    delete S.overrides[id]; saveState(); closeModal(); render();
  });
  document.getElementById('btn-dfood')?.addEventListener('click',()=>{
    S.custom=S.custom.filter(x=>x.id!==id);
    S.temp=S.temp.filter(x=>x.id!==id);
    delete S.servings[id];
    saveState(); closeModal(); render();
  });
  document.getElementById('btn-archfood')?.addEventListener('click',()=>{
    archiveFood(id); closeModal(); render();
  });
}

// ── Library modal ────────────────────────────
function openLibraryModal(){
  const allF=allFoods({includeArchived:true});
  const active=allF.filter(f=>!f.archived&&(f.isBase||f.isPerm)).sort((a,b)=>a.name.localeCompare(b.name));
  const archived=allF.filter(f=>f.archived).sort((a,b)=>a.name.localeCompare(b.name));

  const activeRows=active.map(f=>`
    <div class="goal-row">
      <div class="goal-info">
        <span class="goal-name">${esc(f.name)}</span>
        <span class="goal-badge">${esc(getCategoryName(getFoodCategory(f)))}</span>
        <span class="goal-params">${f.cal} cal${f.isBase?'':' · custom'}</span>
      </div>
      <div class="goal-actions">
        <button class="btn btn-sm" data-edit-f="${f.id}">Edit</button>
        <button class="btn btn-sm" data-arch-f="${f.id}">Archive</button>
      </div>
    </div>`).join('') || '<div class="empty" style="padding:8px 0">No active foods.</div>';

  const archRows=archived.map(f=>`
    <div class="goal-row" style="opacity:.6">
      <div class="goal-info">
        <span class="goal-name">${esc(f.name)}</span>
        <span class="goal-badge">${esc(getCategoryName(getFoodCategory(f)))}</span>
        <span class="goal-params">${f.cal} cal${f.isBase?'':' · custom'}</span>
      </div>
      <div class="goal-actions">
        <button class="btn btn-sm ok" data-restore-f="${f.id}">Restore</button>
      </div>
    </div>`).join('') || '<div class="empty" style="padding:8px 0">No archived foods.</div>';

  const storeLine = _persisted===true
    ? `<div style="color:var(--ok);font-size:11px;margin-bottom:4px">✓ Storage is persistent — this browser won't evict your foods</div>`
    : _persisted===false
      ? `<div style="color:var(--muted);font-size:11px;margin-bottom:4px">ℹ Storage is best-effort. Install this app to your home screen and the browser will keep it permanently.</div>`
      : '';

  const fileLine = _libFileHandle
    ? `<div style="color:var(--ok);font-size:11px;margin-bottom:10px">✓ Linked to library file — changes save automatically</div>`
    : _lapsedHandle
      ? `<div style="color:var(--warn);font-size:11px;margin-bottom:10px">🔒 Library file linked but not authorized this session — your foods are safe here; the file backup is just paused</div>`
      : HAS_FSA
        ? `<div style="color:var(--warn);font-size:11px;margin-bottom:10px">⚠ No library file linked — data is browser-only</div>`
        : `<div style="color:var(--muted);font-size:11px;margin-bottom:10px">ℹ Auto file-sync isn't supported on this browser — use Export/Import JSON to back up or transfer</div>`;

  const fsaBtns = HAS_FSA
    ? (_libFileHandle
      ?`<button class="btn btn-sm" id="lbtn-unlink2">Unlink File</button>`
      : _lapsedHandle
      ?`<button class="btn btn-sm pri" id="lbtn-reauth2">Re-authorize File</button>
        <button class="btn btn-sm" id="lbtn-unlink2">Unlink File</button>`
      :`<button class="btn btn-sm pri" id="lbtn-open2">Open Library File</button>
        <button class="btn btn-sm" id="lbtn-new2">Create New File</button>`)
    : '';
  const fileBtns = `<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
    ${fsaBtns}
    <button class="btn btn-sm" id="lbtn-export">⬇ Export JSON</button>
    <button class="btn btn-sm" id="lbtn-import">⬆ Import JSON</button>
  </div>`;

  openModal(`<h2>📚 Food Library</h2>
    ${storeLine}${fileLine}${fileBtns}
    <div class="sec-lbl">ACTIVE FOODS (${active.length})</div>
    <div style="margin-bottom:16px">${activeRows}</div>
    <div class="sec-lbl">ARCHIVED (${archived.length})</div>
    <div>${archRows}</div>
    <div class="mactions"><button type="button" class="btn btn-cancel">Close</button></div>`);

  document.getElementById('lbtn-open2')?.addEventListener('click',async()=>{await pickLibFile();closeModal();openLibraryModal();});
  document.getElementById('lbtn-new2')?.addEventListener('click',async()=>{await newLibFile();closeModal();openLibraryModal();});
  document.getElementById('lbtn-unlink2')?.addEventListener('click',async()=>{await unlinkLibFile();closeModal();openLibraryModal();});
  document.getElementById('lbtn-reauth2')?.addEventListener('click',async()=>{
    // Memory is the newer copy unless this browser has nothing of its own
    await reauthLibFile(_lapsedHandle, haveLocalLibrary()?'save':'load');
    closeModal(); openLibraryModal();
  });
  document.getElementById('lbtn-export')?.addEventListener('click',exportLibraryJSON);
  document.getElementById('lbtn-import')?.addEventListener('click',importLibraryJSON);

  document.querySelectorAll('[data-edit-f]').forEach(btn=>{
    btn.addEventListener('click',()=>{const id=btn.dataset.editF;closeModal();openEditModal(id);});
  });
  document.querySelectorAll('[data-arch-f]').forEach(btn=>{
    btn.addEventListener('click',()=>{archiveFood(btn.dataset.archF);render();closeModal();openLibraryModal();});
  });
  document.querySelectorAll('[data-restore-f]').forEach(btn=>{
    btn.addEventListener('click',()=>{restoreFood(btn.dataset.restoreF);render();closeModal();openLibraryModal();});
  });
}

// ── Compare modal ─────────────────────────────
let _cmpQueue = [];

function openCompare(){
  const feas = computeFeasibility();
  const pool = allFoods().filter(f => feas[f.id] !== false);
  if(pool.length < 2){
    openModal(`<h2>⚔ Compare</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">
        ${pool.length === 0
          ? 'No feasible foods to compare right now.'
          : 'Only one feasible food — nothing to compare!'}
      </p>
      <div class="mactions"><button class="btn btn-cancel">Close</button></div>`);
    return;
  }

  // Build per-category counts from the feasible pool
  const catCounts = {};
  for(const f of pool){
    const cid = getFoodCategory(f);
    catCounts[cid] = (catCounts[cid] || 0) + 1;
  }
  const activeCats = S.categories.filter(c => (catCounts[c.id] || 0) >= 2);

  // If only one (or zero) categories have enough foods, skip the picker
  if(activeCats.length <= 1){
    _cmpQueue = [...pool].sort(() => Math.random() - 0.5);
    renderCompare();
    return;
  }

  const catBtns = activeCats.map(c =>
    `<button class="btn" data-cmp-cat="${esc(c.id)}" style="flex:1 1 auto">${esc(c.name)}</button>`
  ).join('');

  openModal(`<h2>⚔ Compare</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:12px">Which category do you want to compare?</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
      ${catBtns}
      <button class="btn pri" data-cmp-cat="__all__" style="flex:1 1 auto">All</button>
    </div>
    <div class="mactions"><button class="btn btn-cancel">Close</button></div>`);

  document.querySelectorAll('[data-cmp-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cid = btn.dataset.cmpCat;
      const filtered = cid === '__all__' ? pool : pool.filter(f => getFoodCategory(f) === cid);
      if(filtered.length < 2){
        // Shouldn't happen but guard anyway
        _cmpQueue = [...pool].sort(() => Math.random() - 0.5);
      } else {
        _cmpQueue = [...filtered].sort(() => Math.random() - 0.5);
      }
      renderCompare();
    });
  });
}

function renderCompare(){
  const q = _cmpQueue;
  const box = document.getElementById('mbox');
  box.style.maxWidth = '640px';
  document.getElementById('overlay').classList.remove('h');

  if(q.length === 1){
    const f = q[0];
    const statsHtml = foodStatsHtml(f, {names:true});
    const canEat = servingsOf(f.id) < maxServingsOf(f.id);
    box.innerHTML = `
      <h2>⚔ Compare</h2>
      <div class="cmp-winner">
        <div style="font-size:2.2rem;margin-bottom:6px">🏆</div>
        <div style="font-size:1.25rem;font-weight:800;margin-bottom:8px">${esc(f.name)}</div>
        <div style="font-size:12px;color:var(--muted)">${statsHtml}</div>
      </div>
      <div class="mactions">
        <button class="btn btn-cancel">Close</button>
        <button class="btn" id="btn-cmp-again">↺ Try Again</button>
        ${canEat ? `<button class="btn pri" id="btn-cmp-eat">＋ Add to Today</button>` : ''}
      </div>`;
    document.getElementById('btn-cmp-again')?.addEventListener('click', openCompare);
    document.getElementById('btn-cmp-eat')?.addEventListener('click', ()=>{ box.style.maxWidth=''; closeModal(); addServing(f.id); });
    document.querySelector('.btn-cancel')?.addEventListener('click', ()=>{ box.style.maxWidth=''; closeModal(); });
    return;
  }

  const [a, b] = q;

  function cmpCardHtml(f){
    const h = getHealthMetric(f);
    const dispGoals = getDispGoals();
    let statsLines = [`${f.cal} cal`];
    for(const g of dispGoals){
      const v=getMetric(f,g);
      if(g.type==='avg_min'||g.type==='avg_max')
        statsLines.push(`♥ ${v.toFixed(2)}`);
      else
        statsLines.push(`${fmtVal(v,g)}${g.unit?` ${g.unit}`:''} ${g.name.toLowerCase()}`);
    }
    return `<div class="cmp-card" data-cid="${esc(f.id)}">
      <div class="cmp-hbar" style="background:${healthColor(h)}"></div>
      <div class="cmp-body">
        <div class="cmp-name">${esc(f.name)}</div>
        <div class="cmp-stats">${statsLines.join('<br>')}</div>
      </div>
    </div>`;
  }

  box.innerHTML = `
    <h2>⚔ Compare <small style="font-size:.7em;font-weight:400;color:var(--muted)">${q.length} remaining</small></h2>
    <div style="display:flex;gap:10px;align-items:stretch;margin-bottom:10px">
      ${cmpCardHtml(a)}
      <div style="display:flex;align-items:center;font-weight:800;color:var(--muted);flex-shrink:0">VS</div>
      ${cmpCardHtml(b)}
    </div>
    <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:4px">Click a card to keep it — the other is eliminated</div>
    <div class="mactions">
      <button class="btn btn-cancel">Close</button>
    </div>`;

  document.querySelectorAll('.cmp-card').forEach(card => {
    card.addEventListener('click', ()=>{
      const [front1, front2, ...rest] = _cmpQueue;
      const winner = card.dataset.cid === front1.id ? front1 : front2;
      _cmpQueue = [...rest, winner];
      renderCompare();
    });
  });
  document.querySelector('.btn-cancel')?.addEventListener('click', ()=>{ box.style.maxWidth=''; closeModal(); });
}

function aiVarietyOn(){ return S.goals.some(g=>isVarietyGoal(g)&&g.enabled!==false); }
function aiMetricGoals(){

}

    :'';

  return `You are the built-in assistant of a personal meal-planner web app. The user plans and tracks daily food against goals.

Daily goals:
${goalLines}

Tabs (categories): ${S.categories.map(c=>`"${c.id}" = ${c.name}`).join(', ')}

Food library (per-serving values):
${foodLines}

Eaten today:
${eaten}
Exercise burned today: ${S.exCals} cal
${healthNote}
You can add new foods with the add_food tool. When the user mentions a food that is not in the library, estimate realistic per-serving values for every goal metric yourself — do not ask for values unless the food is truly ambiguous. You also have web search: use it when the user names a specific brand, restaurant, or menu item (e.g. a fast-food order) so you can use the chain's published nutrition numbers instead of guessing, or when they ask you to look something up. For generic foods, your own estimates are fine — do not search for those. Default to a temporary food (permanent=false, lasts today only) unless the user asks to save it to the library. After a tool call succeeds, confirm briefly with the values you used. Keep answers short and practical.

${vOn?`Variety tags ("vtags"): each food gets 1–3 lowercase family tags used to track weekly dietary variety — the specific identity family first (two pizza variants share "pizza"; they are zero variety apart), plus a broader nutritional family where meaningful (oatmeal ["oats","grains"]; black beans ["beans","legumes"]; a meal-replacement shake ["shake","protein-supp","grains"]). Reuse tags already in the library where they fit — variety scoring works by overlap. Always include vtags when adding a food. Use set_food_tags to tag existing foods; if the user asks to "tag my library", tag every UNTAGGED food in one set_food_tags call.

`:''}Only the goals listed above exist — never ask for or invent values for any other metric.

Use update_foods to change values on existing foods, including bulk fills — e.g. "fill in the protein for my library": estimate a realistic per-serving value for EVERY food and send one update_foods call. Never invent a value of 0 to mean "unknown" — give your best estimate.`;
}

function aiTools(){
  const vOn=aiVarietyOn();
  const extraProps={};
  for(const g of aiMetricGoals()) extraProps[g.id]={type:'number',description:`${g.name}${g.unit?' in '+g.unit:''} per serving`};
  const vtagsProp=vOn?{vtags:{type:'array',items:{type:'string'},description:'1–3 lowercase variety family tags, e.g. ["pizza"] or ["oats","grains"]'}}:{};
  const tools=[{
    type:'web_search',
  },{
    type:'function',
    name:'add_food',
    description:'Add a new food to the app. Fill in every goal metric with provided or estimated per-serving values.',
    parameters:{
      type:'object',
      properties:{
        name:{type:'string',description:'Display name of the food'},
        cal:{type:'number',description:'Calories per serving'},
        extras:{type:'object',description:'Per-serving value for each goal metric',properties:extraProps},
        permanent:{type:'boolean',description:'true = save permanently to the library; false = temporary food for today only (default)'},
        category:{type:'string',enum:S.categories.map(c=>c.id),description:'Tab to place the food in'},
        maxServings:{type:'integer',description:'Max servings per day the solver may use (default 2)'},
        ...vtagsProp,
      },
      required:['name','cal','extras'],
    },
  }];
  if(vOn) tools.push({
    type:'function',
    name:'set_food_tags',
    description:'Assign variety family tags to existing foods (bulk-capable — use one call for "tag my library").',
    parameters:{
      type:'object',
      properties:{
        tags:{type:'array',items:{
          type:'object',
          properties:{
            food:{type:'string',description:'Food name exactly as listed in the library'},
            vtags:{type:'array',items:{type:'string'},description:'1–3 lowercase family tags'},
          },
          required:['food','vtags'],
        }},
      },
      required:['tags'],
    },
  });
  tools.push({
    type:'function',
    name:'update_foods',
    description:'Update existing foods in bulk: goal metric values, calories, or max servings. Use for requests like "fill in the protein for my whole library" — estimate values yourself and send one call covering every food. Only include the fields being changed.',
    parameters:{
      type:'object',
      properties:{
        updates:{type:'array',items:{
          type:'object',
          properties:{
            food:{type:'string',description:'Food name exactly as listed in the library'},
            cal:{type:'number',description:'New calories per serving'},
            extras:{type:'object',description:'Goal metric values to set (only those changing)',properties:extraProps},
            ...vtagsProp,
            maxServings:{type:'integer'},
          },
          required:['food'],
        }},
      },
      required:['updates'],
    },
  });
  return tools;
}

function aiExecTool(name,args){
  if(name==='set_food_tags') return aiSetFoodTags(args);
  if(name==='update_foods') return aiUpdateFoods(args);
  if(name!=='add_food') return {ok:false,error:'Unknown tool: '+name};
  const foodName=String(args.name||'').trim();
  if(!foodName) return {ok:false,error:'name is required'};
  const food={
    id:'custom-'+Date.now()+'-'+Math.floor(Math.random()*1e4),
    name:foodName,
    cal:Math.max(0,Math.round(+args.cal||0)),
    maxServings:Math.max(1,parseInt(args.maxServings)||2),
    category:S.categories.some(c=>c.id===args.category)?args.category:'',
    extras:{},
  };
  for(const g of S.goals){
    if(g.id==='cal'||g.type==='count_min'||isVarietyGoal(g)) continue;
    const v=args.extras&&args.extras[g.id];
    food.extras[g.id]=v!==undefined&&v!==null?+v||0:(g.default??0);
  }
  const vt=Array.isArray(args.vtags)?parseVtags(args.vtags.join(',')):[];
  if(vt.length) food.vtags=vt;
  if(args.permanent) S.custom.push(food); else S.temp.push(food);
  saveState(); render();
  return {ok:true,added:food.name,cal:food.cal,permanent:!!args.permanent,extras:food.extras,vtags:food.vtags};
}

function aiSetFoodTags(args){
  const items=Array.isArray(args.tags)?args.tags:[];
  if(!items.length) return {ok:false,error:'tags array is empty'};
  const foods=allFoods({includeArchived:true});
  let tagged=0; const missed=[];
  for(const it of items){
    const nm=String(it.food||'').trim().toLowerCase();
    const vt=Array.isArray(it.vtags)?parseVtags(it.vtags.join(',')):[];
    if(!nm||!vt.length){ missed.push(it.food||'(blank)'); continue; }
    const f=foods.find(x=>x.name.toLowerCase()===nm)||foods.find(x=>x.name.toLowerCase().includes(nm));
    if(!f){ missed.push(it.food); continue; }
    if(f.isBase){
      S.overrides[f.id]={...(S.overrides[f.id]||{}),vtags:vt};
    } else {
      const ci=S.custom.findIndex(x=>x.id===f.id);
      if(ci>=0) S.custom[ci]={...S.custom[ci],vtags:vt};
      const ti=S.temp.findIndex(x=>x.id===f.id);
      if(ti>=0) S.temp[ti]={...S.temp[ti],vtags:vt};
    }
    tagged++;
  }
  saveState(); render();
  return {ok:true,tagged,missed};
}

// Bulk-edit existing foods (AI tool). Base foods get a partial override merged
// on top of any existing one; extras merge per-key so untouched metrics keep
// their values. Matches by exact name first, then substring.
function aiUpdateFoods(args){
  const items=Array.isArray(args.updates)?args.updates:[];
  if(!items.length) return {ok:false,error:'updates array is empty'};
  const foods=allFoods({includeArchived:true});
  const metricGoals=S.goals.filter(g=>g.id!=='cal'&&g.type!=='count_min'&&!isVarietyGoal(g));
  let updated=0; const missed=[];
  for(const it of items){
    const nm=String(it.food||'').trim().toLowerCase();
    const f=nm?(foods.find(x=>x.name.toLowerCase()===nm)||foods.find(x=>x.name.toLowerCase().includes(nm))):null;
    if(!f){ missed.push(it.food||'(blank)'); continue; }
    const upd={};
    if(it.cal!==undefined&&it.cal!==null) upd.cal=Math.max(0,Math.round(+it.cal||0));
    if(it.maxServings!==undefined&&it.maxServings!==null) upd.maxServings=Math.max(1,parseInt(it.maxServings)||f.maxServings||2);
    if(Array.isArray(it.vtags)){
      const vt=parseVtags(it.vtags.join(','));
      if(vt.length) upd.vtags=vt;
    }
    const ex={};
    if(it.extras&&typeof it.extras==='object')
      for(const g of metricGoals){
        const v=it.extras[g.id];
        if(v!==undefined&&v!==null) ex[g.id]=+v||0;
      }
    const hasEx=Object.keys(ex).length>0;
    if(!Object.keys(upd).length&&!hasEx){ missed.push(f.name+' (no recognized fields)'); continue; }
    if(f.isBase){
      const prev=S.overrides[f.id]||{};
      S.overrides[f.id]={...prev,...upd};
      if(hasEx) S.overrides[f.id].extras={...(prev.extras||{}),...ex};
    } else {
      const patch=o=>({...o,...upd,...(hasEx?{extras:{...(o.extras||{}),...ex}}:{})});
      const ci=S.custom.findIndex(x=>x.id===f.id); if(ci>=0) S.custom[ci]=patch(S.custom[ci]);
      const ti=S.temp.findIndex(x=>x.id===f.id); if(ti>=0) S.temp[ti]=patch(S.temp[ti]);
    }
    updated++;
  }
  saveState(); render();
  return {ok:true,updated,missed};
}

async function aiSend(text){
  AI.msgs.push({role:'user',content:text});
  AI.busy=true; renderChatLog();
  try{
    // Responses API: server threads the conversation via previous_response_id,
    // so each round only sends the new items (user msg, then tool outputs).
    let input=[{role:'user',content:text}];
    for(let round=0; round<6; round++){
      const body={model:aiModel(),instructions:aiSystemPrompt(),input,tools:aiTools()};
      if(AI.prevId) body.previous_response_id=AI.prevId;
      const res=await fetch('https://api.openai.com/v1/responses',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+aiKey()},
        body:JSON.stringify(body),
      });
      if(!res.ok){
        let em='HTTP '+res.status;
        try{const j=await res.json();em=j.error?.message||em;}catch{}
        throw new Error(em);
      }
      const data=await res.json();
      AI.prevId=data.id;
      const outs=[];
      for(const item of data.output||[]){
        if(item.type==='message'){
          const t=(item.content||[]).filter(c=>c.type==='output_text').map(c=>c.text).join('');
          if(t) AI.msgs.push({role:'assistant',content:t});
        }
        else if(item.type==='web_search_call'){
          AI.msgs.push({role:'tool',content:JSON.stringify({ok:true,searched:item.action?.query||''})});
        }
        else if(item.type==='function_call'){
          let result;
          try{ result=aiExecTool(item.name,JSON.parse(item.arguments||'{}')); }
          catch(e){ result={ok:false,error:String(e.message||e)}; }
          AI.msgs.push({role:'tool',content:JSON.stringify(result)});
          outs.push({type:'function_call_output',call_id:item.call_id,output:JSON.stringify(result)});
        }
      }
      renderChatLog();
      if(!outs.length) break;
      input=outs; // let the model see tool results and respond
    }
  }catch(e){
    AI.msgs.push({role:'_sys',content:'⚠ '+(e.message||e)});
  }
  AI.busy=false; renderChatLog();
}

function renderChatLog(){
  const el=document.getElementById('chat-log');
  if(!el) return;
  let html='';
  if(!AI.msgs.length){
    html+=`<div class="chat-msg sys">Ask me to add foods — e.g. "add a bowl of chili as a temp food" — and I'll estimate the values. For brand or restaurant items I can search the web for the real nutrition numbers — e.g. "look up a McDonald's Big Mac and add it". Or say "tag my library" to set variety tags on everything.</div>`;
  }
  for(const m of AI.msgs){
    if(m.role==='user') html+=`<div class="chat-msg user">${esc(m.content)}</div>`;
    else if(m.role==='assistant'&&m.content) html+=`<div class="chat-msg ai">${esc(m.content)}</div>`;
    else if(m.role==='tool'){
      let r=null; try{r=JSON.parse(m.content);}catch{}
      if(r&&r.ok&&r.searched!==undefined){
        html+=`<div class="chat-msg tool">🔍 Searched the web${r.searched?`: “${esc(r.searched)}”`:''}</div>`;
      }
      else if(r&&r.ok&&r.tagged!==undefined){
        html+=`<div class="chat-msg tool">✓ Tagged ${r.tagged} food${r.tagged===1?'':'s'}${r.missed&&r.missed.length?` — not found: ${esc(r.missed.join(', '))}`:''}</div>`;
      }
      else if(r&&r.ok&&r.updated!==undefined){
        html+=`<div class="chat-msg tool">✓ Updated ${r.updated} food${r.updated===1?'':'s'}${r.missed&&r.missed.length?` — skipped: ${esc(r.missed.join(', '))}`:''}</div>`;
      }
      else if(r&&r.ok) html+=`<div class="chat-msg tool">✓ Added "${esc(r.added)}" — ${r.cal} cal (${r.permanent?'saved to library':'temporary, today only'})</div>`;
      else if(r) html+=`<div class="chat-msg sys">⚠ ${esc(r.error||'tool failed')}</div>`;
    }
    else if(m.role==='_sys') html+=`<div class="chat-msg sys">${esc(m.content)}</div>`;
  }
  if(AI.busy) html+=`<div class="chat-msg ai" style="color:var(--muted)">…</div>`;
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
  const send=document.getElementById('chat-send');
  if(send) send.disabled=AI.busy;
}

function openAISettingsModal(){
  openModal(`<h2>✨ Assistant Setup</h2>
    <form autocomplete="off">
      <div class="fg"><label>OpenAI API key</label>
        <input type="password" name="key" value="${esc(aiKey())}" placeholder="sk-..." autocomplete="off"></div>
      <div class="fg"><label>Model</label>
        <input type="text" name="model" value="${esc(aiModel())}"></div>
      <div class="note">The key is stored only in this browser and sent directly from your device to api.openai.com. Get one at platform.openai.com → API keys. The assistant can search the web for nutrition facts; pick a model that supports the web_search tool (any gpt-5 model does).</div>
      <div class="mactions">
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn pri">Save</button>
      </div>
    </form>`,
    form=>{
      const d=new FormData(form);
      const oldModel=aiModel();
      LS.set(lk('ai_key'),String(d.get('key')||'').trim());
      LS.set(lk('ai_model'),String(d.get('model')||'').trim()||'gpt-5-mini');
      if(aiModel()!==oldModel){ AI.msgs=[]; AI.prevId=null; } // server thread can't hop models
      closeModal();
      if(aiKey()) openAIModal();
    });
}

function openAIModal(){
  if(!aiKey()){ openAISettingsModal(); return; }
  openModal(`<h2 style="display:flex;align-items:center;gap:8px;margin-bottom:12px">✨ Assistant
      <span style="margin-left:auto;display:flex;gap:6px">
        <button type="button" class="btn btn-sm" id="btn-ai-new">New Chat</button>
        <button type="button" class="btn btn-sm" id="btn-ai-cfg" title="API key & model">⚙</button>
      </span></h2>
    <div class="chat-log" id="chat-log"></div>
    <form class="chat-input-row" autocomplete="off">
      <input type="text" id="chat-inp" placeholder="e.g. add a bowl of chili as a temp food" autocomplete="off">
      <button type="submit" class="btn pri" id="chat-send">Send</button>
    </form>
    <div class="mactions"><button type="button" class="btn btn-cancel">Close</button></div>`,
    ()=>{
      const inp=document.getElementById('chat-inp');
      const text=inp.value.trim();
      if(!text||AI.busy) return;
      inp.value='';
      aiSend(text);
    });
  document.getElementById('btn-ai-new').addEventListener('click',()=>{if(!AI.busy){AI.msgs=[];AI.prevId=null;renderChatLog();}});
  document.getElementById('btn-ai-cfg').addEventListener('click',()=>{closeModal();openAISettingsModal();});
  renderChatLog();
  document.getElementById('chat-inp').focus();
}

document.getElementById('btn-tabs').addEventListener('click', openCategoriesModal);
document.getElementById('btn-compare').addEventListener('click', openCompare);
document.getElementById('btn-reset').addEventListener('click', resetDay);
document.getElementById('sort-sel').addEventListener('change', ev=>{
  S.sort = ev.target.value;
  saveState(); render();
});
document.getElementById('ex-input').addEventListener('input', ev=>{
  S.exCals=Math.max(0,parseInt(ev.target.value)||0);
  cancelPrecomp(); // old precomp used previous exCals
  startIncFeasCompute();
  saveState(); render();
});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadState();
document.getElementById('ex-input').value=S.exCals||'';
document.getElementById('sort-sel').value=S.sort||'name';
render();
if(!precompIsValid()&&!_computing) startPrecompute();
// If foods were already eaten in the restored state, kick off incremental feasibility
startIncFeasCompute();
// Ask the browser to keep our storage — localStorage is the source of truth
initPersistentStorage();
// Async: attempt to link library file (may reload library data from file)
initLibFile().then(()=>{
  render();
  if(!precompIsValid()&&!_computing) startPrecompute();
  startIncFeasCompute();
});
// PWA: register service worker (skipped on file:// so local dev keeps working)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
