<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3b82f6;--primary-lt:#1e3a5f;
  --ok:#22c55e;--ok-lt:#14532d;
  --warn:#f59e0b;--warn-lt:#451a03;
  --bad:#ef4444;--bad-lt:#450a0a;
  --bg:#0f172a;--surface:#1e293b;--border:#334155;
  --text:#f1f5f9;--muted:#94a3b8;
  --r:10px;--sh:0 1px 3px rgba(0,0,0,.4);--sh2:0 4px 12px rgba(0,0,0,.5)
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
#hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.hdr-top h1{font-size:1.1rem;font-weight:800;white-space:nowrap}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat-lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat-val{font-size:13px;font-weight:700}
.pbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;position:relative}
.pbar-fill{height:100%;border-radius:3px;transition:width .3s,background .3s;max-width:100%}
.g{background:var(--ok)}.w{background:var(--warn)}.b{background:var(--bad)}
.meals-badge{display:inline-flex;align-items:center;gap:4px;background:var(--ok-lt);color:var(--ok);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.meals-badge.unmet{background:var(--bad-lt);color:var(--bad)}
.ex-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap}
.ex-row label{font-size:12px;font-weight:700;white-space:nowrap}
.goals-badge{display:none;align-items:center;gap:4px;background:var(--ok-lt);color:var(--ok);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;margin-left:auto}
.preset-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:32px}
.preset-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--primary);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;transition:background .15s,color .15s;color:var(--text)}
.preset-chip:hover{background:var(--primary);color:#fff}
.preset-chip .pc-cal{font-size:11px;color:var(--primary)}
.preset-chip:hover .pc-cal{color:rgba(255,255,255,.8)}
.preset-edit-row{display:grid;grid-template-columns:1fr 80px 30px;gap:6px;align-items:center;margin-bottom:6px}
.goals-badge.show{display:inline-flex}
#recompute-banner{display:flex;align-items:center;gap:8px;padding:8px 20px;font-size:12px;font-weight:600;border-top:2px solid var(--warn);background:var(--warn-lt);color:var(--warn);position:fixed;bottom:0;left:0;right:0;z-index:200}
#recompute-banner.computing{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
#recompute-banner.hidden{display:none}
.btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.pri:hover{background:#1d4ed8}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.ok:hover{background:#15803d}
.btn.dng{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.dng:hover{background:#b91c1c}
.btn-sm{padding:3px 8px;font-size:11px}
input[type=number],input[type=text]{border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--text);background:var(--surface);width:80px}
input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.ex-row input[type=number]{width:90px}
select{border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--text);background:var(--surface);width:100%;cursor:pointer}
select:focus{outline:2px solid var(--primary);outline-offset:-1px}
select:disabled{opacity:.6;cursor:not-allowed}
#main{max-width:1400px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){#main{grid-template-columns:1fr}}
.sec-hdr{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);cursor:pointer;text-align:left;transition:transform .12s,border-color .12s,box-shadow .12s,opacity .2s,filter .2s;position:relative;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;min-height:120px;user-select:none}
.card:hover:not(.grey):not(.maxed){border-color:var(--primary);box-shadow:var(--sh2);transform:translateY(-2px)}
.card.grey{opacity:.32;filter:grayscale(.7);cursor:not-allowed}
.card.maxed{opacity:.55;cursor:not-allowed;border-style:dashed}
.card.eaten{border-color:var(--primary);background:var(--primary-lt)}
.card.eaten.maxed{border-color:var(--muted)}
.card.grey.eaten{opacity:.65;filter:grayscale(.35);border-color:var(--primary);background:var(--primary-lt)}
.card.xed{opacity:.35;filter:grayscale(.8);cursor:not-allowed;border-style:dashed;border-color:var(--bad)}
.card.xed.eaten{opacity:.55;filter:grayscale(.4);border-color:var(--bad);background:var(--bad-lt)}
.card.xed .cname{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.hbar{height:4px;width:100%;flex-shrink:0}
.cbody{padding:9px 9px 6px;flex:1;display:flex;flex-direction:column;gap:3px}
.cname{font-weight:700;font-size:12px;line-height:1.35}
.cstats{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.cstats b{color:var(--text)}
.cfoot{display:flex;align-items:center;justify-content:space-between;padding:0 8px 7px;min-height:26px;gap:4px}
.sbadge{background:var(--primary);color:#fff;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:800}
.sbadge.two{background:var(--muted)}
.plus-btn{background:var(--ok);color:#fff;border:none;border-radius:6px;padding:2px 8px;font-size:14px;font-weight:800;cursor:pointer;line-height:1.3;flex-shrink:0}
.plus-btn:hover{background:#15803d}
.minus-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:13px;font-weight:700;cursor:pointer;color:var(--bad);flex-shrink:0;line-height:1.2}
.minus-btn:hover{background:var(--bad-lt)}
.edit-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:2px 5px;font-size:10px;cursor:pointer;color:var(--muted);flex-shrink:0}
.edit-btn:hover{background:var(--bg);color:var(--text)}
.rbar{height:3px;width:100%;flex-shrink:0;background:var(--border)}
.rbar-fill{height:100%;transition:width .3s,background .3s}
#eaten-sec{max-width:1400px;margin:0 auto;padding:0 16px 28px}
#eaten-sec h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.eaten-list{display:flex;flex-wrap:wrap;gap:6px}
.eaten-chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:7px;font-size:12px;box-shadow:var(--sh)}
.eaten-chip strong{font-weight:700}
.eaten-chip span{color:var(--muted)}
.rm-btn{background:none;border:none;color:var(--bad);cursor:pointer;font-size:14px;padding:0 2px;border-radius:4px;line-height:1}
.rm-btn:hover{background:var(--bad-lt)}
.empty{color:var(--muted);font-style:italic;font-size:13px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
#overlay.h{display:none}
.mbox{background:var(--surface);border-radius:var(--r);padding:22px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h2{font-size:1rem;font-weight:800;margin-bottom:18px}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}
.fg input[type=number],.fg input[type=text],.fg select{width:100%}
.fg input[type=range]{width:100%;cursor:pointer}
.rv{font-weight:800;color:var(--primary)}
.tog-row{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;font-weight:600}
.tog{width:34px;height:18px;background:var(--border);border-radius:9px;position:relative;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--primary)}
.tog::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.tog.on::after{left:18px}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.sep{height:1px;background:var(--border);margin:14px 0}
.note{font-size:11px;color:var(--muted);margin-top:4px}
.sec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.goal-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:8px}
.goal-row:last-child{border-bottom:none}
.goal-info{display:flex;align-items:center;gap:7px;flex:1;min-width:0;flex-wrap:wrap}
.goal-name{font-weight:700;font-size:13px}
.goal-badge{font-size:10px;color:var(--muted);background:var(--bg);border-radius:4px;padding:1px 5px;white-space:nowrap}
.goal-params{font-size:11px;color:var(--muted)}
.goal-actions{display:flex;gap:4px;flex-shrink:0}
.lib-banner{display:flex;align-items:center;gap:8px;padding:8px 20px;font-size:12px;font-weight:600;border-bottom:2px solid var(--primary);background:var(--primary-lt);color:var(--primary);flex-wrap:wrap}
.lib-banner.warn{border-color:var(--warn);background:var(--warn-lt);color:var(--warn)}
</style>
</head>
<body>

<div id="hdr">
  <div class="hdr-top">
    <h1>🍽 Meal Planner</h1>
    <div class="hdr-actions">
      <button class="btn" id="btn-add">＋ Add Food</button>
      <button class="btn" id="btn-library">📚 Library</button>
      <button class="btn" id="btn-settings">⚙ Goals</button>
      <button class="btn" id="btn-reset">↺ Reset Day</button>
    </div>
  </div>
  <div class="stats-row" id="stats-row"></div>
  <div class="ex-row">
    <label>⚡ Exercise burned:</label>
    <input type="number" id="ex-input" min="0" max="5000" step="10" placeholder="0">
    <span style="font-size:11px;color:var(--muted)">cal</span>
    <button class="btn btn-sm" id="btn-ex-presets">Presets ▾</button>
    <div class="goals-badge" id="goals-badge">✓ All Goals Met!</div>
  </div>
</div>

<div id="lib-banner" class="hidden"></div>
<div id="recompute-banner" class="hidden"></div>

<div id="main">
  <div><div class="sec-hdr">Meals</div><div class="food-grid" id="meals-grid"></div></div>
  <div><div class="sec-hdr">Snacks &amp; Other</div><div class="food-grid" id="snacks-grid"></div></div>
</div>

<div id="eaten-sec">
  <h2>Eaten Today</h2>
  <div class="eaten-list" id="eaten-list"></div>
</div>

<div id="overlay" class="h">
  <div class="mbox" id="mbox"></div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════
//  BASE FOODS  (extras: all non-cal goal metrics)
// ═══════════════════════════════════════════════
const BASE_FOODS = [
  {id:'bagel',         name:'Bagel',                            cal:330,  meal:true,  extras:{pro:10, health:.35}},
  {id:'burger',        name:'Burger',                           cal:325,  meal:true,  extras:{pro:22, health:.45}},
  {id:'chipotle',      name:'Chipotle Chicken Burrito',         cal:1050, meal:true,  extras:{pro:61, health:.55}},
  {id:'huel',          name:'Huel',                             cal:505,  meal:true,  extras:{pro:42, health:.85}},
  {id:'mac-cheese',    name:'Mac and Cheese',                   cal:669,  meal:true,  extras:{pro:33, health:.55}},
  {id:'noodles',       name:'Noodles with Sunflower Seed Sauce',cal:352,  meal:true,  extras:{pro:14, health:.55}},
  {id:'oatmeal',       name:'Oatmeal',                          cal:159,  meal:true,  extras:{pro:6,  health:.75}},
  {id:'pancakes',      name:'Pancakes and Sausage',             cal:360,  meal:true,  extras:{pro:31, health:.55}},
  {id:'ramen',         name:'Ramen',                            cal:451,  meal:true,  extras:{pro:14, health:.30}},
  {id:'spaghetti',     name:'Spaghetti',                        cal:460,  meal:true,  extras:{pro:24, health:.55}},
  {id:'turkey-bec',    name:'Turkey Bacon Egg and Cheese',      cal:690,  meal:true,  extras:{pro:30, health:.65}},
  {id:'taco-bell',     name:'Taco Bell Bean Burrito',           cal:360,  meal:true,  extras:{pro:13, health:.40}},
  {id:'twice-potato',  name:'Twice Baked Potato',               cal:283,  meal:true,  extras:{pro:8,  health:.45}},
  {id:'cereal',        name:'Cereal',                           cal:150,  meal:false, extras:{pro:8,  health:.45}},
  {id:'chips',         name:'Chips',                            cal:150,  meal:false, extras:{pro:2,  health:.15}},
  {id:'granola',       name:'Honey and Oat Granola',            cal:232,  meal:false, extras:{pro:2,  health:.65}},
  {id:'egg',           name:'Hard Boiled Egg',                  cal:78,   meal:false, extras:{pro:6,  health:.85}},
  {id:'bread',         name:'Homemade Bread',                   cal:223,  meal:false, extras:{pro:4,  health:.55}},
  {id:'popcorn',       name:'Popcorn',                          cal:230,  meal:false, extras:{pro:5,  health:.55}},
  {id:'protein-bar',   name:'Protein Bar',                      cal:190,  meal:false, extras:{pro:21, health:.40}},
  {id:'protein-fluff', name:'Protein Fluff',                    cal:395,  meal:false, extras:{pro:41, health:.70}},
  {id:'chickpeas',     name:'Roasted Chickpeas',                cal:244,  meal:false, extras:{pro:10, health:.85}},
  {id:'cheese-salami', name:'Snack Cheese and Salami',          cal:230,  meal:false, extras:{pro:13, health:.35}},
  {id:'apple',         name:'Apple',                            cal:95,   meal:false, extras:{pro:0,  health:.95}},
  {id:'feastable',     name:'Feastable',                        cal:180,  meal:false, extras:{pro:3,  health:.15}},
  {id:'ice-cream',     name:'Ice Cream Sandwich',               cal:175,  meal:false, extras:{pro:3,  health:.10}},
  {id:'fronen',        name:'Fronen',                           cal:350,  meal:false, extras:{pro:3,  health:.15}},
];

// ═══════════════════════════════════════════════
//  DEFAULT GOALS
// ═══════════════════════════════════════════════
const DEF_GOALS = [
  {id:'cal',    name:'Calories',     unit:'cal', type:'range',     goal:1900, range:50,    default:0,   builtin:true},
  {id:'pro',    name:'Protein',      unit:'g',   type:'min',       threshold:80,            default:0,   builtin:true},
  {id:'health', name:'Health Score', unit:'',    type:'avg_min',   threshold:0.6,           default:0.5, builtin:true},
  {id:'meals',  name:'Meals',        unit:'',    type:'count_min', threshold:2,             default:0,   builtin:true},
];
const DEF_EXERCISE_PRESETS = [
  {id:'ep-walk30',     name:'Walk (30 min)',     cal:150},
  {id:'ep-walk60',     name:'Walk (1 hr)',        cal:300},
  {id:'ep-run30',      name:'Run (30 min)',       cal:350},
  {id:'ep-tennis',     name:'Tennis',             cal:400},
  {id:'ep-gymnastics', name:'Gymnastics',         cal:500},
  {id:'ep-biking60',   name:'Biking (1 hr)',      cal:450},
  {id:'ep-swimming30', name:'Swimming (30 min)',  cal:300},
];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let S = {
  goals:            [],  // goal definitions array (replaces v1 settings)
  exercisePresets:  [],  // [{id,name,cal}] — editable activity presets
  servings: {},          // id→count (1|2)
  exCals:   0,
  overrides:{},          // id→{name?,cal?,meal?,extras?}  (base food edits)
  custom:   [],          // permanent custom foods [{id,name,cal,meal,extras}]
  temp:     [],          // session-only custom foods
  precomp:  null,
  incFeas:  null,
  compatPlans:[],
  excluded: {},
};

let _computing    = false;
let _worker       = null;
let _incComputing = false;
let _incWorker    = null;

// ═══════════════════════════════════════════════
//  WEB WORKER  (generalized branch-and-bound)
// ═══════════════════════════════════════════════
const WORKER_CODE = `
'use strict';
self.onmessage = function(e) {
  const {foods, goals, exCals = 0, currentServings = {}, excludedIds = []} = e.data;

  // Locate goals by type
  const calGoal     = goals.find(g => g.id === 'cal');
  const calMin      = calGoal.goal - calGoal.range + exCals;
  const calMax      = calGoal.goal + calGoal.range + exCals;
  const calGoalIdx  = goals.indexOf(calGoal);

  const minGoals    = goals.filter(g => g.type === 'min');
  const maxGoals    = goals.filter(g => g.type === 'max');
  const avgMinGoals = goals.filter(g => g.type === 'avg_min');
  const avgMaxGoals = goals.filter(g => g.type === 'avg_max');
  const cntGoal     = goals.find(g => g.type === 'count_min');
  const numGoals    = goals.length;

  // Pre-compute goal indices (avoid indexOf in hot loop)
  const minIdx    = minGoals.map(g => goals.indexOf(g));
  const maxIdx    = maxGoals.map(g => goals.indexOf(g));
  const avgMinIdx = avgMinGoals.map(g => goals.indexOf(g));
  const avgMaxIdx = avgMaxGoals.map(g => goals.indexOf(g));
  const cntIdx    = cntGoal ? goals.indexOf(cntGoal) : -1;

  // Sort by cal desc: ceiling prune fires earlier
  foods.sort((a, b) => b.cal - a.cal);
  const n = foods.length;

  // Map food ID → sorted index (needed to look up currentServings by ID)
  const foodIdxMap = {};
  for (let i = 0; i < n; i++) foodIdxMap[foods[i].id] = i;

  // Per-food remaining capacity: 2 minus already eaten, 0 for excluded
  const excludedSet = new Set(excludedIds);
  const maxAdd = new Uint8Array(n);
  let numAddable = 0;
  for (let i = 0; i < n; i++) {
    if (excludedSet.has(foods[i].id)) { maxAdd[i] = 0; continue; }
    const eaten = currentServings[foods[i].id] || 0;
    maxAdd[i] = Math.max(0, 2 - eaten);
    if (maxAdd[i] > 0) numAddable++;
  }

  // Extract metrics[goalIdx][foodIdx] as typed arrays
  function getM(f, g) {
    if (g.type === 'count_min') return f.meal ? 1 : 0;
    const v = f.extras && f.extras[g.id] !== undefined ? f.extras[g.id] : (g.default || 0);
    return +v;
  }
  const metrics = goals.map(g => {
    const a = new Float64Array(n);
    for (let i = 0; i < n; i++) a[i] = g.id === 'cal' ? foods[i].cal : getM(foods[i], g);
    return a;
  });

  // Suffix bounds — use maxAdd so pruning reflects actual remaining capacity
  const sufCal = new Float64Array(n + 1);
  for (let i = n-1; i >= 0; i--) sufCal[i] = sufCal[i+1] + foods[i].cal * maxAdd[i];

  // sufMax[gi][i] = max additional sum of metric gi from foods[i..n-1]
  const sufMax = goals.map((g, gi) => {
    if (g.type !== 'min' && g.type !== 'count_min') return null;
    const a = new Float64Array(n + 1);
    for (let i = n-1; i >= 0; i--) a[i] = a[i+1] + metrics[gi][i] * maxAdd[i];
    return a;
  });

  // sufMaxHS[k][i] for avg_min goals: max health surplus from remaining
  const sufMaxHS = avgMinGoals.map((g, k) => {
    const gi = avgMinIdx[k];
    const a = new Float64Array(n + 1);
    for (let i = n-1; i >= 0; i--) {
      const best = (metrics[gi][i] - g.threshold) * foods[i].cal * maxAdd[i];
      a[i] = a[i+1] + (best > 0 ? best : 0);
    }
    return a;
  });

  // sufMaxHD[k][i] for avg_max goals: max budget recovery from remaining
  const sufMaxHD = avgMaxGoals.map((g, k) => {
    const gi = avgMaxIdx[k];
    const a = new Float64Array(n + 1);
    for (let i = n-1; i >= 0; i--) {
      const best = (g.threshold - metrics[gi][i]) * foods[i].cal * maxAdd[i];
      a[i] = a[i+1] + (best > 0 ? best : 0);
    }
    return a;
  });

  const sufMeals = new Float64Array(n + 1);
  if (cntGoal) {
    for (let i = n-1; i >= 0; i--) sufMeals[i] = sufMeals[i+1] + (foods[i].meal ? maxAdd[i] : 0);
  }

  // Initialize running state from already-eaten foods (the fixed part of the plan)
  let calNow = 0;
  const gSums = new Float64Array(numGoals);
  const avgHW = new Float64Array(numGoals);
  for (const [foodId, servings] of Object.entries(currentServings)) {
    if (!servings) continue;
    const fi = foodIdxMap[foodId];
    if (fi === undefined) continue;
    const f = foods[fi];
    calNow += f.cal * servings;
    for (let gi = 0; gi < numGoals; gi++) {
      if (goals[gi].id === 'cal') continue;
      gSums[gi] += metrics[gi][fi] * servings;
    }
    for (let k = 0; k < avgMinGoals.length; k++) {
      const gi = avgMinIdx[k];
      avgHW[gi] += metrics[gi][fi] * f.cal * servings;
    }
    for (let k = 0; k < avgMaxGoals.length; k++) {
      const gi = avgMaxIdx[k];
      avgHW[gi] += metrics[gi][fi] * f.cal * servings;
    }
  }

  // Mutable search state — saved/restored via pre-allocated stack
  const srv      = new Uint8Array(n);
  const stSums   = new Float64Array(n * numGoals);
  const stAvgHW  = new Float64Array(n * numGoals);

  // feasBits[i] = 1 once food i appears in any valid completion with >0 additional servings
  const feasBits = new Uint8Array(n);
  let feasCount  = 0;
  let planCount  = 0;
  let done       = false;
  const COUNT_CAP = 1_000_000;

  function search(i) {
    if (done) return;
    if (i === n) {
      if (calNow < calMin || calNow > calMax) return;
      for (let k = 0; k < minGoals.length; k++)
        if (gSums[minIdx[k]] < minGoals[k].threshold) return;
      for (let k = 0; k < maxGoals.length; k++)
        if (gSums[maxIdx[k]] > maxGoals[k].threshold) return;
      for (let k = 0; k < avgMinGoals.length; k++) {
        const gi = avgMinIdx[k];
        if (calNow > 0 && avgHW[gi] / calNow < avgMinGoals[k].threshold) return;
      }
      for (let k = 0; k < avgMaxGoals.length; k++) {
        const gi = avgMaxIdx[k];
        if (calNow > 0 && avgHW[gi] / calNow > avgMaxGoals[k].threshold) return;
      }
      if (cntGoal && gSums[cntIdx] < cntGoal.threshold) return;
      for (let j = 0; j < n; j++) {
        if (srv[j] > 0 && !feasBits[j]) { feasBits[j] = 1; feasCount++; }
      }
      planCount++;
      if (feasCount >= numAddable || planCount >= COUNT_CAP) done = true;
      return;
    }

    const fCal    = foods[i].cal;
    const remCal  = sufCal[i + 1];
    const base    = i * numGoals;
    const prevCal = calNow;

    stSums.set(gSums, base);
    stAvgHW.set(avgHW, base);

    for (let s = 0; s <= maxAdd[i]; s++) {
      const newCal = prevCal + fCal * s;
      if (newCal > calMax) break;
      if (newCal + remCal < calMin) continue;

      let prune = false;

      // min goals: floor prune
      for (let k = 0; k < minGoals.length && !prune; k++) {
        const gi = minIdx[k];
        if (stSums[base+gi] + metrics[gi][i]*s + sufMax[gi][i+1] < minGoals[k].threshold) prune = true;
      }
      if (prune) continue;

      // max goals: ceiling prune (monotone — break if violated)
      if (s > 0) {
        for (let k = 0; k < maxGoals.length && !prune; k++) {
          const gi = maxIdx[k];
          if (stSums[base+gi] + metrics[gi][i]*s > maxGoals[k].threshold) prune = true;
        }
        if (prune) break;
      }

      // avg_min: health-surplus prune
      for (let k = 0; k < avgMinGoals.length && !prune; k++) {
        const gi = avgMinIdx[k];
        const newHW = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
        if (newHW - avgMinGoals[k].threshold*newCal + sufMaxHS[k][i+1] < -1e-6) prune = true;
      }
      if (prune) continue;

      // avg_max: budget-surplus prune
      for (let k = 0; k < avgMaxGoals.length && !prune; k++) {
        const gi = avgMaxIdx[k];
        const newHW = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
        if (avgMaxGoals[k].threshold*newCal - newHW + sufMaxHD[k][i+1] < -1e-6) prune = true;
      }
      if (prune) continue;

      // count_min: floor prune
      if (cntGoal) {
        const newM = stSums[base+cntIdx] + metrics[cntIdx][i]*s;
        if (newM + sufMeals[i+1] < cntGoal.threshold) continue;
      }

      for (let gi = 0; gi < numGoals; gi++) {
        if (gi === calGoalIdx) continue;
        gSums[gi] = stSums[base+gi] + metrics[gi][i]*s;
      }
      for (let k = 0; k < avgMinGoals.length; k++) {
        const gi = avgMinIdx[k];
        avgHW[gi] = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
      }
      for (let k = 0; k < avgMaxGoals.length; k++) {
        const gi = avgMaxIdx[k];
        avgHW[gi] = stAvgHW[base+gi] + metrics[gi][i]*fCal*s;
      }
      calNow = newCal;
      srv[i] = s;

      search(i + 1);
    }

    calNow = prevCal;
    gSums.set(stSums.subarray(base, base+numGoals));
    avgHW.set(stAvgHW.subarray(base, base+numGoals));
    srv[i] = 0;
  }

  search(0);

  const feasMap = {};
  for (let i = 0; i < n; i++) feasMap[foods[i].id] = maxAdd[i] > 0 && feasBits[i] > 0;

  self.postMessage({feasMap, count: planCount, truncated: done, foodIds: foods.map(f => f.id), n});
};
`;

const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
};
const PFX = 'mpv2_';
function lk(k){return PFX+k;}
function todayKey(){return lk('day_'+new Date().toISOString().slice(0,10));}

// ═══════════════════════════════════════════════
//  INDEXEDDB  (stores file handle across sessions)
// ═══════════════════════════════════════════════
const IDB = {
  _db:null,
  async open(){
    if(this._db) return this._db;
    return new Promise((res,rej)=>{
      const r=indexedDB.open('mpv2-lib',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
      r.onsuccess=e=>{this._db=e.target.result;res(this._db);};
      r.onerror=rej;
    });
  },
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const r=tx.objectStore('kv').get(k);r.onsuccess=e=>res(e.target.result);r.onerror=rej;});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=rej;});},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=rej;});}
};

// ═══════════════════════════════════════════════
//  FILE SYSTEM  (food-library.json persistence)
// ═══════════════════════════════════════════════
let _libFileHandle = null;
const HAS_FSA = typeof window !== 'undefined' && !!window.showOpenFilePicker;

function showLibBanner(mode, handle){
  const el=document.getElementById('lib-banner');
  if(mode==='unlinked'){
    el.className='lib-banner';
    el.innerHTML='📂 Link a library file to persist your food data across browser clears. &nbsp;'+
      '<button class="btn btn-sm pri" id="lbtn-open">Open Existing</button> '+
      '<button class="btn btn-sm" id="lbtn-new">Create New</button> '+
      '<button class="btn btn-sm" style="margin-left:auto" id="lbtn-dismiss">Dismiss</button>';
    document.getElementById('lbtn-open').onclick=()=>pickLibFile();
    document.getElementById('lbtn-new').onclick=()=>newLibFile();
    document.getElementById('lbtn-dismiss').onclick=()=>{LS.set(lk('lib_dismissed'),true);el.className='hidden';};
  } else if(mode==='reauth'){
    el.className='lib-banner warn';
    el.innerHTML='🔒 Re-authorize library file to load your saved food data. &nbsp;'+
      '<button class="btn btn-sm pri" id="lbtn-reauth">Re-authorize</button> '+
      '<button class="btn btn-sm" id="lbtn-unlink-b">Unlink File</button>';
    document.getElementById('lbtn-reauth').onclick=async()=>{
      try{
        const perm=await handle.requestPermission({mode:'readwrite'});
        if(perm==='granted'){_libFileHandle=handle;el.className='hidden';await loadLibraryFromFile();render();if(!precompIsValid()&&!_computing)startPrecompute();}
      }catch(e){}
    };
    document.getElementById('lbtn-unlink-b').onclick=()=>unlinkLibFile();
  } else {
    el.className='hidden';
  }
}

async function initLibFile(){
  if(!HAS_FSA) return;
  try{
    const handle=await IDB.get('libFileHandle');
    if(handle){
      const perm=await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted'){_libFileHandle=handle;await loadLibraryFromFile();return;}
      // Auto-reauth on first user interaction (browser requires a gesture for requestPermission)
      let _reauthDone=false;
      const doReauth=async()=>{
        if(_reauthDone) return; _reauthDone=true;
        document.removeEventListener('click',doReauth);
        document.removeEventListener('keydown',doReauth);
        try{
          const p=await handle.requestPermission({mode:'readwrite'});
          if(p==='granted'){
            _libFileHandle=handle;
            document.getElementById('lib-banner').className='hidden';
            await loadLibraryFromFile();
            render();
            if(!precompIsValid()&&!_computing) startPrecompute();
          } else {
            showLibBanner('reauth',handle);
          }
        }catch(e){ showLibBanner('reauth',handle); }
      };
      document.addEventListener('click',doReauth);
      document.addEventListener('keydown',doReauth);
      return;
    }
  }catch(e){}
  if(!LS.get(lk('lib_dismissed'),false)) showLibBanner('unlinked');
}

async function pickLibFile(){
  if(!HAS_FSA) return;
  try{
    const [handle]=await window.showOpenFilePicker({types:[{description:'Food Library',accept:{'application/json':['.json']}}]});
    _libFileHandle=handle;
    await IDB.set('libFileHandle',handle);
    const data=await readLibFile(handle);
    if(data) applyLibrary(data);
    await saveLibraryToFile();
    document.getElementById('lib-banner').className='hidden';
    LS.set(lk('lib_dismissed'),false);
    saveState(); render();
  }catch(e){if(e.name!=='AbortError')console.error(e);}
}

async function newLibFile(){
  if(!window.showSaveFilePicker) return;
  try{
    const handle=await window.showSaveFilePicker({types:[{description:'Food Library',accept:{'application/json':['.json']}}],suggestedName:'food-library.json'});
    _libFileHandle=handle;
    await IDB.set('libFileHandle',handle);
    await saveLibraryToFile();
    document.getElementById('lib-banner').className='hidden';
    LS.set(lk('lib_dismissed'),false);
  }catch(e){if(e.name!=='AbortError')console.error(e);}
}

async function unlinkLibFile(){
  _libFileHandle=null;
  try{await IDB.del('libFileHandle');}catch(e){}
  LS.set(lk('lib_dismissed'),false);
  showLibBanner('unlinked');
}

async function readLibFile(handle){
  try{const file=await handle.getFile();return JSON.parse(await file.text());}catch{return null;}
}

async function loadLibraryFromFile(){
  if(!_libFileHandle) return;
  const data=await readLibFile(_libFileHandle);
  if(data) applyLibrary(data);
}

function applyLibrary(data){
  if(!data||typeof data!=='object') return;
  if(Array.isArray(data.goals)){
    const saved=data.goals;
    const merged=DEF_GOALS.map(def=>{const sv=saved.find(g=>g.id===def.id);return sv?{...def,...sv,id:def.id,builtin:true}:{...def};});
    S.goals=[...merged,...saved.filter(g=>!g.builtin)];
  }
  if(data.overrides&&typeof data.overrides==='object') S.overrides=data.overrides;
  if(Array.isArray(data.custom)) S.custom=data.custom;
  if(Array.isArray(data.exercisePresets)) S.exercisePresets=data.exercisePresets;
}

async function saveLibraryToFile(){
  if(!_libFileHandle) return;
  try{
    const lib={version:1,goals:S.goals,overrides:S.overrides,custom:S.custom,exercisePresets:S.exercisePresets};
    const w=await _libFileHandle.createWritable();
    await w.write(JSON.stringify(lib,null,2));
    await w.close();
  }catch(e){console.error('Library save failed:',e);}
}

function loadState(){
  // Library: goals + overrides + custom from localStorage (fast sync load; may be overridden by file)
  const saved = LS.get(lk('goals'), null);
  if(saved && Array.isArray(saved)){
    const merged = DEF_GOALS.map(def => {
      const sv = saved.find(g => g.id === def.id);
      return sv ? {...def, ...sv, id:def.id, builtin:true} : {...def};
    });
    const custom = saved.filter(g => !g.builtin);
    S.goals = [...merged, ...custom];
  } else {
    S.goals = DEF_GOALS.map(g=>({...g}));
  }
  S.overrides        = LS.get(lk('overrides'), {});
  S.custom           = LS.get(lk('custom'), []);
  S.exercisePresets  = LS.get(lk('exPresets'), null) || DEF_EXERCISE_PRESETS.map(p=>({...p}));
  // Daily state stays in localStorage (ephemeral)
  const day   = LS.get(todayKey(), {servings:{}, exCals:0, excluded:{}});
  S.servings  = day.servings || {};
  S.exCals    = day.exCals   || 0;
  S.excluded  = day.excluded || {};
  loadPrecomp();
}

function saveState(){
  // Always keep localStorage in sync as a fast backup
  LS.set(lk('goals'),     S.goals);
  LS.set(lk('overrides'), S.overrides);
  LS.set(lk('custom'),    S.custom);
  LS.set(lk('exPresets'), S.exercisePresets);
  LS.set(todayKey(), {servings:S.servings, exCals:S.exCals, excluded:S.excluded});
  // Also persist library to file (async, fire-and-forget)
  saveLibraryToFile();
}

// ═══════════════════════════════════════════════
//  FOOD UTILITIES
// ═══════════════════════════════════════════════
function allFoods({includeArchived=false}={}){
  const base = BASE_FOODS.map(f => {
    const ov = S.overrides[f.id];
    if(!ov) return {...f, isBase:true};
    return {...f, ...ov, id:f.id, isBase:true, extras:{...f.extras, ...(ov.extras||{})}};
  }).filter(f => includeArchived || !f.archived);
  const cust = S.custom
    .filter(f => includeArchived || !f.archived)
    .map(f=>({...f, isBase:false, isPerm:true}));
  const tmp  = S.temp.map(f=>({...f, isBase:false, isPerm:false}));
  return [...base, ...cust, ...tmp];
}

function isArchived(id){
  if(S.overrides[id]?.archived) return true;
  return !!(S.custom.find(f=>f.id===id)?.archived);
}

function getMetric(f, g){
  if(g.id === 'cal') return f.cal;
  if(g.type === 'count_min') return f.meal ? 1 : 0;
  const v = f.extras && f.extras[g.id] !== undefined ? f.extras[g.id] : (g.default ?? 0);
  return +v;
}

function isExcluded(id){return !!S.excluded[id];}
function getFoodById(id){return allFoods({includeArchived:true}).find(f=>f.id===id);}
function servingsOf(id){return S.servings[id]||0;}
function healthColor(h){
  if(h>=.85)return'#16a34a';
  if(h>=.65)return'#84cc16';
  if(h>=.50)return'#eab308';
  if(h>=.35)return'#f97316';
  return'#dc2626';
}
function getHealthMetric(f){
  const hg = S.goals.find(g=>(g.type==='avg_min'||g.type==='avg_max')&&g.id==='health');
  if(hg) return Math.max(0, Math.min(1, getMetric(f, hg)));
  const ag = S.goals.find(g=>g.type==='avg_min'||g.type==='avg_max');
  if(ag) return Math.max(0, Math.min(1, getMetric(f, ag)));
  return 0.5;
}

// ═══════════════════════════════════════════════
//  STATS COMPUTATION
// ═══════════════════════════════════════════════
function computeStats(){
  // sums['cal'] = eaten_cal - exCals (net toward goal)
  // sums[g.id]  = running sum of metric*s for min/max/count_min goals
  // avgs[g.id]  = calorie-weighted average for avg_min/avg_max goals
  let rawCal = 0;
  const sums = {}, hw = {};
  for(const g of S.goals){ sums[g.id]=0; hw[g.id]=0; }

  for(const f of allFoods()){
    const s = servingsOf(f.id);
    if(!s) continue;
    rawCal += f.cal * s;
    for(const g of S.goals){
      if(g.id==='cal') continue;
      if(g.type==='count_min'){ sums[g.id]+= f.meal?s:0; continue; }
      const m = getMetric(f, g);
      sums[g.id] += m * s;
      if(g.type==='avg_min'||g.type==='avg_max') hw[g.id] += m * f.cal * s;
    }
  }
  sums['cal'] = rawCal - S.exCals;

  const avgs = {};
  for(const g of S.goals){
    if(g.type==='avg_min'||g.type==='avg_max')
      avgs[g.id] = rawCal>0 ? hw[g.id]/rawCal : 0;
  }
  return {sums, avgs, rawCal};
}

function allGoalsMet(sums, avgs){
  for(const g of S.goals){
    if(g.type==='range'){
      const netCal = sums['cal'];
      if(netCal < g.goal-g.range || netCal > g.goal+g.range) return false;
    } else if(g.type==='min'||g.type==='avg_min'||g.type==='count_min'){
      const v = (g.type==='avg_min') ? (avgs[g.id]||0) : (sums[g.id]||0);
      if(v < g.threshold) return false;
    } else if(g.type==='max'||g.type==='avg_max'){
      const v = (g.type==='avg_max') ? (avgs[g.id]||0) : (sums[g.id]||0);
      if(v > g.threshold) return false;
    }
  }
  return true;
}

// ═══════════════════════════════════════════════
//  PRECOMPUTATION
// ═══════════════════════════════════════════════
function precompHash(){
  const goalSig = S.goals.map(g=>
    `${g.id}:${g.type}:${g.threshold??g.goal}:${g.range??''}:${g.default??0}`
  ).join('|');
  const nonCalGoals = S.goals.filter(g=>g.type!=='count_min'&&g.id!=='cal');
  const foodSig = allFoods().map(f=>{
    const extras = nonCalGoals.map(g=>getMetric(f,g)).join(':');
    return `${f.id}:${f.cal}:${f.meal?1:0}:${extras}`;
  }).join('|');
  return goalSig+'|'+S.exCals+'|'+foodSig;
}

function precompIsValid(){
  return S.precomp && S.precomp.hash === precompHash();
}

function savePrecomp(){
  if(!S.precomp) return;
  const {feasMap,foodIds,n,hash,count,truncated} = S.precomp;
  const toStore = {v:2,hash,n,count,truncated,ids:foodIds.join(','),fm:feasMap};
  try{ LS.set(lk('precomp'), toStore); }catch{}
}

function loadPrecomp(){
  const raw = LS.get(lk('precomp'), null);
  if(!raw||typeof raw!=='object') return;
  if(raw.v !== 2) return; // discard old format; triggers clean recompute
  try{
    const {hash,n,count,truncated,ids,fm} = raw;
    if(!hash||!n||count===undefined||!ids) return;
    S.precomp = {feasMap:fm||{},count,truncated:!!truncated,foodIds:ids.split(','),n,hash};
  }catch{ S.precomp=null; }
}

function startPrecompute(){
  if(_computing) return;
  _computing = true;
  render();
  const blob = new Blob([WORKER_CODE],{type:'application/javascript'});
  const url  = URL.createObjectURL(blob);
  _worker = new Worker(url);
  _worker.onmessage = ev => {
    URL.revokeObjectURL(url);
    _worker = null; _computing = false;
    storePrecomp(ev.data);
  };
  _worker.onerror = err => {
    console.error('Worker error:',err);
    URL.revokeObjectURL(url);
    _worker = null; _computing = false;
    render();
  };
  _worker.postMessage({foods:allFoods(), goals:S.goals, exCals:S.exCals});
}

function storePrecomp(data){
  const {feasMap,count,truncated,foodIds,n} = data;
  S.precomp = {feasMap,count,truncated,foodIds,n,hash:precompHash()};
  buildCompatPlans();
  savePrecomp(); saveState(); render();
}

// ═══════════════════════════════════════════════
//  INCREMENTAL FEASIBILITY (exact B&B from current state)
// ═══════════════════════════════════════════════
function incFeasHash(){
  const srvSig = Object.entries(S.servings).filter(([,v])=>v>0).sort().map(([k,v])=>`${k}:${v}`).join(',');
  const exclSig = Object.keys(S.excluded).sort().join(',');
  return precompHash() + '|' + srvSig + '|' + exclSig;
}

function startIncFeasCompute(){
  // Cancel any in-flight incremental worker
  if(_incComputing && _incWorker){ _incWorker.terminate(); _incWorker=null; _incComputing=false; }
  S.incFeas = null;

  const anyEaten = Object.values(S.servings).some(s=>s>0);
  if(!anyEaten) return; // empty state: precomp (or DP) handles it

  _incComputing = true;
  const hash = incFeasHash();
  const blob = new Blob([WORKER_CODE],{type:'application/javascript'});
  const url  = URL.createObjectURL(blob);
  _incWorker = new Worker(url);
  _incWorker.onmessage = ev => {
    URL.revokeObjectURL(url);
    _incWorker = null; _incComputing = false;
    if(incFeasHash() !== hash){
      // State changed while we were computing — restart for the new state
      startIncFeasCompute(); return;
    }
    S.incFeas = {feasMap:ev.data.feasMap, count:ev.data.count, truncated:ev.data.truncated, hash};
    render();
  };
  _incWorker.onerror = err => {
    console.error('IncFeas worker error:',err);
    URL.revokeObjectURL(url);
    _incWorker = null; _incComputing = false;
    render();
  };
  _incWorker.postMessage({
    foods: allFoods(),
    goals: S.goals,
    exCals: S.exCals,
    currentServings: S.servings,
    excludedIds: Object.keys(S.excluded)
  });
}

// ═══════════════════════════════════════════════
//  COMPATIBLE PLANS
// ═══════════════════════════════════════════════
function buildCompatPlans(){
  // Plans are no longer enumerated; feasibility comes from precomp.feasMap + DP.
  S.compatPlans = [];
}

function updateCompatPlans(id, newCount, added){
  buildCompatPlans();
}

// ═══════════════════════════════════════════════
//  FEASIBILITY
// ═══════════════════════════════════════════════
function computeFeasibility(){
  const foods = allFoods();
  const feasMap = {};

  const anyEaten = Object.values(S.servings).some(s=>s>0);

  // Empty state: use precomp exact result when available and complete
  if(!anyEaten && precompIsValid() && S.precomp.feasMap && !S.precomp.truncated){
    for(const f of foods){
      if(isExcluded(f.id)||servingsOf(f.id)>=2){ feasMap[f.id]=false; continue; }
      feasMap[f.id] = S.precomp.feasMap[f.id] !== false;
    }
    return feasMap;
  }

  // Non-empty state: use incremental exact result when it matches current state
  if(anyEaten && S.incFeas && S.incFeas.hash === incFeasHash()){
    for(const f of foods){
      if(isExcluded(f.id)||servingsOf(f.id)>=2){ feasMap[f.id]=false; continue; }
      feasMap[f.id] = S.incFeas.feasMap[f.id] !== false;
    }
    return feasMap;
  }

  // Fall back to approximate DP while exact result is computing
  return computeFeasibilityDP(foods.filter(f=>!isExcluded(f.id)), feasMap);
}

function computeFeasibilityDP(foods, feasMap){
  feasMap = feasMap||{};
  const calGoal_ = S.goals.find(g=>g.id==='cal');
  if(!calGoal_) return feasMap;
  const calMinRaw = calGoal_.goal - calGoal_.range + S.exCals;
  const calMaxRaw = calGoal_.goal + calGoal_.range + S.exCals;

  // Accumulate current state from eaten foods
  let rawCalNow=0;
  const sumsNow={}, hwNow={};
  for(const g of S.goals){ sumsNow[g.id]=0; hwNow[g.id]=0; }
  for(const f of foods){
    const s=servingsOf(f.id); if(!s) continue;
    rawCalNow+=f.cal*s;
    for(const g of S.goals){
      if(g.id==='cal') continue;
      if(g.type==='count_min'){ sumsNow[g.id]+=f.meal?s:0; continue; }
      const m=getMetric(f,g);
      sumsNow[g.id]+=m*s;
      if(g.type==='avg_min'||g.type==='avg_max') hwNow[g.id]+=m*f.cal*s;
    }
  }

  // Max possible remaining (all available servings) — used for calorie and count_min checks only.
  // min/avg goals use calorie-aware inline computation to avoid false positives near the calorie ceiling.
  let totRemCal=0;
  const totRemCount={};
  for(const g of S.goals) if(g.type==='count_min') totRemCount[g.id]=0;
  for(const f of foods){
    if(isExcluded(f.id)) continue;
    const avail=2-servingsOf(f.id); if(avail<=0) continue;
    totRemCal+=f.cal*avail;
    for(const g of S.goals){
      if(g.type==='count_min') totRemCount[g.id]=(totRemCount[g.id]||0)+(f.meal?avail:0);
    }
  }

  for(const f of foods){
    if(isExcluded(f.id)||servingsOf(f.id)>=2){ feasMap[f.id]=false; continue; }
    const avail=2-servingsOf(f.id);
    const fRemCal=f.cal*avail;

    let ok=false;
    for(let sx=1;sx<=avail&&!ok;sx++){
      const newRawCal=rawCalNow+f.cal*sx;
      const remCal=totRemCal-fRemCal+f.cal*(avail-sx);
      if(newRawCal>calMaxRaw) continue;
      if(newRawCal+remCal<calMinRaw) continue;

      // Remaining calorie headroom after committing to sx servings of f.
      // Used by min/avg checks to bound how much other food can still be added.
      const remCalHeadroom=calMaxRaw-newRawCal;

      let goalOk=true;
      for(const g of S.goals){
        if(!goalOk) break;
        if(g.id==='cal') continue;

        if(g.type==='count_min'){
          const fCount=f.meal?avail:0;
          const newM=sumsNow[g.id]+(f.meal?sx:0);
          const remM=(totRemCount[g.id]||0)-fCount+(f.meal?(avail-sx):0);
          if(newM+remM<g.threshold) goalOk=false;

        } else if(g.type==='min'){
          const m=getMetric(f,g);
          const newSum=sumsNow[g.id]+m*sx;
          // Calorie-aware upper bound: count each food only if it individually fits in headroom.
          // This is optimistic (foods share the budget) but catches the common case where
          // the calorie ceiling is nearly full and no protein-rich food can actually be added.
          const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
          let calAwareRem=m*fOwnAfford;
          for(const j of foods){
            if(j.id===f.id||isExcluded(j.id)) continue;
            const availJ=2-servingsOf(j.id); if(availJ<=0) continue;
            const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
            calAwareRem+=getMetric(j,g)*afford;
          }
          if(newSum+calAwareRem<g.threshold) goalOk=false;

        } else if(g.type==='max'){
          const m=getMetric(f,g);
          if(sumsNow[g.id]+m*sx>g.threshold) goalOk=false;

        } else if(g.type==='avg_min'){
          const m=getMetric(f,g);
          const newHW=hwNow[g.id]+m*f.cal*sx;
          // Calorie-aware health surplus: only count high-health foods that fit in headroom.
          const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
          let calAwareRemHS=Math.max(0,(m-g.threshold)*f.cal*fOwnAfford);
          for(const j of foods){
            if(j.id===f.id||isExcluded(j.id)) continue;
            const availJ=2-servingsOf(j.id); if(availJ<=0) continue;
            const mj=getMetric(j,g);
            const surJ=(mj-g.threshold)*j.cal;
            if(surJ>0){
              const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
              calAwareRemHS+=surJ*afford;
            }
          }
          if(newHW-g.threshold*newRawCal+calAwareRemHS<-1e-6) goalOk=false;

        } else if(g.type==='avg_max'){
          const m=getMetric(f,g);
          const newHW=hwNow[g.id]+m*f.cal*sx;
          // Calorie-aware recovery: only count below-threshold foods that fit in headroom.
          const fOwnAfford=f.cal>0?Math.min(avail-sx,Math.floor(remCalHeadroom/f.cal)):avail-sx;
          let calAwareRemHD=Math.max(0,(g.threshold-m)*f.cal*fOwnAfford);
          for(const j of foods){
            if(j.id===f.id||isExcluded(j.id)) continue;
            const availJ=2-servingsOf(j.id); if(availJ<=0) continue;
            const mj=getMetric(j,g);
            const recJ=(g.threshold-mj)*j.cal;
            if(recJ>0){
              const afford=j.cal>0?Math.min(availJ,Math.floor(remCalHeadroom/j.cal)):availJ;
              calAwareRemHD+=recJ*afford;
            }
          }
          if(g.threshold*newRawCal-newHW+calAwareRemHD<-1e-6) goalOk=false;
        }
      }
      if(goalOk) ok=true;
    }
    feasMap[f.id]=ok;
  }
  return feasMap;
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function render(){
  const st = computeStats();
  const feas = computeFeasibility();
  renderBanner();
  renderStats(st);
  renderGrids(feas);
  renderEaten();
}

function renderBanner(){
  const banner=document.getElementById('recompute-banner');
  if(_computing){
    banner.className='computing';
    banner.textContent='⏳ Computing meal plans...';
    return;
  }
  if(!precompIsValid()){
    startPrecompute();
    return;
  }
  if(_incComputing){
    banner.className='computing';
    banner.textContent='⏳ Checking plan feasibility...';
    return;
  }
  // Show "stuck" warning when the exact incFeas result shows no valid completion exists
  const anyEaten = Object.values(S.servings).some(s=>s>0);
  if(anyEaten && S.incFeas && S.incFeas.hash===incFeasHash() && S.incFeas.count===0 && !S.incFeas.truncated){
    const st=computeStats();
    if(!allGoalsMet(st.sums,st.avgs)){
      banner.className=''; // warning style (yellow)
      banner.textContent='⚠️ No valid plan completion exists from this state — consider removing a food or resetting the day.';
      return;
    }
  }
  banner.className='hidden';
  banner.textContent='';
}

function fmtVal(v, g){
  if(g.type==='avg_min'||g.type==='avg_max') return v.toFixed(2);
  const n=Math.round(v*10)/10;
  return n===Math.floor(n)?String(Math.floor(n)):n.toFixed(1);
}

function renderStats(st){
  const {sums, avgs} = st;
  const calGoal_ = S.goals.find(g=>g.id==='cal');
  const anyEaten_ = Object.values(S.servings).some(s=>s>0);
  const incValid_ = anyEaten_ && S.incFeas && S.incFeas.hash===incFeasHash();
  const planNote = incValid_
    ?` <small style="color:var(--muted);font-weight:400">(${S.incFeas.count.toLocaleString()}${S.incFeas.truncated?'+':''} plans)</small>`
    : precompIsValid()
      ?` <small style="color:var(--muted);font-weight:400">(${S.precomp.count.toLocaleString()}${S.precomp.truncated?'+':''} plans)</small>`:'';

  let html='';
  for(const g of S.goals){
    if(g.type==='range'){
      const netCal=sums['cal']||0;
      const rawCal=netCal+S.exCals;
      const effGoal=g.goal+S.exCals, effMin=g.goal-g.range+S.exCals, effMax=g.goal+g.range+S.exCals;
      const pctFill=Math.min(100,effMax>0?rawCal/effMax*100:0).toFixed(1)+'%';
      const inWin=rawCal>=effMin&&rawCal<=effMax;
      const color=inWin?'g':rawCal>effMax?'b':rawCal>=effMin*.9?'w':'b';
      const exNote=S.exCals>0?` <small style="color:var(--ok)">+${S.exCals} burn</small>`:'';
      html+=`<div class="stat">
        <div class="stat-lbl"><span>${g.name}${exNote}</span><span>${rawCal} / ${effGoal} <small style="color:var(--muted)">(${effMin}–${effMax})</small></span></div>
        <div class="pbar"><div class="pbar-fill ${color}" style="width:${pctFill}"></div></div>
      </div>`;
    } else if(g.type==='count_min'){
      const val=sums[g.id]||0; const ok=val>=g.threshold;
      html+=`<div class="stat" style="justify-content:flex-end">
        <div class="stat-lbl"><span>${g.name}${planNote}</span></div>
        <div class="meals-badge ${ok?'':'unmet'}">${ok?'✓':'✗'} ${val} / ${g.threshold} ${g.name.toLowerCase()}</div>
      </div>`;
    } else {
      const isAvg=(g.type==='avg_min'||g.type==='avg_max');
      const val=isAvg?(avgs[g.id]||0):(sums[g.id]||0);
      const thr=g.threshold;
      const unit=g.unit?` ${g.unit}`:'';
      const pctFill=Math.min(100,thr>0?val/thr*100:0).toFixed(1)+'%';
      let color;
      if(g.type==='max'||g.type==='avg_max'){
        color=val>thr?'b':val>=thr*.8?'w':'g';
      } else {
        color=val>=thr?'g':val>=thr*.75?'w':'b';
      }
      const dirLabel=(g.type==='max'||g.type==='avg_max')?'≤':'≥';
      html+=`<div class="stat">
        <div class="stat-lbl"><span>${g.name}</span><span>${fmtVal(val,g)}${unit} / ${dirLabel}${thr}${unit}</span></div>
        <div class="pbar"><div class="pbar-fill ${color}" style="width:${pctFill}"></div></div>
      </div>`;
    }
  }
  document.getElementById('stats-row').innerHTML=html;
  document.getElementById('goals-badge').classList.toggle('show', allGoalsMet(sums,avgs));
}

function computeRestrictions(feas){
  // Restriction scores require full plan enumeration which was removed to prevent OOM.
  return {counts:{},denom:1};
}

function makeCard(f, feas, restrict){
  const s=servingsOf(f.id);
  const isFeas=feas[f.id]!==false;
  const maxed=s>=2, eaten=s>0, xed=isExcluded(f.id);
  const div=document.createElement('div');
  let cls='card';
  if(maxed) cls+=' maxed';
  if(!isFeas) cls+=' grey';
  if(eaten) cls+=' eaten';
  if(xed) cls+=' xed';
  div.className=cls;

  // Restriction bar
  let rbarHtml='';
  if(isFeas&&!maxed&&!xed&&restrict&&restrict.counts[f.id]!==undefined){
    const locks=restrict.counts[f.id];
    const fillPct=(locks/restrict.denom*100).toFixed(1);
    const fillColor=locks===0?'transparent':locks<=2?'var(--warn)':locks<=5?'#f97316':'var(--bad)';
    const tip=locks===0?'No other foods affected':`Locks out ${locks} food${locks===1?'':'s'} if selected`;
    rbarHtml=`<div class="rbar" title="${tip}"><div class="rbar-fill" style="width:${fillPct}%;background:${fillColor}"></div></div>`;
  }

  // Stats chips: cal + first 2 non-cal non-count_min goals
  const dispGoals=S.goals.filter(g=>g.id!=='cal'&&g.type!=='count_min').slice(0,2);
  let statsHtml=`<b>${f.cal}</b> cal`;
  for(const g of dispGoals){
    const v=getMetric(f,g);
    const unit=g.unit?`${g.unit}`:'';
    if(g.type==='avg_min'||g.type==='avg_max'){
      const h=Math.max(0,Math.min(1,v));
      statsHtml+=` &nbsp; <span style="color:${healthColor(h)};font-weight:700">♥${v.toFixed(2)}</span>`;
    } else {
      statsHtml+=` &nbsp; <b>${fmtVal(v,g)}${unit}</b>`;
    }
  }

  const xTitle=xed?'Un-skip (allow again)':eaten?`No more — cap at ${s}`:'Skip today';
  const xLabel=xed?'↺':'✕';

  div.innerHTML=`
    <div class="hbar" style="background:${healthColor(getHealthMetric(f))}"></div>
    <div class="cbody">
      <div class="cname">${f.name}</div>
      <div class="cstats">${statsHtml}</div>
    </div>
    <div class="cfoot">
      ${eaten?`<span class="sbadge${s===2?' two':''}">${s}×</span>`:'<span></span>'}
      <div style="display:flex;gap:4px;align-items:center">
        ${eaten?`<button class="minus-btn" data-rm="${f.id}" title="Remove serving">−</button>`:''}
        ${s===1&&isFeas&&!maxed&&!xed?`<button class="plus-btn" data-id="${f.id}" title="Add 2nd serving">＋</button>`:''}
        <button class="edit-btn" data-edit="${f.id}">✎</button>
        ${!maxed?`<button class="edit-btn" data-excl="${f.id}" title="${xTitle}">${xLabel}</button>`:''}
      </div>
    </div>
    ${rbarHtml}`;

  if(!maxed&&isFeas&&!xed){
    div.addEventListener('click',ev=>{
      if(ev.target.closest('[data-edit],[data-rm],[data-excl],.plus-btn')) return;
      addServing(f.id);
    });
  }
  div.addEventListener('contextmenu',ev=>{
    if(servingsOf(f.id)>=2) return;
    ev.preventDefault(); toggleExclude(f.id);
  });
  let _lp=null;
  div.addEventListener('touchstart',()=>{
    if(servingsOf(f.id)>=2) return;
    _lp=setTimeout(()=>{_lp=null;toggleExclude(f.id);},550);
  },{passive:true});
  const clp=()=>{if(_lp){clearTimeout(_lp);_lp=null;}};
  div.addEventListener('touchend',clp);
  div.addEventListener('touchmove',clp);
  div.addEventListener('touchcancel',clp);
  div.querySelector('[data-rm]')?.addEventListener('click',ev=>{ev.stopPropagation();removeServing(f.id);});
  div.querySelector('.plus-btn')?.addEventListener('click',ev=>{ev.stopPropagation();addServing(f.id);});
  div.querySelector('[data-edit]').addEventListener('click',ev=>{ev.stopPropagation();openEditModal(f.id);});
  div.querySelector('[data-excl]')?.addEventListener('click',ev=>{ev.stopPropagation();toggleExclude(f.id);});
  return div;
}

function renderGrids(feas){
  const foods=allFoods();
  const restrict=computeRestrictions(feas);
  const mg=document.getElementById('meals-grid');
  const sg=document.getElementById('snacks-grid');
  mg.innerHTML=''; sg.innerHTML='';
  const sorted=[...foods].sort((a,b)=>a.name.localeCompare(b.name));
  for(const f of sorted){
    (f.meal?mg:sg).appendChild(makeCard(f,feas,restrict));
  }
}

function renderEaten(){
  const el=document.getElementById('eaten-list');
  const eaten=allFoods().filter(f=>servingsOf(f.id)>0);
  if(!eaten.length){el.innerHTML='<span class="empty">Nothing eaten yet today.</span>';return;}
  el.innerHTML='';
  for(const f of eaten){
    const s=servingsOf(f.id);
    const dispGoals=S.goals.filter(g=>g.id!=='cal'&&g.type!=='count_min').slice(0,2);
    let extra=`${f.cal*s} cal`;
    for(const g of dispGoals){
      const v=getMetric(f,g)*s;
      const unit=g.unit?`${g.unit}`:'';
      if(g.type==='avg_min'||g.type==='avg_max') extra+=` · ♥${(getMetric(f,g)).toFixed(2)}`;
      else extra+=` · ${fmtVal(v,g)}${unit} ${g.name.toLowerCase()}`;
    }
    const chip=document.createElement('div');
    chip.className='eaten-chip';
    chip.innerHTML=`<strong>${f.name}</strong> <span>×${s} · ${extra}</span>
      <button class="rm-btn" title="Remove 1 serving">−</button>`;
    chip.querySelector('.rm-btn').addEventListener('click',()=>removeServing(f.id));
    el.appendChild(chip);
  }
}

// ═══════════════════════════════════════════════
//  STATE MUTATIONS
// ═══════════════════════════════════════════════
function addServing(id){
  if(_incComputing) return; // block until exact feasibility is confirmed
  const cur=servingsOf(id); if(cur>=2) return;
  const nc=(cur||0)+1; S.servings[id]=nc;
  updateCompatPlans(id,nc,true);
  startIncFeasCompute();
  saveState(); render();
}
function removeServing(id){
  const cur=servingsOf(id); if(!cur) return;
  if(cur<=1) delete S.servings[id]; else S.servings[id]=cur-1;
  updateCompatPlans(id, S.servings[id]||0, false);
  startIncFeasCompute();
  saveState(); render();
}
function toggleExclude(id){
  if(servingsOf(id)>=2) return;
  if(S.excluded[id]){
    delete S.excluded[id];
    buildCompatPlans();
  } else {
    S.excluded[id]=true;
  }
  startIncFeasCompute();
  saveState(); render();
}

function archiveFood(id){
  // Temp foods just get removed; they're session-only anyway
  const ti=S.temp.findIndex(x=>x.id===id);
  if(ti>=0){ S.temp.splice(ti,1); delete S.servings[id]; saveState(); return; }
  if(BASE_FOODS.find(f=>f.id===id)){
    S.overrides[id]={...(S.overrides[id]||{}),archived:true};
  } else {
    const ci=S.custom.findIndex(x=>x.id===id);
    if(ci>=0) S.custom[ci]={...S.custom[ci],archived:true};
  }
  delete S.servings[id];
  delete S.excluded[id];
  saveState();
}

function restoreFood(id){
  if(S.overrides[id]?.archived){
    const ov={...S.overrides[id]};
    delete ov.archived;
    if(Object.keys(ov).length===0) delete S.overrides[id]; else S.overrides[id]=ov;
  } else {
    const ci=S.custom.findIndex(x=>x.id===id);
    if(ci>=0){ const f={...S.custom[ci]}; delete f.archived; S.custom[ci]=f; }
  }
  saveState();
}

// ═══════════════════════════════════════════════
//  MODAL SYSTEM
// ═══════════════════════════════════════════════
function openModal(html, onSubmit){
  const box=document.getElementById('mbox');
  box.innerHTML=html;
  document.getElementById('overlay').classList.remove('h');
  if(onSubmit){
    const form=box.querySelector('form');
    if(form) form.addEventListener('submit',ev=>{ev.preventDefault();onSubmit(form);});
  }
  box.querySelector('.btn-cancel')?.addEventListener('click',closeModal);
}
function closeModal(){document.getElementById('overlay').classList.add('h');}
document.getElementById('overlay').addEventListener('click',ev=>{
  if(ev.target===document.getElementById('overlay')) closeModal();
});

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function wireToggle(togId,lblId){
  const tog=document.getElementById(togId);
  const lbl=document.getElementById(lblId);
  if(lbl) lbl.addEventListener('click',()=>tog.classList.toggle('on'));
}

// ── Goal type labels ──────────────────────────
const TYPE_LABELS = {range:'Range',min:'Minimum',max:'Maximum',avg_min:'Avg Min',avg_max:'Avg Max',count_min:'Count Min'};

// ── Settings / Goal Manager ───────────────────
function openSettings(){
  const goalRows = S.goals.map((g,idx)=>{
    let params;
    if(g.type==='range') params=`${g.goal} ± ${g.range}${g.unit?' '+g.unit:''}`;
    else if(g.type==='min'||g.type==='avg_min'||g.type==='count_min') params=`≥ ${g.threshold}${g.unit?' '+g.unit:''}`;
    else params=`≤ ${g.threshold}${g.unit?' '+g.unit:''}`;
    return `<div class="goal-row">
      <div class="goal-info">
        <span class="goal-name">${esc(g.name)}</span>
        <span class="goal-badge">${TYPE_LABELS[g.type]||g.type}</span>
        <span class="goal-params">${params}</span>
      </div>
      <div class="goal-actions">
        <button class="btn btn-sm" data-edit-g="${idx}">Edit</button>
        ${!g.builtin?`<button class="btn btn-sm dng" data-del-g="${idx}">✕</button>`:''}
      </div>
    </div>`;
  }).join('');

  openModal(`<h2>⚙ Goals</h2>
    <div class="sec-lbl">ACTIVE GOALS</div>
    <div id="goals-list" style="margin-bottom:14px">${goalRows}</div>
    <button class="btn pri" id="btn-add-goal">＋ Add Goal</button>
    <div class="mactions"><button type="button" class="btn btn-cancel">Close</button></div>`);

  document.getElementById('btn-add-goal').addEventListener('click',()=>{
    closeModal();
    openGoalEditModal(null, g=>{
      S.goals.push(g);
      saveState(); render(); openSettings();
    });
  });
  document.querySelectorAll('[data-edit-g]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=+btn.dataset.editG;
      const original=S.goals[idx];
      closeModal();
      openGoalEditModal(original, updated=>{
        S.goals[idx]=updated;
        saveState(); render(); openSettings();
      });
    });
  });
  document.querySelectorAll('[data-del-g]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=+btn.dataset.delG;
      if(!confirm(`Delete goal "${S.goals[idx].name}"?`)) return;
      S.goals.splice(idx,1);
      saveState(); render(); openSettings();
    });
  });
}

// ── Add / Edit Goal modal ─────────────────────
function openGoalEditModal(existing, onSave){
  const isNew=!existing;
  const g=existing||{id:'',name:'',unit:'',type:'min',threshold:0,goal:1900,range:50,default:0,builtin:false};

  const typeOpts=['range','min','max','avg_min','avg_max','count_min'].map(t=>
    `<option value="${t}"${g.type===t?' selected':''}>${TYPE_LABELS[t]}</option>`
  ).join('');

  openModal(`<h2>${isNew?'＋ Add Goal':'✎ Edit Goal: '+esc(g.name)}</h2>
    <form>
      <div class="fg"><label>Name</label><input type="text" name="name" required value="${esc(g.name)}" placeholder="e.g. Sodium"></div>
      <div class="fg"><label>Unit <small style="color:var(--muted)">(optional, e.g. g, mg)</small></label>
        <input type="text" name="unit" value="${esc(g.unit||'')}" placeholder="optional"></div>
      <div class="fg"><label>Type</label>
        <select name="type" id="gtype-sel"${g.builtin?' disabled':''}>${typeOpts}</select>
      </div>
      <div id="gparams"></div>
      <div class="fg"><label>Default value for new foods</label>
        <input type="number" name="gdefault" value="${g.default??0}" step="any"></div>
      <div class="mactions">
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn pri">${isNew?'Add Goal':'Save'}</button>
      </div>
    </form>`,
    form=>{
      const d=new FormData(form);
      const type=g.builtin?g.type:d.get('type');
      const name=d.get('name').trim();
      if(!name) return;
      const unit=d.get('unit').trim();
      const def=parseFloat(d.get('gdefault'))||0;
      const updated={...g, name, unit, type, default:def};
      if(type==='range'){
        updated.goal=parseFloat(d.get('gparam1'))||0;
        updated.range=parseFloat(d.get('gparam2'))||0;
        delete updated.threshold;
      } else {
        updated.threshold=parseFloat(d.get('gparam1'))||0;
        delete updated.goal; delete updated.range;
      }
      if(isNew){ updated.id='cg_'+Date.now(); updated.builtin=false; }
      closeModal();
      onSave(updated);
    });

  function renderParams(type){
    const el=document.getElementById('gparams'); if(!el) return;
    if(type==='range'){
      el.innerHTML=`
        <div class="fg"><label>Target value</label><input type="number" name="gparam1" value="${g.goal??1900}" step="any" required></div>
        <div class="fg"><label>Range (±)</label><input type="number" name="gparam2" value="${g.range??50}" min="0" step="any" required></div>`;
    } else {
      const lbl={min:'Minimum',max:'Maximum',avg_min:'Minimum average',avg_max:'Maximum average',count_min:'Minimum count'}[type]||'Threshold';
      el.innerHTML=`<div class="fg"><label>${lbl}</label><input type="number" name="gparam1" value="${g.threshold??0}" step="any" required></div>`;
    }
  }

  const sel=document.getElementById('gtype-sel');
  if(sel){
    renderParams(sel.value);
    if(!g.builtin) sel.addEventListener('change',()=>renderParams(sel.value));
  }
}

// ── Extras fields helper ──────────────────────
function renderExtrasFields(vals){
  const goals=S.goals.filter(g=>g.id!=='cal'&&g.type!=='count_min');
  if(!goals.length) return '';
  let html='<div class="sep"></div><div class="sec-lbl">GOAL METRICS</div>';
  for(const g of goals){
    const v=vals&&vals[g.id]!==undefined?vals[g.id]:(g.default??0);
    const unit=g.unit?` (${g.unit})`:'';
    const eid='ev_'+g.id;
    if((g.type==='avg_min'||g.type==='avg_max')&&g.threshold<=1&&g.threshold>=0){
      html+=`<div class="fg"><label>${esc(g.name)}: <span class="rv" id="${eid}">${(+v).toFixed(2)}</span></label>
        <input type="range" name="ex_${g.id}" value="${+v}" min="0" max="1" step="0.05"
          oninput="document.getElementById('${eid}').textContent=parseFloat(this.value).toFixed(2)"></div>`;
    } else {
      html+=`<div class="fg"><label>${esc(g.name)}${unit}</label>
        <input type="number" name="ex_${g.id}" value="${+v}" min="0" step="any"></div>`;
    }
  }
  return html;
}

function extrasFromForm(form){
  const d=new FormData(form);
  const extras={};
  for(const g of S.goals){
    if(g.id==='cal'||g.type==='count_min') continue;
    const raw=d.get('ex_'+g.id);
    if(raw!==null) extras[g.id]=parseFloat(raw)||0;
  }
  return extras;
}

// ── Add Food modal ────────────────────────────
function openAddModal(){
  openModal(`<h2>＋ Add Food</h2>
    <form>
      <div class="fg"><label>Name</label><input type="text" name="name" required placeholder="Food name"></div>
      <div class="fg"><label>Calories</label><input type="number" name="cal" required min="0" max="5000" placeholder="0"></div>
      <div class="fg">
        <label class="tog-row" id="meal-tog-lbl"><div class="tog" id="meal-tog"></div> Count as a Meal</label>
      </div>
      ${renderExtrasFields({})}
      <div class="sep"></div>
      <div class="fg">
        <label class="tog-row" id="perm-tog-lbl"><div class="tog on" id="perm-tog"></div> Save Permanently</label>
        <div class="note">Temporary foods are cleared when you close the tab.</div>
      </div>
      <div class="mactions"><button type="button" class="btn btn-cancel">Cancel</button><button type="submit" class="btn pri">Add Food</button></div>
    </form>`,
    form=>{
      const d=new FormData(form);
      const mealOn=document.getElementById('meal-tog').classList.contains('on');
      const permOn=document.getElementById('perm-tog').classList.contains('on');
      const newFood={
        id:'custom-'+Date.now(),
        name:d.get('name').trim(),
        cal:+d.get('cal'),
        meal:mealOn,
        extras:extrasFromForm(form),
      };
      if(!newFood.name||newFood.cal<0) return;
      if(permOn) S.custom.push(newFood);
      else S.temp.push(newFood);
      saveState(); closeModal(); render();
    });
  wireToggle('meal-tog','meal-tog-lbl');
  wireToggle('perm-tog','perm-tog-lbl');
}

// ── Edit Food modal ───────────────────────────
function openEditModal(id){
  const f=getFoodById(id); if(!f) return;
  const isBase=f.isBase;
  openModal(`<h2>✎ Edit: ${esc(f.name)}</h2>
    <form>
      <div class="fg"><label>Name</label><input type="text" name="name" value="${esc(f.name)}" required></div>
      <div class="fg"><label>Calories</label><input type="number" name="cal" value="${f.cal}" required min="0" max="5000"></div>
      <div class="fg">
        <label class="tog-row" id="emeal-tog-lbl"><div class="tog${f.meal?' on':''}" id="emeal-tog"></div> Count as a Meal</label>
      </div>
      ${renderExtrasFields(f.extras||{})}
      <div class="mactions">
        ${isBase?`<button type="button" class="btn" id="btn-rfood">Reset</button>`
                :`<button type="button" class="btn dng" id="btn-dfood">Delete</button>`}
        <button type="button" class="btn" id="btn-archfood">Archive</button>
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="submit" class="btn pri">Save</button>
      </div>
    </form>`,
    form=>{
      const d=new FormData(form);
      const mealOn=document.getElementById('emeal-tog').classList.contains('on');
      const upd={name:d.get('name').trim(),cal:+d.get('cal'),meal:mealOn,extras:extrasFromForm(form)};
      if(isBase){
        S.overrides[id]={...upd};
      } else {
        const ci=S.custom.findIndex(x=>x.id===id);
        if(ci>=0) S.custom[ci]={...S.custom[ci],...upd};
        const ti=S.temp.findIndex(x=>x.id===id);
        if(ti>=0) S.temp[ti]={...S.temp[ti],...upd};
      }
      saveState(); closeModal(); render();
    });
  wireToggle('emeal-tog','emeal-tog-lbl');
  setTimeout(()=>{
    document.getElementById('btn-rfood')?.addEventListener('click',()=>{
      delete S.overrides[id]; saveState(); closeModal(); render();
    });
    document.getElementById('btn-dfood')?.addEventListener('click',()=>{
      S.custom=S.custom.filter(x=>x.id!==id);
      S.temp=S.temp.filter(x=>x.id!==id);
      delete S.servings[id];
      saveState(); closeModal(); render();
    });
    document.getElementById('btn-archfood')?.addEventListener('click',()=>{
      archiveFood(id); closeModal(); render();
    });
  },0);
}

// ── Library modal ────────────────────────────
function openLibraryModal(){
  const allF=allFoods({includeArchived:true});
  const active=allF.filter(f=>!f.archived&&(f.isBase||f.isPerm)).sort((a,b)=>a.name.localeCompare(b.name));
  const archived=allF.filter(f=>f.archived).sort((a,b)=>a.name.localeCompare(b.name));

  const activeRows=active.map(f=>`
    <div class="goal-row">
      <div class="goal-info">
        <span class="goal-name">${esc(f.name)}</span>
        <span class="goal-badge">${f.meal?'Meal':'Snack'}</span>
        <span class="goal-params">${f.cal} cal${f.isBase?'':' · custom'}</span>
      </div>
      <div class="goal-actions">
        <button class="btn btn-sm" data-edit-f="${f.id}">Edit</button>
        <button class="btn btn-sm" data-arch-f="${f.id}">Archive</button>
      </div>
    </div>`).join('') || '<div class="empty" style="padding:8px 0">No active foods.</div>';

  const archRows=archived.map(f=>`
    <div class="goal-row" style="opacity:.6">
      <div class="goal-info">
        <span class="goal-name">${esc(f.name)}</span>
        <span class="goal-badge">${f.meal?'Meal':'Snack'}</span>
        <span class="goal-params">${f.cal} cal${f.isBase?'':' · custom'}</span>
      </div>
      <div class="goal-actions">
        <button class="btn btn-sm ok" data-restore-f="${f.id}">Restore</button>
      </div>
    </div>`).join('') || '<div class="empty" style="padding:8px 0">No archived foods.</div>';

  const fileLine = _libFileHandle
    ? `<div style="color:var(--ok);font-size:11px;margin-bottom:10px">✓ Linked to library file — changes save automatically</div>`
    : HAS_FSA
      ? `<div style="color:var(--warn);font-size:11px;margin-bottom:10px">⚠ No library file linked — data is browser-only</div>`
      : `<div style="color:var(--muted);font-size:11px;margin-bottom:10px">ℹ Browser doesn't support File System API — using browser storage</div>`;

  const fileBtns = HAS_FSA ? `<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
    ${_libFileHandle
      ?`<button class="btn btn-sm" id="lbtn-unlink2">Unlink File</button>`
      :`<button class="btn btn-sm pri" id="lbtn-open2">Open Library File</button>
        <button class="btn btn-sm" id="lbtn-new2">Create New File</button>`}
  </div>` : '';

  openModal(`<h2>📚 Food Library</h2>
    ${fileLine}${fileBtns}
    <div class="sec-lbl">ACTIVE FOODS (${active.length})</div>
    <div style="margin-bottom:16px">${activeRows}</div>
    <div class="sec-lbl">ARCHIVED (${archived.length})</div>
    <div>${archRows}</div>
    <div class="mactions"><button type="button" class="btn btn-cancel">Close</button></div>`);

  document.getElementById('lbtn-open2')?.addEventListener('click',async()=>{await pickLibFile();closeModal();openLibraryModal();});
  document.getElementById('lbtn-new2')?.addEventListener('click',async()=>{await newLibFile();closeModal();openLibraryModal();});
  document.getElementById('lbtn-unlink2')?.addEventListener('click',async()=>{await unlinkLibFile();closeModal();openLibraryModal();});

  document.querySelectorAll('[data-edit-f]').forEach(btn=>{
    btn.addEventListener('click',()=>{const id=btn.dataset.editF;closeModal();openEditModal(id);});
  });
  document.querySelectorAll('[data-arch-f]').forEach(btn=>{
    btn.addEventListener('click',()=>{archiveFood(btn.dataset.archF);render();closeModal();openLibraryModal();});
  });
  document.querySelectorAll('[data-restore-f]').forEach(btn=>{
    btn.addEventListener('click',()=>{restoreFood(btn.dataset.restoreF);render();closeModal();openLibraryModal();});
  });
}

// ── Exercise Presets modal ────────────────────
function openExPresetsModal(){ showPresetPicker(); }

function showPresetPicker(){
  const chips = S.exercisePresets.map(p =>
    `<button class="preset-chip" data-pid="${esc(p.id)}">${esc(p.name)}<span class="pc-cal">${p.cal} cal</span></button>`
  ).join('');
  openModal(`<h2>⚡ Exercise Presets</h2>
    <div class="preset-chips">${chips||'<p style="color:var(--muted);font-size:13px">No presets yet — click Edit to add some.</p>'}</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="btn btn-sm" id="btn-ep-edit">✎ Edit Presets</button>
      <button class="btn btn-sm btn-cancel">Close</button>
    </div>`, null);
  document.querySelectorAll('.preset-chip[data-pid]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = S.exercisePresets.find(x => x.id === btn.dataset.pid);
      if (!p) return;
      S.exCals = (S.exCals || 0) + p.cal;
      document.getElementById('ex-input').value = S.exCals;
      if (_worker) { _worker.terminate(); _worker = null; _computing = false; }
      buildCompatPlans();
      saveState(); render(); closeModal();
    });
  });
  document.getElementById('btn-ep-edit').addEventListener('click', showPresetEditor);
}

function showPresetEditor(){
  let working = S.exercisePresets.map(p => ({...p}));
  function renderEditor(){
    const rows = working.map((p, i) =>
      `<div class="preset-edit-row">
        <input type="text" class="pe-name" data-i="${i}" value="${esc(p.name)}" style="width:100%">
        <input type="number" class="pe-cal" data-i="${i}" value="${p.cal}" min="0" max="9999" step="10" style="width:100%">
        <button class="btn btn-sm dng pe-del" data-i="${i}" title="Delete">✕</button>
      </div>`
    ).join('');
    document.getElementById('mbox').innerHTML = `<h2>✎ Edit Presets</h2>
      <div id="preset-rows">${rows||'<p style="color:var(--muted);font-size:13px">No presets.</p>'}</div>
      <button class="btn btn-sm ok" id="btn-ep-add" style="margin:8px 0 16px">＋ Add Preset</button>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-sm" id="btn-ep-back">← Back</button>
        <button class="btn btn-sm ok" id="btn-ep-save">Save</button>
      </div>`;
    function flush(){
      document.querySelectorAll('.pe-name').forEach(n => {
        const i = parseInt(n.dataset.i);
        working[i].name = n.value.trim();
        working[i].cal = Math.max(0, parseInt(document.querySelector(`.pe-cal[data-i="${i}"]`).value) || 0);
      });
    }
    document.getElementById('btn-ep-add').addEventListener('click', () => {
      flush();
      working.push({id:`ep-${Date.now()}`, name:'New Activity', cal:0});
      renderEditor();
    });
    document.querySelectorAll('.pe-del').forEach(btn => {
      btn.addEventListener('click', () => {
        flush();
        working.splice(parseInt(btn.dataset.i), 1);
        renderEditor();
      });
    });
    document.getElementById('btn-ep-back').addEventListener('click', showPresetPicker);
    document.getElementById('btn-ep-save').addEventListener('click', () => {
      flush();
      S.exercisePresets = working.filter(p => p.name);
      saveState();
      showPresetPicker();
    });
  }
  renderEditor();
}

// ── Reset Day ─────────────────────────────────
function resetDay(){
  if(!confirm('Clear all eaten foods for today?')) return;
  S.servings={}; S.exCals=0; S.temp=[]; S.excluded={};
  if(_incComputing && _incWorker){ _incWorker.terminate(); _incWorker=null; _incComputing=false; }
  S.incFeas=null;
  document.getElementById('ex-input').value='';
  buildCompatPlans();
  saveState(); render();
}

// ═══════════════════════════════════════════════
//  EVENT LISTENERS
// ═══════════════════════════════════════════════
document.getElementById('btn-add').addEventListener('click', openAddModal);
document.getElementById('btn-ex-presets').addEventListener('click', openExPresetsModal);
document.getElementById('btn-library').addEventListener('click', openLibraryModal);
document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('btn-reset').addEventListener('click', resetDay);
document.getElementById('ex-input').addEventListener('input', ev=>{
  S.exCals=Math.max(0,parseInt(ev.target.value)||0);
  // Kill any in-flight workers — they were computing with the old exCals
  if(_worker){ _worker.terminate(); _worker=null; _computing=false; }
  buildCompatPlans();
  startIncFeasCompute();
  saveState(); render();
});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadState();
document.getElementById('ex-input').value=S.exCals||'';
if(S.precomp&&precompIsValid()) buildCompatPlans();
render();
if(!precompIsValid()&&!_computing) startPrecompute();
// If foods were already eaten in the restored state, kick off incremental feasibility
startIncFeasCompute();
// Async: attempt to link library file (may reload library data from file)
initLibFile().then(()=>{
  render();
  if(!precompIsValid()&&!_computing) startPrecompute();
  startIncFeasCompute();
});
</script>
