// ── Compare modal ─────────────────────────────
let _cmpQueue = [];

function openCompare(){
  const feas = computeFeasibility();
  const pool = allFoods().filter(f => feas[f.id] !== false);
  if(pool.length < 2){
    openModal(`<h2>⚔ Compare</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">
        ${pool.length === 0
          ? 'No feasible foods to compare right now.'
          : 'Only one feasible food — nothing to compare!'}
      </p>
      <div class="mactions"><button class="btn btn-cancel">Close</button></div>`);
    return;
  }

  // Build per-category counts from the feasible pool
  const catCounts = {};
  for(const f of pool){
    const cid = getFoodCategory(f);
    catCounts[cid] = (catCounts[cid] || 0) + 1;
  }
  const activeCats = S.categories.filter(c => (catCounts[c.id] || 0) >= 2);

  // If only one (or zero) categories have enough foods, skip the picker
  if(activeCats.length <= 1){
    _cmpQueue = [...pool].sort(() => Math.random() - 0.5);
    renderCompare();
    return;
  }

  const catBtns = activeCats.map(c =>
    `<button class="btn" data-cmp-cat="${esc(c.id)}" style="flex:1 1 auto">${esc(c.name)}</button>`
  ).join('');

  openModal(`<h2>⚔ Compare</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:12px">Which category do you want to compare?</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
      ${catBtns}
      <button class="btn pri" data-cmp-cat="__all__" style="flex:1 1 auto">All</button>
    </div>
    <div class="mactions"><button class="btn btn-cancel">Close</button></div>`);

  document.querySelectorAll('[data-cmp-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cid = btn.dataset.cmpCat;
      const filtered = cid === '__all__' ? pool : pool.filter(f => getFoodCategory(f) === cid);
      if(filtered.length < 2){
        // Shouldn't happen but guard anyway
        _cmpQueue = [...pool].sort(() => Math.random() - 0.5);
      } else {
        _cmpQueue = [...filtered].sort(() => Math.random() - 0.5);
      }
      renderCompare();
    });
  });
}

function renderCompare(){
  const q = _cmpQueue;
  const box = document.getElementById('mbox');
  box.style.maxWidth = '640px';
  document.getElementById('overlay').classList.remove('h');

  if(q.length === 1){
    const f = q[0];
    const statsHtml = foodStatsHtml(f, {names:true});
    const canEat = servingsOf(f.id) < maxServingsOf(f.id);
    box.innerHTML = `
      <h2>⚔ Compare</h2>
      <div class="cmp-winner">
        <div style="font-size:2.2rem;margin-bottom:6px">🏆</div>
        <div style="font-size:1.25rem;font-weight:800;margin-bottom:8px">${esc(f.name)}</div>
        <div style="font-size:12px;color:var(--muted)">${statsHtml}</div>
      </div>
      <div class="mactions">
        <button class="btn btn-cancel">Close</button>
        <button class="btn" id="btn-cmp-again">↺ Try Again</button>
        ${canEat ? `<button class="btn pri" id="btn-cmp-eat">＋ Add to Today</button>` : ''}
      </div>`;
    document.getElementById('btn-cmp-again')?.addEventListener('click', openCompare);
    document.getElementById('btn-cmp-eat')?.addEventListener('click', ()=>{ box.style.maxWidth=''; closeModal(); addServing(f.id); });
    document.querySelector('.btn-cancel')?.addEventListener('click', ()=>{ box.style.maxWidth=''; closeModal(); });
    return;
  }

  const [a, b] = q;

  function cmpCardHtml(f){
    const h = getHealthMetric(f);
    const dispGoals = getDispGoals();
    let statsLines = [`${f.cal} cal`];
    for(const g of dispGoals){
      const v=getMetric(f,g);
      if(g.type==='avg_min'||g.type==='avg_max')
        statsLines.push(`♥ ${v.toFixed(2)}`);
      else
        statsLines.push(`${fmtVal(v,g)}${g.unit?` ${g.unit}`:''} ${g.name.toLowerCase()}`);
    }
    return `<div class="cmp-card" data-cid="${esc(f.id)}">
      <div class="cmp-hbar" style="background:${healthColor(h)}"></div>
      <div class="cmp-body">
        <div class="cmp-name">${esc(f.name)}</div>
        <div class="cmp-stats">${statsLines.join('<br>')}</div>
      </div>
    </div>`;
  }

  box.innerHTML = `
    <h2>⚔ Compare <small style="font-size:.7em;font-weight:400;color:var(--muted)">${q.length} remaining</small></h2>
    <div style="display:flex;gap:10px;align-items:stretch;margin-bottom:10px">
      ${cmpCardHtml(a)}
      <div style="display:flex;align-items:center;font-weight:800;color:var(--muted);flex-shrink:0">VS</div>
      ${cmpCardHtml(b)}
    </div>
    <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:4px">Click a card to keep it — the other is eliminated</div>
    <div class="mactions">
      <button class="btn btn-cancel">Close</button>
    </div>`;

  document.querySelectorAll('.cmp-card').forEach(card => {
    card.addEventListener('click', ()=>{
      const [front1, front2, ...rest] = _cmpQueue;
      const winner = card.dataset.cid === front1.id ? front1 : front2;
      _cmpQueue = [...rest, winner];
      renderCompare();
    });
  });
  document.querySelector('.btn-cancel')?.addEventListener('click', ()=>{ box.style.maxWidth=''; closeModal(); });
}

// ── Tabs / Categories modal ───────────────────
function openCategoriesModal(){
  function showList(){
    const allF=allFoods();
    const rows=S.categories.map((c,i)=>{
      const cnt=allF.filter(f=>getFoodCategory(f)===c.id).length;
      return `<div class="goal-row">
        <div class="goal-info">
          <span class="goal-name">${esc(c.name)}</span>
          <span class="goal-badge">${cnt} food${cnt!==1?'s':''}</span>
        </div>
        <div class="goal-actions" style="gap:3px">
          ${i>0?`<button class="btn btn-sm" data-cat-up="${i}" title="Move up">▲</button>`:'<span style="width:30px"></span>'}
          ${i<S.categories.length-1?`<button class="btn btn-sm" data-cat-dn="${i}" title="Move down">▼</button>`:'<span style="width:30px"></span>'}
          <button class="btn btn-sm" data-cat-ren="${i}">Rename</button>
          ${S.categories.length>1?`<button class="btn btn-sm dng" data-cat-del="${i}">✕</button>`:''}
        </div>
      </div>`;
    }).join('');

    openModal(`<h2>⊞ Tabs</h2>
      <div class="sec-lbl">TABS</div>
      <div style="margin-bottom:14px">${rows}</div>
      <button class="btn pri btn-sm" id="btn-add-cat">＋ Add Tab</button>
      <div class="mactions"><button type="button" class="btn btn-cancel">Close</button></div>`);

    document.getElementById('btn-add-cat').addEventListener('click',()=>showRenameForm(-1));
    document.querySelectorAll('[data-cat-up]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=+btn.dataset.catUp;
        [S.categories[i-1],S.categories[i]]=[S.categories[i],S.categories[i-1]];
        saveState(); closeModal(); showList(); render();
      });
    });
    document.querySelectorAll('[data-cat-dn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=+btn.dataset.catDn;
        [S.categories[i],S.categories[i+1]]=[S.categories[i+1],S.categories[i]];
        saveState(); closeModal(); showList(); render();
      });
    });
    document.querySelectorAll('[data-cat-ren]').forEach(btn=>{
      btn.addEventListener('click',()=>showRenameForm(+btn.dataset.catRen));
    });
    document.querySelectorAll('[data-cat-del]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=+btn.dataset.catDel;
        const cat=S.categories[i];
        const cnt=allFoods().filter(f=>getFoodCategory(f)===cat.id).length;
        if(cnt>0){
          alert(`Cannot delete "${cat.name}" — ${cnt} food${cnt!==1?'s are':' is'} in this tab. Reassign them via Edit Food first.`);
          return;
        }
        if(!confirm(`Delete tab "${cat.name}"?`)) return;
        S.categories.splice(i,1);
        saveState(); render(); closeModal(); showList();
      });
    });
  }

  function showRenameForm(idx){
    const isNew=idx===-1;
    const cur=isNew?'':S.categories[idx].name;
    document.getElementById('mbox').innerHTML=`
      <h2>${isNew?'＋ Add Tab':'Rename Tab'}</h2>
      <div class="fg"><label>Tab name</label>
        <input type="text" id="cat-name-inp" value="${esc(cur)}" style="width:100%" placeholder="e.g. Dining Out"></div>
      <div class="mactions">
        <button class="btn" id="btn-cat-back">← Back</button>
        <button class="btn pri" id="btn-cat-save">${isNew?'Add':'Save'}</button>
      </div>`;
    const inp=document.getElementById('cat-name-inp');
    inp.focus(); inp.select();
    document.getElementById('btn-cat-back').addEventListener('click',()=>{closeModal();showList();});
    document.getElementById('btn-cat-save').addEventListener('click',()=>{
      const name=inp.value.trim();
      if(!name) return;
      if(isNew) S.categories.push({id:'cat-'+Date.now(),name,collapsed:false});
      else S.categories[idx].name=name;
      saveState(); render(); closeModal(); showList();
    });
    inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();document.getElementById('btn-cat-save').click();}});
  }

  showList();
}

// ── Reset Day ─────────────────────────────────
function resetDay(){
  if(!confirm('Clear all eaten foods for today?')) return;
  S.servings={}; S.exCals=0; S.temp=[]; S.excluded={};
  cancelIncFeas();
  S.incFeas=null;
  document.getElementById('ex-input').value='';
  saveState(); render();
}

// ═══════════════════════════════════════════════
//  EVENT LISTENERS
// ═══════════════════════════════════════════════
document.getElementById('btn-add').addEventListener('click', openAddModal);
document.getElementById('btn-ex-presets').addEventListener('click', showPresetPicker);
document.getElementById('btn-library').addEventListener('click', openLibraryModal);
document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('btn-tabs').addEventListener('click', openCategoriesModal);
document.getElementById('btn-compare').addEventListener('click', openCompare);
document.getElementById('btn-reset').addEventListener('click', resetDay);
document.getElementById('sort-sel').addEventListener('change', ev=>{
  S.sort = ev.target.value;
  saveState(); render();
});
document.getElementById('ex-input').addEventListener('input', ev=>{
  S.exCals=Math.max(0,parseInt(ev.target.value)||0);
  cancelPrecomp(); // old precomp used previous exCals
  startIncFeasCompute();
  saveState(); render();
});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadState();
document.getElementById('ex-input').value=S.exCals||'';
document.getElementById('sort-sel').value=S.sort||'name';
render();
if(!precompIsValid()&&!_computing) startPrecompute();
// If foods were already eaten in the restored state, kick off incremental feasibility
startIncFeasCompute();
// Async: attempt to link library file (may reload library data from file)
initLibFile().then(()=>{
  render();
  if(!precompIsValid()&&!_computing) startPrecompute();
  startIncFeasCompute();
});
</script>
</body>
</html>
